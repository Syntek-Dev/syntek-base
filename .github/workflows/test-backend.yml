name: test-backend

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/django/**"
      - "code/src/docker/backend/Dockerfile.test"
      - "code/src/docker/backend/entrypoint.test.sh"
      - "code/src/docker/docker-compose.test.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/django/**"
      - "code/src/docker/backend/Dockerfile.test"
      - "code/src/docker/backend/entrypoint.test.sh"
      - "code/src/docker/docker-compose.test.yml"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  pytest:
    name: pytest + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      COMPOSE_FILE: code/src/docker/docker-compose.test.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env.test
        run: |
          cp code/src/docker/.env.test.example code/src/docker/.env.test
          echo "SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}" >> code/src/docker/.env.test

      - name: Build django-test image
        run: docker compose -f $COMPOSE_FILE build django-test

      - name: Start db and cache
        run: docker compose -f $COMPOSE_FILE up -d db cache

      - name: Wait for database
        run: |
          for i in $(seq 1 30); do
            docker compose -f $COMPOSE_FILE exec db \
              pg_isready -U <%PROJECT_SLUG%> -d <%PROJECT_SLUG%>_test && break
            echo "Waiting for db... ($i/30)"
            sleep 2
          done

      - name: Determine coverage threshold
        id: threshold
        run: |
          BRANCH="${{ github.base_ref || github.ref_name }}"
          if [[ "$BRANCH" == "main" || "$BRANCH" == "staging" ]]; then
            echo "value=80" >> "$GITHUB_OUTPUT"
          else
            echo "value=75" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pytest with coverage (two phases)
        run: |
          mkdir -p reports
          docker compose -f $COMPOSE_FILE --env-file code/src/docker/.env.test run --rm \
            -v "${{ github.workspace }}/reports:/workspace/reports" \
            django-test bash -c "
              pytest -m unit \
                --cov=apps \
                --cov-branch \
                --cov-report= &&
              pytest -m integration \
                --cov=apps \
                --cov-branch \
                --cov-append \
                --cov-fail-under=${{ steps.threshold.outputs.value }} \
                --cov-report=xml:/workspace/reports/coverage.xml \
                --cov-report=term-missing &&
              coverage report --include='apps/users/*' --fail-under=90
            "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: reports/coverage.xml
          retention-days: 30

      - name: Post coverage comment
        if: always() && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: reports/coverage.xml
          title: Backend Coverage

      - name: Tear down
        if: always()
        run: docker compose -f $COMPOSE_FILE down -v
