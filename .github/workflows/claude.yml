name: Claude Code

# Claude AI assistant: triggered by @claude mentions in issues, PRs, and reviews.
# CI quality gate: mirrors the 8 checks in .claude/hooks/pre-pr-check.sh.
#   Checks [1/8]–[6/8] and [8/8] run natively (no Docker needed).
#   Check [7/8] drives docker-compose.test.yml, exactly as test.yml does. The
#   compose file is the ONE definition of the test db and cache.
#   Coverage thresholds match the hooks: 75% pytest floor always, 80% CI floor on
#   staging/main (same logic as _apply_coverage_floor in check-tests.sh).
#
# LOCKFILE GUARD — read this before touching any `uv` step below.
# uv.lock is ABSENT BY DESIGN in the base template: it would pin the root project under
# the literal project-slug token, so Copier generates it at generation time and removes
# the ignore rule (see the root CONTEXT.md). Every `uv sync --frozen` here therefore
# cannot resolve in THIS repository, which made six of these eight gates fail on every
# single push and pull request raised against the template.
#
# The fix is the same one test.yml/test-api.yml/test-e2e.yml already carry: a
# `Detect the backend lockfile` step, and `if:` on the steps that need the lockfile — so
# the job reports SUCCESS where there is nothing to run, rather than failing or skipping.
#
# Guarded at STEP level, not job level, and deliberately so: the JS half of these jobs
# (pnpm install, prettier, eslint, pnpm audit) works perfectly well in the template and
# genuinely gates its docs, configs and scripts. Guarding the whole job would throw that
# away to fix the Python half. Only the `uv` steps are conditional.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]
  pull_request:
    branches: [main, staging, dev, testing]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

env:
  UV_VERSION: "0.12.4"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"

jobs:
  # ── Claude AI Assistant ──────────────────────────────────────────────────────
  claude:
    name: Claude AI
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      deployments: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # ── [1/8] Line Count ────────────────────────────────────────────────────────
  # Mirrors check-cloc.sh: wc -l enforcement (≥800 = error) via cloc.sh.
  cloc:
    name: "[1/8] Line Count"
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cloc
        run: sudo apt-get install -y --no-install-recommends cloc
      - name: Check file line counts
        run: bash code/src/scripts/audits/cloc.sh

  # ── [2/8] Lockfile Alignment ─────────────────────────────────────────────────
  # Mirrors check-lockfiles.sh: verifies uv.lock and pnpm-lock.yaml are consistent.
  # Does not replicate the Docker-vs-local drift check (local-only concern).
  lockfiles:
    name: "[2/8] Lockfile Alignment"
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # THE reason this workflow was red on main from 03/08/2026: in
          # syntek-base there is never anything to cache. uv.lock is absent by
          # design, so `uv sync --frozen` is skipped, uv installs nothing, and
          # the cache directory is never created — then the action's POST step
          # fails saving it ("Cache path … does not exist on disk") and the job
          # reports failure with every real step green.
          #
          # `ignore-nothing-to-cache` rather than `enable-cache: false`, because
          # this workflow SHIPS: a generated project HAS a uv.lock, does populate
          # the cache, and should keep it. One value is correct on both sides of
          # the template boundary, which beats conditionalising the workflow.
          #
          # Not fixed by upgrading the action — the behaviour is identical up to
          # v10 and this input is still how you opt out of it.
          # Source: https://github.com/astral-sh/setup-uv/blob/main/docs/caching.md
          ignore-nothing-to-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      # See the LOCKFILE GUARD note at the top of this file.
      - name: Detect the backend lockfile
        id: detect
        run: |
          if [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "uv.lock present — checking Python lockfile alignment."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock — this is the base template, not a generated project."
            echo "Copier writes it at generation time. Checking the JS lockfile only."
          fi
      - name: Python — uv sync --frozen
        if: steps.detect.outputs.present == 'true'
        run: uv sync --frozen
        working-directory: code/src/django
      - name: JS — pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile

  # ── [3/8] Format ─────────────────────────────────────────────────────────────
  # Mirrors check-format.sh: ruff format --check (Python) + prettier --check (repo-wide).
  format:
    name: "[3/8] Format"
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # THE reason this workflow was red on main from 03/08/2026: in
          # syntek-base there is never anything to cache. uv.lock is absent by
          # design, so `uv sync --frozen` is skipped, uv installs nothing, and
          # the cache directory is never created — then the action's POST step
          # fails saving it ("Cache path … does not exist on disk") and the job
          # reports failure with every real step green.
          #
          # `ignore-nothing-to-cache` rather than `enable-cache: false`, because
          # this workflow SHIPS: a generated project HAS a uv.lock, does populate
          # the cache, and should keep it. One value is correct on both sides of
          # the template boundary, which beats conditionalising the workflow.
          #
          # Not fixed by upgrading the action — the behaviour is identical up to
          # v10 and this input is still how you opt out of it.
          # Source: https://github.com/astral-sh/setup-uv/blob/main/docs/caching.md
          ignore-nothing-to-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      # See the LOCKFILE GUARD note at the top of this file.
      - name: Detect the backend lockfile
        id: detect
        run: |
          if [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock — base template. Running Prettier only."
          fi
      - if: steps.detect.outputs.present == 'true'
        run: uv sync --frozen
        working-directory: code/src/django
      - run: pnpm install --frozen-lockfile
      - name: Python — ruff format --check
        if: steps.detect.outputs.present == 'true'
        run: uv run ruff format --check .
        working-directory: code/src/django
      - name: Prettier — --check
        run: pnpm exec prettier --check .

  # ── [4/8] Lint ───────────────────────────────────────────────────────────────
  # Mirrors check-lint.sh: ruff check (Python) + eslint (JS).
  lint:
    name: "[4/8] Lint"
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # THE reason this workflow was red on main from 03/08/2026: in
          # syntek-base there is never anything to cache. uv.lock is absent by
          # design, so `uv sync --frozen` is skipped, uv installs nothing, and
          # the cache directory is never created — then the action's POST step
          # fails saving it ("Cache path … does not exist on disk") and the job
          # reports failure with every real step green.
          #
          # `ignore-nothing-to-cache` rather than `enable-cache: false`, because
          # this workflow SHIPS: a generated project HAS a uv.lock, does populate
          # the cache, and should keep it. One value is correct on both sides of
          # the template boundary, which beats conditionalising the workflow.
          #
          # Not fixed by upgrading the action — the behaviour is identical up to
          # v10 and this input is still how you opt out of it.
          # Source: https://github.com/astral-sh/setup-uv/blob/main/docs/caching.md
          ignore-nothing-to-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      # See the LOCKFILE GUARD note at the top of this file.
      - name: Detect the backend lockfile
        id: detect
        run: |
          if [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock — base template. Running ESLint only."
          fi
      - if: steps.detect.outputs.present == 'true'
        run: uv sync --frozen
        working-directory: code/src/django
      - run: pnpm install --frozen-lockfile
      - name: Python — ruff check
        if: steps.detect.outputs.present == 'true'
        run: uv run ruff check .
        working-directory: code/src/django
      - name: JS — eslint
        run: pnpm exec eslint .

  # ── [5/8] Stub Audit ─────────────────────────────────────────────────────────
  # Mirrors check-stubs.sh: grep-based hard-stub detection via stubs.sh.
  stubs:
    name: "[5/8] Stub Audit"
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for hard stubs
        run: bash code/src/scripts/audits/stubs.sh

  # ── [6/8] Type-check ─────────────────────────────────────────────────────────
  # Mirrors check-typecheck.sh: basedpyright (Python). There is no TypeScript.
  typecheck:
    name: "[6/8] Type-check"
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # THE reason this workflow was red on main from 03/08/2026: in
          # syntek-base there is never anything to cache. uv.lock is absent by
          # design, so `uv sync --frozen` is skipped, uv installs nothing, and
          # the cache directory is never created — then the action's POST step
          # fails saving it ("Cache path … does not exist on disk") and the job
          # reports failure with every real step green.
          #
          # `ignore-nothing-to-cache` rather than `enable-cache: false`, because
          # this workflow SHIPS: a generated project HAS a uv.lock, does populate
          # the cache, and should keep it. One value is correct on both sides of
          # the template boundary, which beats conditionalising the workflow.
          #
          # Not fixed by upgrading the action — the behaviour is identical up to
          # v10 and this input is still how you opt out of it.
          # Source: https://github.com/astral-sh/setup-uv/blob/main/docs/caching.md
          ignore-nothing-to-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      # See the LOCKFILE GUARD note at the top of this file. This gate is Python-only, so
      # everything below is conditional and the job reports success with nothing to run.
      - name: Detect the backend lockfile
        id: detect
        run: |
          if [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock — base template. There is no Python environment to type-check."
          fi
      - if: steps.detect.outputs.present == 'true'
        run: uv sync --frozen
        working-directory: code/src/django
      - if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Python — basedpyright
        if: steps.detect.outputs.present == 'true'
        run: uv run basedpyright

  # ── [7/8] Tests ──────────────────────────────────────────────────────────────
  # Mirrors check-tests.sh + _apply_coverage_floor. Coverage thresholds:
  #   - 75% pytest --cov-fail-under floor (always, matches backend-coverage.sh)
  #   - 80% CI floor on staging/main (matches _apply_coverage_floor in check-tests.sh)
  #
  # NO `services:` BLOCK — and it must stay that way. This job used to declare
  # GitHub service containers for db and cache, duplicating the pair already
  # defined in docker-compose.test.yml. That duplicate cost two defects:
  #
  #   1. Its postgres --health-cmd interpolated the project-slug token. Docker runs
  #      a health command through `/bin/sh -c`, and the token's angle brackets are
  #      REDIRECTION OPERATORS there — so before generation the shell read them as
  #      redirects, failed to open the file they named, and never executed
  #      pg_isready at all. The container was marked unhealthy while the database
  #      was serving normally, on every run from 03/08/2026. A template token is
  #      only ever safe in a shell string if nothing runs that string before
  #      generation renders it.
  #
  #   2. Service containers initialise BEFORE the first step, so the lockfile
  #      guard below — which is correct, and which every sibling relies on — was
  #      unreachable. A step-level guard cannot gate a service container.
  #
  # Both vanish by letting compose own the stack: nothing starts until a guarded
  # step starts it. Any future db/cache need goes through docker-compose.test.yml,
  # never through a `services:` block here.
  tests:
    name: "[7/8] Tests"
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      COMPOSE_FILE: code/src/docker/docker-compose.test.yml
    steps:
      - uses: actions/checkout@v7
      # See the LOCKFILE GUARD note at the top of this file. This gate is Python-only, so
      # everything below is conditional and the job reports success with nothing to run.
      # test.yml's `pytest + coverage` job carries the identical guard.
      #
      # This step is now genuinely the first thing that happens in the job. While the
      # `services:` block existed it was not: containers initialised ahead of it, so the
      # guard could never be reached and the job died before checkout.
      - name: Detect the backend lockfile
        id: detect
        run: |
          if [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock — base template. There is no test suite to run."
          fi

      - name: Create .env.test
        if: steps.detect.outputs.present == 'true'
        run: |
          cp code/src/docker/.env.test.example code/src/docker/.env.test
          echo "SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}" >> code/src/docker/.env.test

      - name: Build django-test image
        if: steps.detect.outputs.present == 'true'
        run: docker compose -f $COMPOSE_FILE build django-test

      # `--wait` holds until both healthchecks report healthy, so no hand-rolled
      # readiness loop is needed and a sick container fails here rather than midway
      # through pytest. The healthchecks are the compose file's own.
      - name: Start db and cache
        if: steps.detect.outputs.present == 'true'
        run: docker compose -f $COMPOSE_FILE up -d --wait db cache

      # pytest runs INSIDE django-test, on the compose network, reaching the database
      # at `db:5432` — the address the compose file already gives it. Nothing is
      # published to the host and no DATABASE_URL is restated here.
      - name: Backend — pytest
        if: steps.detect.outputs.present == 'true'
        run: |
          mkdir -p reports
          if [[ "$GITHUB_REF" == "refs/heads/staging" || "$GITHUB_REF" == "refs/heads/main" || \
                "$GITHUB_BASE_REF" == "staging" || "$GITHUB_BASE_REF" == "main" ]]; then
            docker compose -f $COMPOSE_FILE --env-file code/src/docker/.env.test run --rm \
              -v "${{ github.workspace }}/reports:/workspace/reports" \
              django-test pytest \
                --cov=apps --cov-branch --cov-fail-under=75 \
                --cov-report="html:/workspace/reports/html" \
                --cov-report="xml:/workspace/reports/coverage.xml" \
                --cov-report=term-missing \
                --junit-xml="/workspace/reports/results.xml"
          else
            docker compose -f $COMPOSE_FILE --env-file code/src/docker/.env.test run --rm \
              -v "${{ github.workspace }}/reports:/workspace/reports" \
              django-test pytest --junit-xml="/workspace/reports/results.xml"
          fi

      - name: Enforce 80% coverage floor (staging/main)
        if: |
          steps.detect.outputs.present == 'true' &&
          (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' ||
           github.base_ref == 'staging' || github.base_ref == 'main')
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, json, sys
          THRESHOLD = 80
          failed = []
          try:
              root = ET.parse('reports/coverage.xml').getroot()
              pct = int(float(root.get('line-rate', 0)) * 100)
              print(f'Backend:  {pct}%')
              if pct < THRESHOLD:
                  failed.append(f'backend {pct}% (requires {THRESHOLD}%)')
          except Exception as e:
              print(f'Backend coverage report missing: {e}')
              failed.append('backend coverage report missing')
          if failed:
              print(f'\n80% floor not met: {", ".join(failed)}')
              sys.exit(1)
          print('Coverage floor met.')
          EOF

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports-${{ github.run_id }}
          path: |
            reports/
          if-no-files-found: ignore

      - name: Backend — post coverage comment
        if: |
          always() &&
          steps.detect.outputs.present == 'true' &&
          github.event_name == 'pull_request' &&
          (github.base_ref == 'staging' || github.base_ref == 'main')
        uses: MishaKav/pytest-coverage-comment@v1.11.0
        with:
          pytest-xml-coverage-path: reports/coverage.xml
          title: Backend Coverage

      # `-v` too: the db uses a tmpfs, but the compose project outlives the job on a
      # self-hosted runner if it is not torn down.
      - name: Tear down
        if: always() && steps.detect.outputs.present == 'true'
        run: docker compose -f $COMPOSE_FILE down -v

  # ── [8/8] Security ───────────────────────────────────────────────────────────
  # Mirrors check-security.sh: ruff --select S (Python) + pnpm audit --audit-level low (JS).
  # Uses Ruff's built-in flake8-bandit (S) rules — no separate bandit install needed.
  security:
    name: "[8/8] Security"
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # THE reason this workflow was red on main from 03/08/2026: in
          # syntek-base there is never anything to cache. uv.lock is absent by
          # design, so `uv sync --frozen` is skipped, uv installs nothing, and
          # the cache directory is never created — then the action's POST step
          # fails saving it ("Cache path … does not exist on disk") and the job
          # reports failure with every real step green.
          #
          # `ignore-nothing-to-cache` rather than `enable-cache: false`, because
          # this workflow SHIPS: a generated project HAS a uv.lock, does populate
          # the cache, and should keep it. One value is correct on both sides of
          # the template boundary, which beats conditionalising the workflow.
          #
          # Not fixed by upgrading the action — the behaviour is identical up to
          # v10 and this input is still how you opt out of it.
          # Source: https://github.com/astral-sh/setup-uv/blob/main/docs/caching.md
          ignore-nothing-to-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      # See the LOCKFILE GUARD note at the top of this file. `pnpm audit` is unguarded and
      # keeps scanning the template's own JS dependency tree.
      - name: Detect the backend lockfile
        id: detect
        run: |
          if [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock — base template. Auditing the JS dependency tree only."
          fi
      - if: steps.detect.outputs.present == 'true'
        run: uv sync --frozen
        working-directory: code/src/django
      - run: pnpm install --frozen-lockfile
      - name: Python — ruff security (flake8-bandit rules)
        if: steps.detect.outputs.present == 'true'
        run: uv run ruff check --select S .
        working-directory: code/src/django
      - name: JS — pnpm audit
        run: pnpm audit --audit-level low
      - name: Python — pip-audit (CVE scan)
        if: steps.detect.outputs.present == 'true'
        run: uv run pip-audit --requirement <(uv export --format requirements-txt --no-hashes)
        working-directory: code/src/django
