name: Audit — Inline Gradients

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "**/*.css"
      - "code/src/scripts/audits/css-gradients.sh"
      - ".github/workflows/audit-css-gradients.yml"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "**/*.css"
      - "code/src/scripts/audits/css-gradients.sh"
      - ".github/workflows/audit-css-gradients.yml"
  workflow_dispatch:

jobs:
  css-gradients:
    name: Inline-gradient audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run inline-gradient audit
        run: bash code/src/scripts/audits/css-gradients.sh --output md

      - name: Upload inline-gradient report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: css-gradients-report
          path: code/src/scripts/audits/reports/css-gradients-report.md
          if-no-files-found: ignore
