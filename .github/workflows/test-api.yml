name: test-api

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/tests/api/**"
      - "code/src/django/**"
      - "code/src/docker/docker-compose.test.yml"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/tests/api/**"
      - "code/src/django/**"
      - "code/src/docker/docker-compose.test.yml"
  workflow_dispatch:
    inputs:
      env:
        description: "Bruno environment (docker | staging | production)"
        required: false
        default: "docker"
      folder:
        description: "Subfolder to run (e.g. auth, users — leave empty for all)"
        required: false
        default: ""

jobs:
  bruno:
    name: Bruno API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      # COMPOSE_FILE, BRUNO_ENV and COLLECTION are gone with the hand-rolled steps: api.sh
      # owns the compose file, defaults to the `host` environment a runner can actually reach,
      # and resolves the collection from its own location. COLLECTION was `/workspace/...` — a
      # path inside the container, left over from when Bruno ran in one.
      # Seeded into the fixture users AND sent by Bruno at login — must be identical, or
      # adminLogin returns "Email or password incorrect". Fall back to the non-secret test
      # defaults (also used by docker-compose.test.yml) when the secrets are not configured.
      API_TEST_PW: ${{ secrets.API_TEST_PASSWORD || 'Test@Api2026!' }}
      API_LIMITED_PW: ${{ secrets.API_LIMITED_PASSWORD || 'Limited@Api2026!' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # See the equivalent guard in test.yml. uv.lock is COMMITTED as of 16/08/2026, so this
      # guard takes its present branch and the API suite runs here. It stays because this
      # workflow SHIPS: every Dockerfile builds with `COPY pyproject.toml uv.lock ./`, and a
      # generated project has no lock of its own until the `uv lock` copier task has written
      # one, so the django-test image cannot build in that window. The guard is what keeps
      # one file correct on both sides of the template boundary — report success there
      # rather than failing on a pull request with nothing to test.
      - name: Detect the backend lockfile
        id: detect
        run: |
          if [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "uv.lock present — running the API suite."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock yet — the django-test image cannot build."
          fi

      # See the note in test-e2e.yml: `.env.test.example` ships a working SECRET_KEY, compose
      # reads an env file last-assignment-wins, so appending an unset secret empties it and
      # `${SECRET_KEY:?...}` then refuses to start the stack. The fallback keeps the step
      # additive when the secret is absent, which is its only job.
      # The suite is `pnpm exec bru run`, and @usebruno/cli is a devDependency in the root
      # package.json — so this job needs Node, pnpm AND an install. It had none of the three
      # and died at `pnpm: command not found`, after standing up the whole Docker stack. The
      # path filter is what hid it: this workflow only runs when code/src/tests/api/**,
      # code/src/django/** or the test compose file changes, so it had not fired since the
      # steps that need pnpm were written. Guarded on the same detect step as everything
      # else, so a project without a lockfile still reports rather than skipping.
      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "24"
          cache: pnpm

      - name: Install the Bruno CLI
        if: steps.detect.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Create .env.test
        if: steps.detect.outputs.present == 'true'
        run: |
          cp code/src/docker/.env.test.example code/src/docker/.env.test
          echo "SECRET_KEY=${{ secrets.TEST_SECRET_KEY || 'ci-ephemeral-not-for-production-0000000000' }}" >> code/src/docker/.env.test

      # ONE STEP, because code/src/scripts/tests/api.sh already is this procedure — and
      # `.claude/CLAUDE.md` makes it non-negotiable that dev operations run through the
      # scripts rather than being re-typed into a workflow. What stood here was a hand-rolled
      # second copy that had drifted from the script in every way that matters, and each
      # divergence was its own red run:
      #
      #   * it started `db cache django-test` and NOT nginx, then pointed Bruno at the
      #     `docker` environment — whose api_url is `http://django-test:8000`, a compose
      #     service name resolvable only from inside the network. Bruno runs on the RUNNER,
      #     so it failed `getaddrinfo EAI_AGAIN django-test`. api.sh starts nginx (published
      #     on 127.0.0.1:83) and defaults to `--env host`, which is what a host runner needs.
      #   * `host`'s own api_url is `http://test.<%PROJECT_SLUG%>.localhost:83`, still an
      #     unrendered Copier token in syntek-base — so api.sh detects that and falls back to
      #     `http://localhost:83`, explicitly "in CI as well, where nobody is present to set
      #     the override". The workflow had no such branch and could not have had one.
      #   * two hand-rolled 30x2s wait loops instead of `up --wait`, which reads the compose
      #     healthchecks that are already defined.
      #   * a stale NOTE claiming the fixture-user seed command was gone. api.sh probes for
      #     it and seeds when present, which is the behaviour the note said was missing.
      #   * no teardown. api.sh traps EXIT and brings the stack down with its volumes.
      #
      # api.sh exits 0 on an empty collection, 1 on test failures, 2 on script error, so the
      # job's own pass/fail is unchanged. `--output` must sit inside the project root.
      - name: Run the Bruno API suite
        if: steps.detect.outputs.present == 'true'
        env:
          BRUNO_VAR_test_password: ${{ env.API_TEST_PW }}
          BRUNO_VAR_limited_password: ${{ env.API_LIMITED_PW }}
        run: |
          bash code/src/scripts/tests/api.sh \
            --output "$GITHUB_WORKSPACE/reports/api" \
            ${{ github.event.inputs.env && format('--env {0}', github.event.inputs.env) || '' }} \
            ${{ github.event.inputs.folder && format('--folder {0}', github.event.inputs.folder) || '' }}

      - name: Upload test results
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bruno-api-results
          path: reports/api/results.json
          retention-days: 30

      - name: Generate API test summary
        if: always() && steps.detect.outputs.present == 'true' && github.event_name == 'pull_request'
        run: |
          python3 - <<'EOF'
          import json, os
          os.makedirs('reports/api', exist_ok=True)
          try:
              with open('reports/api/results.json') as f:
                  data = json.load(f)
              results = data if isinstance(data, list) else [data]
              total_req = passed_req = failed_req = error_req = 0
              total_tests = passed_tests = failed_tests = 0
              for r in results:
                  s = r.get('summary', {})
                  total_req    += s.get('totalRequests',  0)
                  passed_req   += s.get('passedRequests', 0)
                  failed_req   += s.get('failedRequests', 0)
                  error_req    += s.get('errorRequests',  0)
                  total_tests  += s.get('totalTests',     0)
                  passed_tests += s.get('passedTests',    0)
                  failed_tests += s.get('failedTests',    0)
              bad = failed_req + error_req + failed_tests
              status = '✅ Passed' if bad == 0 else '❌ Failed'
              body = '\n'.join([
                  f'## API Tests — {status}',
                  '',
                  '| | Requests | Tests |',
                  '|---|---|---|',
                  f'| Total  | {total_req} | {total_tests} |',
                  f'| Passed | {passed_req} | {passed_tests} |',
                  f'| Failed / Error | {failed_req + error_req} | {failed_tests} |',
              ])
          except Exception as e:
              body = f'## API Tests\n\n⚠️ Could not parse results: {e}'
          with open('reports/api/comment.md', 'w') as f:
              f.write(body)
          EOF

      - name: Post API test comment
        if: always() && steps.detect.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: api-tests
          path: reports/api/comment.md

      # No tear-down step, for the reason claude.yml's backend-coverage job gives verbatim:
      # api.sh traps EXIT and brings the stack down with its volumes on every path, and a
      # second `down -v` here would be another place that knows how this stack is composed.
