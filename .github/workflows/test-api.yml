name: test-api

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/tests/api/**"
      - "code/src/django/**"
      - "code/src/docker/docker-compose.test.yml"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/tests/api/**"
      - "code/src/django/**"
      - "code/src/docker/docker-compose.test.yml"
  workflow_dispatch:
    inputs:
      env:
        description: "Bruno environment (docker | staging | production)"
        required: false
        default: "docker"
      folder:
        description: "Subfolder to run (e.g. auth, users — leave empty for all)"
        required: false
        default: ""

jobs:
  bruno:
    name: Bruno API tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      COMPOSE_FILE: code/src/docker/docker-compose.test.yml
      BRUNO_ENV: ${{ github.event.inputs.env || 'docker' }}
      COLLECTION: /workspace/code/src/tests/api
      # Seeded into the fixture users AND sent by Bruno at login — must be identical, or
      # adminLogin returns "Email or password incorrect". Fall back to the non-secret test
      # defaults (also used by docker-compose.test.yml) when the secrets are not configured.
      API_TEST_PW: ${{ secrets.API_TEST_PASSWORD || 'Test@Api2026!' }}
      API_LIMITED_PW: ${{ secrets.API_LIMITED_PASSWORD || 'Limited@Api2026!' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # See the equivalent guard in test.yml. uv.lock is COMMITTED as of 16/08/2026, so this
      # guard takes its present branch and the API suite runs here. It stays because this
      # workflow SHIPS: every Dockerfile builds with `COPY pyproject.toml uv.lock ./`, and a
      # generated project has no lock of its own until the `uv lock` copier task has written
      # one, so the django-test image cannot build in that window. The guard is what keeps
      # one file correct on both sides of the template boundary — report success there
      # rather than failing on a pull request with nothing to test.
      - name: Detect the backend lockfile
        id: detect
        run: |
          if [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "uv.lock present — running the API suite."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock yet — the django-test image cannot build."
          fi

      - name: Create .env.test
        if: steps.detect.outputs.present == 'true'
        run: |
          cp code/src/docker/.env.test.example code/src/docker/.env.test
          echo "SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}" >> code/src/docker/.env.test

      - name: Build images
        if: steps.detect.outputs.present == 'true'
        run: docker compose -f $COMPOSE_FILE build django-test

      - name: Start db and cache
        if: steps.detect.outputs.present == 'true'
        run: docker compose -f $COMPOSE_FILE up -d db cache

      # WHY BOTH WAIT LOOPS LOOK LIKE THIS. Three constraints, each of which was breached
      # here at once, and each of which fails SILENTLY when breached.
      #
      # 1. THE PROBE EXPANDS INSIDE THE CONTAINER — `sh -c` plus single quotes. A copier
      #    token is not a name in a shell word: its delimiters are legal and ACTIVE, so
      #    `-U` followed by one is a redirection, the runner goes looking for a file, the
      #    probe never executes and the loop cannot tell. Expanding on the runner instead
      #    is the same trap one step further on — this job's `env:` sets no POSTGRES_USER,
      #    so a double-quoted "$POSTGRES_USER" would pass an empty string and fail open.
      #    Single quotes keep the expansion container-side, which is exactly what
      #    docker-compose.test.yml's healthcheck achieves with `$$`.
      #
      # 2. THE LOOP MUST END `exit 1`. `for ... && break ... done` with no failure path
      #    exits 0 whether or not the service came up, so the fault surfaces at the first
      #    step that CAN fail — two minutes later, in another file, as somebody else's bug.
      #    test-e2e.yml carries the same shape written correctly.
      #
      # 3. `exec -T`. Every other `docker compose exec` in this repository has it; these
      #    two were the only ones without.
      - name: Wait for database
        if: steps.detect.outputs.present == 'true'
        run: |
          for i in $(seq 1 30); do
            if docker compose -f $COMPOSE_FILE exec -T db \
              sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then
              echo "db is up"; exit 0
            fi
            echo "Waiting for db... ($i/30)"
            sleep 2
          done
          echo "db did not come up in 60s" >&2
          docker compose -f $COMPOSE_FILE logs db || true
          exit 1

      - name: Start backend
        if: steps.detect.outputs.present == 'true'
        run: docker compose -f $COMPOSE_FILE up -d django-test

      # /health/ is the dedicated liveness route (apps.health), and the one this stack's own
      # healthcheck probes. /control/ is Django's admin behind the CONFIGURABLE
      # DJANGO_ADMIN_PATH: its 302 proved liveness by accident, and a deployment that moves
      # the prefix breaks the probe for a reason nobody would look for here.
      - name: Wait for backend
        if: steps.detect.outputs.present == 'true'
        run: |
          for i in $(seq 1 30); do
            if docker compose -f $COMPOSE_FILE exec -T django-test \
              curl -sf -o /dev/null http://localhost:8000/health/; then
              echo "backend is up"; exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "backend did not come up in 60s" >&2
          docker compose -f $COMPOSE_FILE logs django-test || true
          exit 1

      # NOTE: the API test users were seeded by a management command that the Django
      # baseline no longer carries. Reinstate a seed step alongside the first
      # authenticated endpoint, or the authenticated requests will fail at login.

      - name: Run Bruno API tests
        if: steps.detect.outputs.present == 'true'
        run: |
          mkdir -p reports/api
          FOLDER="${{ github.event.inputs.folder }}"
          RUN_PATH="${FOLDER:-.}"
          # `-r` is required: without it, an explicit path (".") runs only the .bru files in
          # that directory, not subfolders — which is why the suite previously reported a single
          # request. The CLI honours neither bruno.json `ignore` nor `meta { skip }`; exclusion
          # is by tag. `manual` = can't pass in a normal run (rate-limit). `wip` = blocked on
          # test infra not present here (seeded SEO/client/blog data, Cloudinary mock, the
          # unimplemented user(id) query). See BUG-API-SUITE-UNRUN-09-06-2026.md. The request
          # template lives outside the collection root so recursion never executes it.
          BRUNO_VAR_test_password="$API_TEST_PW" \
          BRUNO_VAR_limited_password="$API_LIMITED_PW" \
          pnpm exec bru run -r "$RUN_PATH" \
            --cwd code/src/tests/api \
            --env "$BRUNO_ENV" \
            --exclude-tags manual,wip \
            --reporter-json reports/api/results.json

      - name: Upload test results
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bruno-api-results
          path: reports/api/results.json
          retention-days: 30

      - name: Generate API test summary
        if: always() && steps.detect.outputs.present == 'true' && github.event_name == 'pull_request'
        run: |
          python3 - <<'EOF'
          import json, os
          os.makedirs('reports/api', exist_ok=True)
          try:
              with open('reports/api/results.json') as f:
                  data = json.load(f)
              results = data if isinstance(data, list) else [data]
              total_req = passed_req = failed_req = error_req = 0
              total_tests = passed_tests = failed_tests = 0
              for r in results:
                  s = r.get('summary', {})
                  total_req    += s.get('totalRequests',  0)
                  passed_req   += s.get('passedRequests', 0)
                  failed_req   += s.get('failedRequests', 0)
                  error_req    += s.get('errorRequests',  0)
                  total_tests  += s.get('totalTests',     0)
                  passed_tests += s.get('passedTests',    0)
                  failed_tests += s.get('failedTests',    0)
              bad = failed_req + error_req + failed_tests
              status = '✅ Passed' if bad == 0 else '❌ Failed'
              body = '\n'.join([
                  f'## API Tests — {status}',
                  '',
                  '| | Requests | Tests |',
                  '|---|---|---|',
                  f'| Total  | {total_req} | {total_tests} |',
                  f'| Passed | {passed_req} | {passed_tests} |',
                  f'| Failed / Error | {failed_req + error_req} | {failed_tests} |',
              ])
          except Exception as e:
              body = f'## API Tests\n\n⚠️ Could not parse results: {e}'
          with open('reports/api/comment.md', 'w') as f:
              f.write(body)
          EOF

      - name: Post API test comment
        if: always() && steps.detect.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: api-tests
          path: reports/api/comment.md

      - name: Tear down
        if: always() && steps.detect.outputs.present == 'true'
        run: docker compose -f $COMPOSE_FILE down -v
