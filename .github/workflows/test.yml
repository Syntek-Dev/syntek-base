# Every test suite, both surfaces. Renamed from test-backend.yml when the optional mobile
# surface arrived: a stack-neutral name is what lets one workflow hold both job sets.
#
# ELIGIBLE FOR THE REQUIRED SET — every job below. They are unfiltered, carry no job-level
# guard, and run on every pull request, which is criterion 1 of
# project-management/docs/git/PR-AND-REQUIRED-CHECKS.md → What earns a place in the required
# set. Membership is a branch-protection decision, not a file change, and this file ships: the
# mobile jobs do not exist at all in a project generated without that surface. Read the live set
# with the `gh api` block in that guide's `Changing the set`.
name: test

# No path filter, deliberately — the same reasoning as the lint workflows. These jobs are
# required status checks, and a path-filtered workflow never reports on a pull request
# that misses its paths, leaving the merge blocked on an "Expected" check that will never
# arrive. That failure mode is worse than the runtime. It matters more here than anywhere
# else, because the paths would now have to cover two surfaces: a filter listing only the
# Django paths would silently stop gating mobile changes.
on:
  push:
    branches: [main, staging, dev, testing]
  pull_request:
    branches: [main, staging, dev, testing]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      COMPOSE_FILE: code/src/docker/docker-compose.test.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Guarded at STEP level on the lockfile, for the same reason the mobile jobs guard on
      # the mobile directory: the job reports SUCCESS where there is nothing to run, rather
      # than failing or skipping.
      #
      # uv.lock is COMMITTED as of 16/08/2026, so this guard now takes its present branch
      # and the suite runs here. It stays because this workflow SHIPS and the guard is what
      # makes one file correct on both sides of the template boundary.
      # Until then the lock was absent by design — it would have pinned the root project
      # under the literal project-slug token — and every Dockerfile builds with
      # `COPY pyproject.toml uv.lock ./`, so the image could not be built in the template
      # at all. Without the guard the job failed on every pull request raised against the
      # template, which made the check unusable as a required status check.
      - name: Detect the backend lockfile
        id: detect
        run: |
          if [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "uv.lock present — running the backend suite."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock — this is the base template, not a generated project."
            echo "The Django image cannot build without it. Nothing to test."
          fi

      - name: Create .env.test
        if: steps.detect.outputs.present == 'true'
        run: |
          cp code/src/docker/.env.test.example code/src/docker/.env.test
          echo "SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}" >> code/src/docker/.env.test

      # The promotion tier, keyed off the PR's BASE branch: a PR into dev, staging or main
      # is promoting work that has already been merged once. The local half reaches the same
      # answer from the other side, keying off the branch you are ON (pre-pr-check.sh, where
      # `testing` and above is the promotion tier — a PR from `testing` has base `dev`).
      # Both numbers are owned by code/docs/testing/COVERAGE.md; change the guide first.
      - name: Determine coverage threshold
        if: steps.detect.outputs.present == 'true'
        id: threshold
        run: |
          BRANCH="${{ github.base_ref || github.ref_name }}"
          case "$BRANCH" in
            dev | staging | main) echo "value=80" >> "$GITHUB_OUTPUT" ;;
            *) echo "value=75" >> "$GITHUB_OUTPUT" ;;
          esac

      # One gate, called from both sides. This step used to hand-roll `docker compose run`
      # with its own pytest and coverage invocations, which made CI a SECOND copy of the
      # gate — and it was the copy that rotted. Its auth leg hardcoded the identity app,
      # `--include='apps/users/*' --fail-under=90`, which was wrong in two directions at
      # once: `users` is only the DEFAULT answer to the IDENTITY_APP question, so a project
      # answering `accounts` got a floor enforced on a directory it does not have, and this
      # repository has no apps at all, so the leg measured nothing and reported success on
      # every run. backend-coverage.sh owns the two phases, the floor, the image build, the
      # teardown, and an auth gate that reads AUTH_APP (default `users`), prints its
      # denominator and fails closed when the app is present but unmeasured. It also
      # satisfies the script-first rule this step broke.
      #
      # NO --output, and the constraint is the MOUNT rather than the path shape. A bare
      # `reports` is refused outright — backend-coverage.sh compares the argument as a
      # STRING against `$PROJECT_ROOT` and exits 2. Making it absolute clears that guard and
      # hits the real one: the script reaches the container with `docker compose exec`, and
      # docker-compose.test.yml gives django-test exactly ONE writable bind mount —
      # ../scripts/tests/reports:/workspace/code/src/scripts/tests/reports. An --output
      # outside it writes the XML into the image layer, where nothing on the runner can read
      # it. The script's DEFAULT is the one directory inside that mount, so passing nothing
      # is what lands the artefacts, and the two steps below read it there. Same call as
      # claude.yml [7/8] — one gate, invoked identically from both sides. Measured
      # 20/08/2026.
      - name: Run pytest with coverage (two phases)
        if: steps.detect.outputs.present == 'true'
        env:
          COV_FLOOR: ${{ steps.threshold.outputs.value }}
        run: bash code/src/scripts/tests/backend-coverage.sh

      - name: Upload coverage report
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: code/src/scripts/tests/reports/backend-coverage/coverage.xml
          retention-days: 30

      - name: Post coverage comment
        if: always() && steps.detect.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1.11.0
        with:
          pytest-xml-coverage-path: code/src/scripts/tests/reports/backend-coverage/coverage.xml
          title: Backend Coverage

      # No tear-down step: backend-coverage.sh traps EXIT and brings the stack down with its
      # volumes on every path, success or failure. A second `down -v` here would be a third
      # place that knows how this stack is composed.

  # ── Mobile surface ──────────────────────────────────────────────────────────
  # Guarded at STEP level, not job level: the job runs and reports SUCCESS on a web-only
  # project rather than skipping. A skipped job and a passing job look different to
  # branch protection, and "never ran" is not the same claim as "nothing to run".
  mobile:
    name: jest-expo + coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect the mobile surface
        id: detect
        run: |
          if [ -d code/src/mobile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Mobile surface present — running the suite."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No code/src/mobile/ — this project is web-only. Nothing to test."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "24"

      - name: Get pnpm store directory
        if: steps.detect.outputs.present == 'true'
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        if: steps.detect.outputs.present == 'true'
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: bash code/src/scripts/mobile/install.sh

      # Coverage floors live in code/src/mobile/jest.config.js — the same numbers as the
      # backend, enforced once per runtime. coverage.py and Jest share no accumulator, so
      # a single combined percentage across both surfaces was never achievable.
      - name: Run the suite with coverage
        if: steps.detect.outputs.present == 'true'
        run: bash code/src/scripts/mobile/test.sh --coverage

      - name: Upload coverage report
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: code/src/mobile/coverage/
          retention-days: 30
          if-no-files-found: ignore

  # Where CI stops, deliberately. A JS bundle export runs on an ordinary Ubuntu runner and
  # catches a bad import, a missing asset or a Metro resolution error. Compiling a native
  # binary would need a paid macOS runner on every pull request, for a template that ships
  # no native code.
  mobile-bundle:
    name: Bundle export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect the mobile surface
        id: detect
        run: |
          if [ -d code/src/mobile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No code/src/mobile/ — this project is web-only. Nothing to bundle."
          fi

      - uses: pnpm/action-setup@v6
        if: steps.detect.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "24"

      - name: Get pnpm store directory
        if: steps.detect.outputs.present == 'true'
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        if: steps.detect.outputs.present == 'true'
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: bash code/src/scripts/mobile/install.sh

      - name: Export the iOS and Android bundles
        if: steps.detect.outputs.present == 'true'
        run: bash code/src/scripts/mobile/bundle.sh
