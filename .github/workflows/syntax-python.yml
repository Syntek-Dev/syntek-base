name: Python — Lint, Format & Typecheck

# One blocker, two different answers, because the two tools need different things.
#
# THE BLOCKER. In syntek-base the root pyproject.toml's `name` is still the unrendered
# project-slug token, and uv rejects that as an invalid package name while PARSING THE
# MANIFEST, before dependency resolution begins. Anything that opens the manifest —
# `uv sync`, `uv run` — therefore dies on a template regardless of lockfiles. In a
# GENERATED project the name is rendered and the question does not arise.
#
# RUFF: RUN IT ANYWAY (fixed 14/08/2026). Only the LAUNCHER needed the manifest; the
# rules never did. These jobs now install ruff with `uvx --from`, which parses no
# pyproject.toml, so lint and format are enforced by CI on the template itself — which
# they never were before. The constraint is read out of pyproject.toml at run time
# rather than restated here, so there is one source of truth and a missing constraint
# fails the job loudly instead of silently resolving to whatever is newest.
#
# This supersedes the note that used to sit here telling the reader to cite the local
# ruff binary and "never CI" as evidence for a Python rule. CI is now the evidence.
#
# BASEDPYRIGHT: GUARD IT (14/08/2026). A type-checker with no dependency set does not
# produce a weaker result, it produces a meaningless one — every import unresolved. It
# therefore takes the step-level lockfile guard that claude.yml, test.yml and
# audit-deps.yml already use: it runs in a generated project and reports a skip, with a
# reason, in the template. Not the same treatment as ruff, because it is not the same
# situation: ruff's rules are self-contained and basedpyright's are not.
#
# The mobile jobs DO run here, and the difference is the useful part: pnpm skips name
# validation on a private package, so the identical token is harmless in package.json
# and fatal in pyproject.toml. One tokenised name is not evidence about another.
#
# Historical, and it took three goes: these jobs first failed at `astral-sh/setup-uv`
# pinned to @v4 with no `version:`; then at its POST step, which errors when caching is
# enabled and the template installs nothing to cache (`ignore-nothing-to-cache` below);
# then at `uv sync`, which is what the two paragraphs above finally answer. Each fix was
# real and each merely uncovered the next one.

# No path filter, deliberately — the filter was removed on 16/08/2026 so these three
# jobs become ELIGIBLE for the required set. project-management/docs/git/PR-AND-REQUIRED-CHECKS.md,
# Section "Required status checks and path filters": a workflow may be path-filtered, or it may
# be a required status check, never both. While it was filtered, a documentation-only
# pull request left ruff and basedpyright reporting nothing at all, so requiring them
# would have blocked every such merge on a check that never arrives.
#
# The extra runs are affordable because the tree is small: 59 tracked .py files, on
# which — measured locally on 16/08/2026, so this is the CHECKER's time and not the
# job's — both ruff invocations return in under a second and basedpyright in ~1.4s at
# 0 errors, 0 warnings, 0 notes. The job adds checkout, setup-uv and a `uv sync` on top
# of that, and it is still the cheaper side of the trade: the alternative is the failure
# mode above, which blocks a merge outright. Same trade syntax-markdown.yml made.
#
# ELIGIBILITY IS NOT MEMBERSHIP. Adding these to branch protection is a repository-
# settings change no file in this repository can make — see
# project-management/docs/git/PR-AND-REQUIRED-CHECKS.md, Section "What earns a place in
# the required set".
# This change does the half that lives here.
on:
  push:
    branches: [main, staging, dev, testing]
  pull_request:
    branches: [main, staging, dev, testing]
  workflow_dispatch:

env:
  UV_VERSION: "0.12.4"
  PYTHON_VERSION: "3.14"

jobs:
  ruff-lint:
    name: Ruff — Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          # This is the "one step later" the header comment above predicted:
          # caching is opted into, but the template installs nothing to cache, so
          # the POST step fails saving a directory that was never created. Full
          # reasoning at the same input in claude.yml.
          ignore-nothing-to-cache: true

      # Read the constraint the project already declares rather than restating it. A
      # second copy in this file is a drift site; an unpinned `uvx ruff` is worse still,
      # because CI would silently track latest while the project tracked its floor.
      - name: Resolve the ruff constraint from pyproject.toml
        id: ruff
        run: |
          spec=$(grep -oE '"ruff[^"]*"' pyproject.toml | head -1 | tr -d '"')
          if [ -z "$spec" ]; then
            echo "::error::No ruff constraint found in pyproject.toml — refusing to guess a version."
            exit 1
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "Using $spec"

      # `uvx --from` installs into a throwaway environment and never opens the project
      # manifest, which is the whole point: it runs on the template and on a generated
      # project identically.
      - name: Run Ruff lint
        run: uvx --from "${{ steps.ruff.outputs.spec }}" ruff check .

  ruff-format:
    name: Ruff — Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          # This is the "one step later" the header comment above predicted:
          # caching is opted into, but the template installs nothing to cache, so
          # the POST step fails saving a directory that was never created. Full
          # reasoning at the same input in claude.yml.
          ignore-nothing-to-cache: true

      # Same constraint, same reason — see the ruff-lint job above.
      - name: Resolve the ruff constraint from pyproject.toml
        id: ruff
        run: |
          spec=$(grep -oE '"ruff[^"]*"' pyproject.toml | head -1 | tr -d '"')
          if [ -z "$spec" ]; then
            echo "::error::No ruff constraint found in pyproject.toml — refusing to guess a version."
            exit 1
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "Using $spec"

      - name: Check formatting
        run: uvx --from "${{ steps.ruff.outputs.spec }}" ruff format --check .

  basedpyright:
    name: basedpyright — Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          # This is the "one step later" the header comment above predicted:
          # caching is opted into, but the template installs nothing to cache, so
          # the POST step fails saving a directory that was never created. Full
          # reasoning at the same input in claude.yml.
          ignore-nothing-to-cache: true

      # UNGUARDED SINCE 15/08/2026. This step used to skip the whole gate when uv.lock
      # was absent, because pyproject.toml's `name` was an unrendered token and uv would
      # not parse the manifest at all. That name is now the house constant `syntek-base`,
      # branded at generation by a copier _task, so the template resolves its own
      # dependency set and this gate RUNS HERE rather than reporting a skip.
      #
      # The lockfile still decides the sync MODE — never whether the gate happens.
      # `--frozen` asserts a committed lock is current, which is the right assertion in a
      # generated project and an impossible one in the template, which commits no lock.
      # That is the whole remaining difference, and it is one flag rather than one gate.
      - name: Choose the sync mode
        id: sync
        run: |
          if [ -f uv.lock ]; then
            echo "flag=--frozen" >> "$GITHUB_OUTPUT"
            echo "uv.lock present — installing from the committed lock."
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "No uv.lock — base template; resolving fresh. The gate still runs."
          fi

      - name: Install dependencies
        run: uv sync ${{ steps.sync.outputs.flag }}

      - name: Run basedpyright
        run: uv run basedpyright
