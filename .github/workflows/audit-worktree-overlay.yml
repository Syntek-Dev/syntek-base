# Worktree overlay guard — the CI half of code/src/scripts/audits/worktree-overlay.sh.
#
# A per-story dev stack is published on 127.0.0.NNN:3080 and dev nginx forwards Host without the
# port, so Django refuses every form POST with CSRF 403 unless the overlay example trusts both
# published origins through DJANGO_CSRF_TRUSTED_ORIGINS_EXTRA (config/settings/dev.py appends
# them). The test image copies only code/src/django/, so no pytest can see the overlay; a value
# dropped from it fails nothing else, and this job is what notices.
#
# PATH-FILTERED, AND HERE THAT IS HONEST, as for audit-env-read-deny.yml: the script reads exactly
# two files at fixed paths, so a run triggered by anything else reproduces the previous result.
# The script and this workflow are in the filter because a change to either can fail an
# unchanged overlay.
#
# NOT ELIGIBLE FOR THE REQUIRED SET while it carries this filter (criterion 1 of
# project-management/docs/git/PR-AND-REQUIRED-CHECKS.md → What earns a place in the required set).
name: Audit — Worktree Overlay

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/docker/docker-compose.usXXX.dev.yml.example"
      - "code/src/docker/.env.dev.example"
      - "code/src/scripts/audits/worktree-overlay.sh"
      - ".github/workflows/audit-worktree-overlay.yml"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/docker/docker-compose.usXXX.dev.yml.example"
      - "code/src/docker/.env.dev.example"
      - "code/src/scripts/audits/worktree-overlay.sh"
      - ".github/workflows/audit-worktree-overlay.yml"
  workflow_dispatch:

jobs:
  worktree-overlay:
    name: Worktree overlay audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # bash, awk and grep only; the script fails closed (exit 2) if the overlay example is gone.
      - name: Run worktree overlay audit
        run: bash code/src/scripts/audits/worktree-overlay.sh --output md

      - name: Upload worktree overlay report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worktree-overlay-report
          path: code/src/scripts/audits/reports/worktree-overlay-report.md
          if-no-files-found: ignore
