name: Audit — Stubs

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.rs"
      - "code/src/scripts/audits/stubs.sh"
      - ".github/workflows/audit-stubs.yml"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "**/*.py"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.rs"
      - "code/src/scripts/audits/stubs.sh"
      - ".github/workflows/audit-stubs.yml"
  workflow_dispatch:

jobs:
  stubs:
    name: Stub audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run stub audit
        run: bash code/src/scripts/audits/stubs.sh --output md

      - name: Upload stub report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stub-report
          path: code/src/scripts/audits/reports/stubs-report.md
          if-no-files-found: ignore
