# Env read-deny guard — the CI half of code/src/scripts/audits/env-read-deny.sh.
#
# No AI tool reads a live env file (`.claude/CLAUDE.md` Section 6). Three hosts enforce that in
# three formats — `.claude/settings.json`, `.codex/config.toml`, `.zed/settings.json` — none reads
# another's file, and none fails when one drops a name. A host missing one of the six names is free
# to read that file with nothing saying so; this job is what notices.
#
# PATH-FILTERED, AND HERE THAT IS HONEST, as for audit-mcp-parity.yml: the script reads exactly
# three files at fixed paths, so a run triggered by anything else reproduces the previous result.
# The script is in the filter because a change to the check can fail an unchanged config.
#
# NOT ELIGIBLE FOR THE REQUIRED SET while it carries this filter (criterion 1 of
# project-management/docs/git/PR-AND-REQUIRED-CHECKS.md → What earns a place in the required set).
name: Audit — Env Read Deny

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - ".claude/settings.json"
      - ".codex/config.toml"
      - ".zed/settings.json"
      - "code/src/scripts/audits/env-read-deny.sh"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - ".claude/settings.json"
      - ".codex/config.toml"
      - ".zed/settings.json"
      - "code/src/scripts/audits/env-read-deny.sh"
  workflow_dispatch:

jobs:
  env-read-deny:
    name: Env read-deny audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # python3 reads JSON and TOML (tomllib) from the stdlib; ubuntu-latest ships 3.11+, and the
      # script exits 2 rather than reporting a clean run if that ever stops being true.
      - name: Run env read-deny audit
        run: bash code/src/scripts/audits/env-read-deny.sh --output md

      - name: Upload env read-deny report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: env-read-deny-report
          path: code/src/scripts/audits/reports/env-read-deny-report.md
          if-no-files-found: ignore
