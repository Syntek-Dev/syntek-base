# ESLint covers the repo's JavaScript — the site is server-rendered, so that is the
# progressive-enhancement scripts under code/src/django/static/js/. Prettier stays
# repo-wide (formatting only). There is no TypeScript, so there is no typecheck job.
name: JS/TS — Lint & Format

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.css"
      - "**/*.html"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "eslint.config.mjs"
      - ".prettierrc"
      - ".prettierignore"
      - ".github/workflows/syntax-js-ts.yml"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.json"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.css"
      - "**/*.html"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "eslint.config.mjs"
      - ".prettierrc"
      - ".prettierignore"
      - ".github/workflows/syntax-js-ts.yml"
  workflow_dispatch:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint .

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check
