name: Audit — Line Count (cloc)

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "**/*.py"
      - "**/*.html"
      - "**/*.css"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.rs"
      - "**/*.slint"
      - "code/src/scripts/audits/cloc.sh"
      - ".github/workflows/audit-cloc.yml"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "**/*.py"
      - "**/*.html"
      - "**/*.css"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.rs"
      - "**/*.slint"
      - "code/src/scripts/audits/cloc.sh"
      - ".github/workflows/audit-cloc.yml"
  workflow_dispatch:

jobs:
  cloc:
    name: Line-count audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cloc
        run: sudo apt-get install -y cloc

      - name: Run line-count audit
        run: bash code/src/scripts/audits/cloc.sh --output md

      - name: Upload cloc report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloc-report
          path: code/src/scripts/audits/reports/cloc-report.md
          if-no-files-found: ignore
