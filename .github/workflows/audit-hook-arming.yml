# Hook-arming probes — the CI half of code/src/scripts/tests/hook-arming.sh (US009).
#
# The git hooks arm in exactly one place: install.sh's last Phase 1 step, which calls
# code/src/scripts/development/install-hooks.sh. package.json carries no `prepare`; its
# `postinstall` only prints a notice (install-hooks.sh --notice). This job proves both against
# disposable checkouts of this repository — never a bare `git init` — and NEVER inlines an
# assertion: every step below calls the script, which owns the fixtures and the oracles.
#
# Not in `[3/4] Template Generation` (audit-template.yml): that job sets up uv only and never
# executes a generated install.sh. It keeps only the grep for the step's presence on both
# INCLUDE_MOBILE poles (AC-GAP-6 of the US009 QA plan).
#
# CI IS SET ON EVERY RUNNER, and the `pnpm install` below fires the new postinstall under it —
# one of the notice's silent clauses. The probe's printing cases therefore run with `env -u CI`
# inside the script; a probe that inherited CI would pass against the suppressed state.
#
# UNFILTERED. The arming path spans install.sh, package.json, lefthook.yml, the lockfile and the
# installer scripts; a path filter would be a hand-kept copy of that set.
#
# Exit 3 from the script is UNMEASURED and fails the step: a fixture that could not look is
# never reported clean (code/docs/GATE-REPORTING.md).
name: Audit — Hook Arming

on:
  push:
    branches: [main, staging, dev, testing]
  pull_request:
    branches: [main, staging, dev, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probes:
    name: Hook-arming probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # graph-reclaim runs the real code-review-graph at the script's pinned version through uvx.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          ignore-nothing-to-cache: true

      # binary-provenance and notice-streams trace with strace; without it they report unmeasured.
      - name: Provision strace
        run: command -v strace || { sudo apt-get update -q && sudo apt-get install -y -q strace; }

      - name: Manifest and installer assertions (ST01, ST02, ST02b, P1, P2, HP-06)
        run: bash code/src/scripts/tests/hook-arming.sh --fixture manifest

      - name: Fixture A — committed checkout and worktree (HP-01 to HP-04, EC-01, EC-03, EC-06, EC-07, ES-04)
        if: success() || failure()
        run: bash code/src/scripts/tests/hook-arming.sh --fixture A

      - name: Fixture B — unborn HEAD (EC-04)
        if: success() || failure()
        run: bash code/src/scripts/tests/hook-arming.sh --fixture B

      - name: Fixture C — no .git (ES-05)
        if: success() || failure()
        run: bash code/src/scripts/tests/hook-arming.sh --fixture C

      - name: The postinstall notice through pnpm install (HP-08, EC-09 to EC-12, ES-06)
        if: success() || failure()
        run: bash code/src/scripts/tests/hook-arming.sh --fixture notice

      - name: Notice streams (PA-03, EC-18)
        if: success() || failure()
        run: bash code/src/scripts/tests/hook-arming.sh --fixture notice-streams

      - name: Effective hook paths (EC-14 to EC-16)
        if: success() || failure()
        run: bash code/src/scripts/tests/hook-arming.sh --fixture hook-paths

      - name: Write boundary (ST05, EC-17)
        if: success() || failure()
        run: bash code/src/scripts/tests/hook-arming.sh --fixture write-boundary

      - name: Graph reclaim (EC-05)
        if: success() || failure()
        run: bash code/src/scripts/tests/hook-arming.sh --fixture graph-reclaim

      - name: Binary provenance (EC-02)
        if: success() || failure()
        run: bash code/src/scripts/tests/hook-arming.sh --fixture binary-provenance

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-arming-evidence
          path: code/src/scripts/tests/reports/hook-arming/
          if-no-files-found: ignore

  # Its own job because root install.sh needs what the probes job does not: a docker daemon, uv,
  # and passwordless `sudo tee -a /etc/hosts`. A GitHub-hosted runner has all three; the script
  # refuses this fixture on any other host unless --allow-install-sh is given.
  install-failure:
    name: Hook-install failure stops install.sh (ES-01 to ES-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: install.sh with an obstructed hooks directory
        run: bash code/src/scripts/tests/hook-arming.sh --fixture install-failure

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-arming-install-failure-evidence
          path: code/src/scripts/tests/reports/hook-arming/install-failure/
          if-no-files-found: ignore
