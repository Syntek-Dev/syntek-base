name: Secrets Scan

on:
  push:
    branches: [main, staging, dev, testing]
  pull_request:
  workflow_dispatch:

jobs:
  trufflehog:
    name: TruffleHog — Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # What to scan, decided here rather than in an expression, because each case needs
      # a git lookup. A pull request scans its own range. A push scans what it added, from
      # `github.event.before`, never the whole history on every push: a full-history scan
      # re-reports any commit it ever flagged, so one false positive keeps the branch red
      # for good (02/11/2026, a pytest name in 47e84cf that the Lob detector reads as a key).
      #
      # `before` is unusable in two cases, and neither may come back green unscanned:
      # - All zeros: a new branch. Scan from where it left the default branch; a branch
      #   cut at the default branch's tip adds nothing, so the scan is skipped and says so.
      # - Absent from the clone: a force-push dropped the old tip. TruffleHog reports an
      #   unresolvable base as a non-fatal error and exits 0, so it is never passed one.
      #   The fallback is the same merge-base, a superset of what the push added.
      # The default branch itself has no merge-base to fall back to and scans in full, as
      # does workflow_dispatch. A full scan reaches 47e84cf and fails on it.
      - name: Choose the scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base=""
          skip=false
          case "$EVENT" in
            pull_request)
              base="$PR_BASE" ;;
            push)
              if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                base="$BEFORE"
              elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
                base="$(git merge-base HEAD "origin/$DEFAULT_BRANCH")"
                if [ "$base" = "$(git rev-parse HEAD)" ]; then
                  skip=true
                  echo "::notice::$REF_NAME adds no commits to $DEFAULT_BRANCH, which scanned them when they landed. Nothing to scan."
                fi
              fi ;;
          esac
          echo "Scan base: ${base:-<full history>}"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - name: TruffleHog OSS
        if: steps.range.outputs.skip != 'true'
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # Pinning the action does not pin the scanner: its action.yml runs
          # `ghcr.io/trufflesecurity/trufflehog:${version}`, and `version` defaults to
          # "latest". A tag can be re-pointed too, so the image is pinned by digest — the
          # `3.99.8` manifest list, resolved from ghcr.io 10/11/2026 — and the action builds
          # a valid `name:tag@digest` reference from it. Move this with the comment on the
          # `uses:` line, never apart from it.
          version: 3.99.8@sha256:674b2f187620a19df77f44cf9a7d77efcc581a5662accef2f2739cbb46ba4a3a
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: HEAD
          extra_args: --only-verified
