name: Secrets Scan

on:
  push:
    branches: [main, staging, dev, testing]
  pull_request:
  workflow_dispatch:

jobs:
  trufflehog:
    name: TruffleHog — Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # Pinning the action does not pin the scanner: its action.yml runs
          # `ghcr.io/trufflesecurity/trufflehog:${version}`, and `version` defaults to
          # "latest". A tag can be re-pointed too, so the image is pinned by digest — the
          # `3.96.0` manifest list, resolved from ghcr.io 14/10/2026 — and the action builds
          # a valid `name:tag@digest` reference from it. Move this with the comment on the
          # `uses:` line, never apart from it.
          version: 3.96.0@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: HEAD
          extra_args: --only-verified
