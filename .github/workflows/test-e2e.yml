---
name: test-e2e

# Browser-level suite — playwright-python driving a real Chromium against the running
# dev stack. One browser driver, in Python: there is no Node test path in this stack.
#
# Also triggerable manually via: Actions → test-e2e → Run workflow
on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/django/**"
      - "code/src/docker/**"
      - "pyproject.toml"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/django/**"
      - "code/src/docker/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      k:
        description: "Filter tests by keyword (optional, e.g. 'overflow')"
        required: false
        default: ""

jobs:
  playwright:
    name: playwright-python browser suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # See the equivalent guard in test.yml. uv.lock is COMMITTED as of 16/08/2026, so this
      # guard takes its present branch and the browser suite runs here. It stays because
      # this workflow SHIPS: every Dockerfile builds with `COPY pyproject.toml uv.lock ./`,
      # and a generated project has no lock of its own until the `uv lock` copier task has
      # written one, so the dev stack cannot start in that window. The guard is what keeps
      # one file correct on both sides of the template boundary — report success there
      # rather than failing on a pull request with nothing to test.
      - name: Detect the backend lockfile
        id: detect
        run: |
          if [ -f uv.lock ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "uv.lock present — running the browser suite."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No uv.lock yet — the dev stack cannot build."
          fi

      - name: Install uv
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@v10.0.1

      # e2e-py.sh runs playwright and pytest on the RUNNER, not in a container, so the host
      # needs the `test` group installed. The job never had this step: it installed uv and
      # jumped straight to the script, leaving `uv run --group test` to build the environment
      # implicitly on first use.
      #
      # `--locked` rather than a bare sync, because uv's default is to re-lock silently when
      # the manifest and the lockfile disagree. In CI that turns a stale uv.lock into a green
      # run against dependency versions nobody committed. --locked asserts instead: if the
      # lockfile needs updating, the job fails and says so.
      - name: Install the test group
        if: steps.detect.outputs.present == 'true'
        run: uv sync --locked --group test

      - name: Create .env.dev
        if: steps.detect.outputs.present == 'true'
        run: |
          cp code/src/docker/.env.dev.example code/src/docker/.env.dev
          echo "SECRET_KEY=${{ secrets.TEST_SECRET_KEY }}" >> code/src/docker/.env.dev

      # e2e-py.sh talks to the dev stack over HTTP on host port 81. It refuses to run
      # if the stack is unreachable, so bring it up first and let the compose
      # healthchecks settle before handing over.
      - name: Start the dev stack
        if: steps.detect.outputs.present == 'true'
        run: bash code/src/scripts/development/server.sh up --build

      - name: Wait for the stack
        if: steps.detect.outputs.present == 'true'
        run: |
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:81/control/; then
              echo "stack is up"; exit 0
            fi
            sleep 2
          done
          echo "stack did not come up in 120s" >&2
          bash code/src/scripts/development/logs.sh --service django || true
          exit 1

      - name: Run the e2e suite
        if: steps.detect.outputs.present == 'true'
        env:
          # localhost, not the dev hostname — no /etc/hosts entry on the runner.
          E2E_BASE_URL: http://localhost:81
        run: |
          if [ -n "${{ github.event.inputs.k }}" ]; then
            bash code/src/scripts/tests/e2e-py.sh -k "${{ github.event.inputs.k }}"
          else
            bash code/src/scripts/tests/e2e-py.sh
          fi

      - name: Upload axe results
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: a11y-results
          path: code/src/scripts/tests/reports/a11y/
          if-no-files-found: ignore
          retention-days: 30

      - name: Tear down
        if: always() && steps.detect.outputs.present == 'true'
        run: bash code/src/scripts/development/server.sh down --volumes || true
