# Dev static guard — the CI half of code/src/scripts/audits/dev-static.sh.
#
# The dev stack runs no collectstatic: Django serves every asset live from the finders under
# DEBUG, so the dev nginx must forward /static/ to the django upstream. A dev.conf that answers
# /static/ itself, from a mounted ../django/staticfiles nothing in dev fills, 404s every asset
# while the page still renders. Nothing else fails when it drifts back; this job notices.
#
# PATH-FILTERED, AND HERE THAT IS HONEST, as for audit-env-read-deny.yml: the script reads exactly
# two files at fixed paths, so a run triggered by anything else reproduces the previous result.
# The script, its fixtures and this workflow are in the filter because a change to the check can
# fail an unchanged config.
#
# NOT ELIGIBLE FOR THE REQUIRED SET while it carries this filter (criterion 1 of
# project-management/docs/git/PR-AND-REQUIRED-CHECKS.md → What earns a place in the required set).
name: Audit — Dev Static

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/docker/nginx/dev.conf"
      - "code/src/docker/docker-compose.dev.yml"
      - "code/src/scripts/audits/dev-static.sh"
      - "code/src/scripts/audits/fixtures/dev-static/**"
      - ".github/workflows/audit-dev-static.yml"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "code/src/docker/nginx/dev.conf"
      - "code/src/docker/docker-compose.dev.yml"
      - "code/src/scripts/audits/dev-static.sh"
      - "code/src/scripts/audits/fixtures/dev-static/**"
      - ".github/workflows/audit-dev-static.yml"
  workflow_dispatch:

jobs:
  dev-static:
    name: Dev static audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A gate never watched failing is not a gate: prove the detector over the fixture cases
      # (broken, fixed and the fail-closed shapes) before trusting its verdict on the real files.
      - name: Self-test the dev static audit
        run: bash code/src/scripts/audits/dev-static.sh --self-test

      - name: Run dev static audit
        run: bash code/src/scripts/audits/dev-static.sh --output md

      - name: Upload dev static report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dev-static-report
          path: code/src/scripts/audits/reports/dev-static-report.md
          if-no-files-found: ignore
