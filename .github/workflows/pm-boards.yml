# PM boards — the CI half of project-management/src/00-ASSETS/scripts/pm-board.sh.
#
# Two jobs, and only the first can fail the run:
#
#   check  `pm-board.sh --check` — every committed *-BOARD.md in 01-FEATURE-MAPS, 02-STORIES,
#          03-SPRINTS, 16-SPRINT-PLANS and 17-STORY-PLANS matches what the status lines
#          generate, and nothing under */archive/ has changed since it was archived beyond the
#          reference-path rewrites pm-archive.sh makes. The frozen check reads git history, so
#          this job checks out with full depth: a shallow clone would see every archived file
#          as just added and wave every change through.
#   warn   `pm-board.sh --warn` — stale-status warnings (a Blocked story whose dependencies have
#          landed, a story past its acceptance window, an item ready to archive). Advisory by
#          design: a warning names a transition a person must decide, never a defect, so it is
#          `continue-on-error` and never blocks a merge.
#
# The lefthook pre-commit leg (`pm-board.sh --write --staged`) is the local half; this is what
# catches a commit that skipped it.
#
# Path filters are safe here because this is NOT a required status check — see
# project-management/docs/git/PR-AND-REQUIRED-CHECKS.md → Required status checks
# and path filters. A board can only go stale through a change under these paths.
name: PM Boards

on:
  push:
    branches: [main, staging, dev, testing]
    paths:
      - "project-management/src/**"
      - ".copier-answers.yml"
      - ".github/workflows/pm-boards.yml"
  pull_request:
    branches: [main, staging, dev, testing]
    paths:
      - "project-management/src/**"
      - ".copier-answers.yml"
      - ".github/workflows/pm-boards.yml"
  workflow_dispatch:

jobs:
  check:
    name: Boards current, archive frozen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Every committed board is current and archive/ is untouched
        run: bash project-management/src/00-ASSETS/scripts/pm-board.sh --check

  warn:
    name: Stale statuses (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report statuses a person should move
        run: bash project-management/src/00-ASSETS/scripts/pm-board.sh --warn
