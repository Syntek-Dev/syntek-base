name: Markdown — Lint

# No path filter, deliberately. markdownlint-cli2 is a required status check on the
# default branch, and a path-filtered workflow never reports on a pull request that
# misses its paths — GitHub then blocks the merge on a check that will never arrive.
# The job takes ~20s; running it every time is cheaper than that failure mode.
on:
  push:
    branches: [main, staging, dev, testing]
  pull_request:
    branches: [main, staging, dev, testing]
  workflow_dispatch:

jobs:
  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Get pnpm store directory
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run markdownlint
        run: pnpm lint:md
