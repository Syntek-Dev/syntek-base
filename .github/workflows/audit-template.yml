name: Audit — Template Integrity

# No path filter: this must run on every pull request so it can be a required check.
# A path-filtered workflow that never reports leaves a PR blocked on "Expected".
on:
  push:
    branches: [main, staging, dev, testing]
  pull_request:
    branches: [main, staging, dev, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tokens:
    name: "[1/3] Template Tokens"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check token syntax integrity
        run: bash .github/scripts/check-template-tokens.sh

  # The two documents that describe the template to whoever generates from it. Neither
  # has a consumer that fails when it goes stale: .copier/README.md is only read after
  # generation, and TEMPLATE-TOKENS.md is prose. Without this job they drift silently —
  # which is exactly what they had done by 09/08/2026 (a tree missing four directories,
  # an audit table listing four scripts of thirteen, and no skills section at all).
  #
  # TWO STEPS, and the first is the load-bearing one. Every check here is a presence
  # test against a tree that is correct today, so the ordinary run is green whether the
  # matching rule works or not — and it once did not: a bare grep let a description
  # ("the CONTEXT.md / CLAUDE.md split") answer for the row it was meant to police, and
  # let `── VERSION-HISTORY.md` answer for VERSION. Both passed silently. The self-test
  # deletes a required row per check and asserts each one is caught, so a rule that
  # stops discriminating fails here rather than the next time the trees drift.
  shipped-docs:
    name: "[2/3] Shipped Documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prove the detector (self-test against a mutated README)
        run: bash .github/scripts/shipped-readme.sh --self-test

      - name: The shipped README and token contract must match the repository
        run: bash .github/scripts/shipped-readme.sh

  generate:
    name: "[3/3] Template Generation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Copier reads the template over git

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # BOTH render paths, every time. The negative case is the one that rots silently:
      # a mobile-only mistake that leaks into a web-only generation is invisible unless
      # the web-only path is generated and asserted on. A shell loop rather than a job
      # matrix, because a matrix needs GitHub expression syntax and this file must not
      # contain it (see the note further down).
      - name: Generate a project both ways
        run: |
          for mobile in false true; do
            uvx copier copy --trust --defaults --vcs-ref=HEAD \
              --data PROJECT_NAME="CI Probe" \
              --data PROJECT_DESCRIPTION="A probe project generated by CI to verify that the template renders end to end." \
              --data ORG_NAME="CI Org" \
              --data DEVELOPER_NAME="CI Runner" \
              --data DEVELOPER_EMAIL="ci@example.com" \
              --data DATE="01/01/2027" \
              --data INCLUDE_MOBILE=$mobile \
              . "$RUNNER_TEMP/gen-$mobile"
          done

      - name: No token may survive rendering
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"
            left=$(grep -rIo '<%[A-Z_]*%>' . --exclude-dir=.git | wc -l)
            if [ "$left" -ne 0 ]; then
              echo "::error::INCLUDE_MOBILE=$mobile — $left unrendered token(s) survived"
              grep -rIn '<%[A-Z_]*%>' . --exclude-dir=.git | head -20
              status=1
            fi
            echo "INCLUDE_MOBILE=$mobile — 0 unrendered tokens"
          done
          exit $status

      - name: Template-only files must not leak into a generated project
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"
            for f in copier.yml LICENSE SECURITY.md CONTRIBUTING.md \
                     .github/CODEOWNERS .github/ISSUE_TEMPLATE \
                     .github/PULL_REQUEST_TEMPLATE.md .github/scripts \
                     .github/workflows/audit-template.yml \
                     how-to/src/TEMPLATE-GUIDE how-to/src/TEMPLATE-TOKENS.md .copier; do
              if [ -e "$f" ]; then
                echo "::error::INCLUDE_MOBILE=$mobile — $f leaked into the generated project"
                status=1
              fi
            done
          done
          exit $status

      - name: The generated project must be complete
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"
            for f in README.md uv.lock .copier-answers.yml pyproject.toml \
                     VERSION VERSION-HISTORY.md CHANGELOG.md RELEASES.md \
                     how-to/src/CONTRIBUTING.md .github/workflows/claude.yml; do
              if [ ! -e "$f" ]; then
                echo "::error::INCLUDE_MOBILE=$mobile — $f missing from the generated project"
                status=1
              fi
            done
          done
          exit $status

      # A new project owns its version state. It must start at 0.1.0 with a single
      # entry of its own — never syntek-base's number, and never syntek-base's history.
      # These four files ship from .copier/ and are moved into place by a _tasks
      # entry, so this also proves that move ran.
      - name: A generated project starts fresh at 0.1.0
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"

            version="$(cat VERSION)"
            if [ "$version" != "0.1.0" ]; then
              echo "::error::INCLUDE_MOBILE=$mobile — VERSION is '$version', expected 0.1.0."
              echo "::error::The template's root version leaked into the generated project."
              status=1
            fi

            for f in CHANGELOG.md RELEASES.md VERSION-HISTORY.md; do
              # One entry only. More means syntek-base's own history came along.
              entries="$(grep -cE '^## \[|^## v|^\| [0-9]{2}/' "$f" || true)"
              if [ "$entries" -ne 1 ]; then
                echo "::error::INCLUDE_MOBILE=$mobile — $f has $entries entries, expected exactly 1."
                echo "::error::A new project must not inherit the template's release history."
                status=1
              fi
            done

            # The staging directory must be gone — _tasks moves all five files then rmdirs it.
            if [ -d .copier ]; then
              echo "::error::INCLUDE_MOBILE=$mobile — .copier/ survived generation: $(ls .copier)"
              status=1
            fi
          done
          exit $status

      # Seed content for a generated project's sub-packages. Bumping these in
      # syntek-base would hand every new project a sub-package history describing the
      # template's development rather than its own. See CONTRIBUTING.md § 1b.
      - name: Sub-package version files are pinned at 0.1.0
        run: |
          status=0
          cd "$RUNNER_TEMP/gen-true"
          for pkg in code/src/django code/src/mobile; do
            for f in CHANGELOG.md VERSION-HISTORY.md RELEASES.md; do
              [ -e "$pkg/$f" ] || continue
              if ! grep -q '0\.1\.0' "$pkg/$f"; then
                echo "::error::$pkg/$f does not mention 0.1.0 — sub-package seeds must stay at 0.1.0"
                status=1
              fi
              entries="$(grep -cE '^## \[|^## v|^\| [0-9]{2}/' "$pkg/$f" || true)"
              if [ "$entries" -ne 1 ]; then
                echo "::error::$pkg/$f has $entries entries, expected exactly 1 (seed content)."
                status=1
              fi
            done
          done
          exit $status

      # The opt-in is gated by ONE mechanism: a templated _exclude entry. This step is
      # what proves it still works in both directions — present when asked for, and
      # genuinely absent, not merely empty, when not.
      - name: The mobile surface must obey the opt-in
        run: |
          status=0
          for p in code/src/mobile code/src/scripts/mobile \
                   .claude/agents/mobile.md .claude/skills/stack-react-native; do
            if [ ! -e "$RUNNER_TEMP/gen-true/$p" ]; then
              echo "::error::INCLUDE_MOBILE=true — $p is missing"; status=1
            fi
            if [ -e "$RUNNER_TEMP/gen-false/$p" ]; then
              echo "::error::INCLUDE_MOBILE=false — $p leaked into a web-only project"; status=1
            fi
          done
          for f in code/src/mobile/package.json code/src/mobile/app/index.tsx \
                   code/src/scripts/mobile/server.sh; do
            if [ ! -e "$RUNNER_TEMP/gen-true/$f" ]; then
              echo "::error::INCLUDE_MOBILE=true — $f is missing"; status=1
            fi
          done
          exit $status

      # The single-mechanism rule in prose is worth nothing without this assertion: no
      # file may carry templated contents, so every shared file must be byte-identical
      # across the two paths. Only the answers file may differ.
      - name: Shared files must be byte-identical across both paths
        run: |
          drift=$(diff -rq --exclude=.git --exclude=.copier-answers.yml \
                    "$RUNNER_TEMP/gen-false" "$RUNNER_TEMP/gen-true" \
                    2>/dev/null | grep -v '^Only in ' || true)
          if [ -n "$drift" ]; then
            echo "::error::a shared file differs between the two render paths"
            echo "$drift"
            exit 1
          fi
          echo "every shared file is byte-identical"

      # NOT CHECKED, deliberately: "a web-only project contains no reference to
      # scripts/mobile/". It does contain them — the CI workflows and the two script
      # aggregates name those paths behind a directory-existence guard, which is the
      # whole point of guarding rather than templating. A grep for the string cannot
      # tell a guarded reference from an orphaned one, so it would fail a correct repo.
      # The byte-identical check above is the real guarantee: nothing about the web-only
      # path differs from the mobile path except the files the opt-in removes.

      # NOTE: this file must never contain the literal dollar-brace-brace sequence.
      # GitHub Actions parses its expression syntax anywhere in a workflow file,
      # including inside run blocks, so writing it out — even quoted or backslashed —
      # makes the whole workflow invalid. The patterns below are assembled from
      # escaped braces so the sequence never appears.
      - name: Syntax that must survive rendering untouched
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"
            gha=$(grep -rIoE '\$\{\{' .github/workflows | wc -l)
            bash_tests=$(grep -rIoE '\[\[' code/src/scripts | wc -l)
            [ "$gha" -gt 50 ] || { echo "::error::INCLUDE_MOBILE=$mobile — workflow expressions were eaten by rendering (found $gha)"; status=1; }
            [ "$bash_tests" -gt 200 ] || { echo "::error::INCLUDE_MOBILE=$mobile — bash test syntax was eaten by rendering (found $bash_tests)"; status=1; }
            echo "INCLUDE_MOBILE=$mobile — workflow expressions: $gha · bash test brackets: $bash_tests"
          done
          exit $status
