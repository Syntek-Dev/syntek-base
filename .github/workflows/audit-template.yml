name: Audit — Template Integrity

# No path filter: this must run on every pull request so it can be a required check.
# A path-filtered workflow that never reports leaves a PR blocked on "Expected".
#
# AND NO BRANCH FILTER ON PUSH, since 16/08/2026 — this is the only workflow here whose
# push trigger names no branches. The list used to be the four chain branches, so a
# feature branch got nothing at all until somebody opened a pull request.
#
# WHAT THAT COST, measured rather than argued (MAP-BASE-HEALTH N-032/N-033). A `<%`
# written into a printf format string in audits/conflict-markers.sh on 15/08/2026 broke
# `copier copy` outright — the template could not generate a project at all. TWO NUMBERS,
# AND THEY MEASURE DIFFERENT THINGS: pm/base-health-map ran seventeen commits with no pull
# request to trigger this workflow, and the break was live for five of them (8050ac7 to
# 47bafb1, fixed at 21d77d7). Seventeen is the blind window; five is what shipped broken
# through it. check-template-tokens.sh had been exiting 1 and naming the exact line the
# whole time. Nothing ran it.
#
# WHY THIS CLASS AND NOT THE OTHERS. Every other gate here can wait for the pull
# request, because its defect is visible in the branch it was written on: a lint error,
# a dead link, an oversized guide. A template-integrity defect is invisible until
# somebody generates, and whoever generates is not whoever broke it — that is the whole
# asymmetry, and it is what buys the extra runs.
#
# IT IS AFFORDABLE, and that was measured too: the last full run before this change
# finished in 41 seconds wall clock — tokens 8s, shipped documentation 18s, generation
# 37s, all in parallel. Every job is metadata-only; nothing is built.
#
# A branch with an open pull request runs this twice, once per event. That is accepted
# rather than deduplicated: a concurrency group needs GitHub expression syntax, and this
# file may not contain that sequence at all (see the NOTE above the last step in [3/4]).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging, dev, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tokens:
    name: "[1/4] Template Tokens"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The self-test runs FIRST, for the reason the shipped-docs job below spells out and
      # this job learned the hard way: every check here is a presence test, so the ordinary
      # run is green whether the matching rules work or not. Check 3 required a closing `>`
      # and policed a delimiter that does not exist, so a bare `<:` broke every generation
      # while this job reported 1974 well-formed tokens.
      - name: Prove the detectors (self-test against known-bad fixtures)
        run: bash .github/scripts/check-template-tokens.sh --self-test

      - name: Check token syntax integrity
        run: bash .github/scripts/check-template-tokens.sh

  # The two documents that describe the template to whoever generates from it. Neither
  # has a consumer that fails when it goes stale: .copier/README.md is only read after
  # generation, and TEMPLATE-TOKENS.md is prose. Without this job they drift silently —
  # which is exactly what they had done by 09/08/2026 (a tree missing four directories,
  # an audit table listing four scripts of thirteen, and no skills section at all).
  #
  # TWO STEPS, and the first is the load-bearing one. Every check here is a presence
  # test against a tree that is correct today, so the ordinary run is green whether the
  # matching rule works or not — and it once did not: a bare grep let a description
  # ("the CONTEXT.md / CLAUDE.md split") answer for the row it was meant to police, and
  # let `── VERSION-HISTORY.md` answer for VERSION. Both passed silently. The self-test
  # deletes a required row per check and asserts each one is caught, so a rule that
  # stops discriminating fails here rather than the next time the trees drift.
  shipped-docs:
    name: "[2/4] Shipped Documentation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prove the detector (self-test against a mutated README)
        run: bash .github/scripts/shipped-readme.sh --self-test

      - name: The shipped README and token contract must match the repository
        run: bash .github/scripts/shipped-readme.sh

      - name: Prove the detector (self-test against a polluted memory seed)
        run: bash .github/scripts/shipped-memory.sh --self-test

      - name: A generated project must receive an empty project-memory store
        run: bash .github/scripts/shipped-memory.sh

  # POSITION, where [1/4] checks SHAPE. A token is inert in a comment and fatal in any
  # position a real parser validates, and the two cannot be told apart by reading text:
  # pnpm accepts <%PROJECT_SLUG%> in package.json's `name` — both manifests still carry
  # one — while uv rejects the identical token in a pyproject.toml `name`, which is why
  # this repository's own is the house constant `syntek-base`. So this job asks each
  # toolchain rather than guessing — every manifest must parse HERE, before generation,
  # or its gates prove nothing until after it. The uv half is kept live by the script's
  # own --self-test rather than by the tree. Full reasoning in the script header.
  # MAP-BASE-HEALTH N-024.
  parsers:
    name: "[4/4] Parser Probes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # This job only PROBES — `uv lock --dry-run` resolves and installs nothing — so
          # the cache directory can end up empty and setup-uv's POST step would otherwise
          # fail saving a directory that was never created. Not a claim about the lockfile:
          # syntek-base has committed its own since 16/08/2026.
          ignore-nothing-to-cache: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # cargo and docker are preinstalled on ubuntu-latest. If either ever stops being so,
      # the script FAILS rather than skipping — a manifest present with no toolchain to
      # read it is a gate that cannot run, and this repository requires those to say so.

      - name: Prove the probe (self-test against a tokenised manifest)
        run: bash .github/scripts/check-template-parsers.sh --self-test

      - name: Every toolchain must parse its own manifest in the template
        run: bash .github/scripts/check-template-parsers.sh

  generate:
    name: "[3/4] Template Generation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Copier reads the template over git

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # BOTH render paths, every time. The negative case is the one that rots silently:
      # a mobile-only mistake that leaks into a web-only generation is invisible unless
      # the web-only path is generated and asserted on. A shell loop rather than a job
      # matrix, because a matrix needs GitHub expression syntax and this file must not
      # contain it (see the note further down).
      - name: Generate a project both ways
        run: |
          for mobile in false true; do
            uvx copier copy --trust --defaults --vcs-ref=HEAD \
              --data PROJECT_NAME="CI Probe" \
              --data PROJECT_DESCRIPTION="A probe project generated by CI to verify that the template renders end to end." \
              --data ORG_NAME="CI Org" \
              --data DEVELOPER_NAME="CI Runner" \
              --data DEVELOPER_EMAIL="ci@example.com" \
              --data DATE="01/01/2027" \
              --data INCLUDE_MOBILE=$mobile \
              . "$RUNNER_TEMP/gen-$mobile"
          done

      - name: No token may survive rendering
        # The two documentation paths are carved out because they SHIP and are prose ABOUT
        # the template: their token text sits inside Jinja `raw` blocks and is meant to
        # survive verbatim — the delimiter table, the "a token survived" troubleshooting
        # entry, the whole token contract. A leaked token and a quoted one are byte-identical,
        # so no content test can separate them; the path is the only honest discriminator.
        # Everything else in the tree stays under the strict check, which is where an actual
        # rendering failure would show up.
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"
            left=$(grep -rIo '<%[A-Z_]*%>' . \
              --exclude-dir=.git \
              --exclude-dir=TEMPLATE-GUIDE \
              --exclude=TEMPLATE-TOKENS.md | wc -l)
            if [ "$left" -ne 0 ]; then
              echo "::error::INCLUDE_MOBILE=$mobile — $left unrendered token(s) survived"
              grep -rIn '<%[A-Z_]*%>' . \
                --exclude-dir=.git \
                --exclude-dir=TEMPLATE-GUIDE \
                --exclude=TEMPLATE-TOKENS.md | head -20
              status=1
            fi
            echo "INCLUDE_MOBILE=$mobile — 0 unrendered tokens"
          done
          exit $status

      - name: Template-only files must not leak into a generated project
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"
            for f in copier.yml LICENSE SECURITY.md CONTRIBUTING.md \
                     .github/CODEOWNERS .github/ISSUE_TEMPLATE \
                     .github/PULL_REQUEST_TEMPLATE.md .github/scripts \
                     .github/workflows/audit-template.yml \
                     how-to/src/TEMPLATE-GUIDE/TEMPLATE-GAPS.md .copier; do
              if [ -e "$f" ]; then
                echo "::error::INCLUDE_MOBILE=$mobile — $f leaked into the generated project"
                status=1
              fi
            done
          done
          exit $status

      # The artefact trees, which are a DIFFERENT class from the step above. Those files
      # are template-only and were never tracked in a form that could ship; these are
      # syntek-base's own handoffs, feature maps, research notes and lessons, committed
      # since 17/08/2026 so they sync across devices. That commit removed the backstop
      # this repository had relied on without noticing: Copier's dirty-HEAD path runs
      # `git add -A`, which honours .gitignore, so while the artefacts were untracked a
      # hole in `_exclude` shipped nothing. `_exclude` is now the only guard, and the trap
      # is specific — a directory exclusion does NOT prune its contents, because Copier
      # walks a flat recursive scantree and `_render_file` re-creates parent directories.
      # The self-test runs first, for the reason the two jobs above both spell out.
      - name: Prove the detector (self-test against a leaking generated tree)
        run: bash .github/scripts/shipped-artefacts.sh --self-test "$RUNNER_TEMP/gen-false"

      - name: A generated project must receive empty artefact trees
        run: bash .github/scripts/shipped-artefacts.sh "$RUNNER_TEMP/gen-false" "$RUNNER_TEMP/gen-true"

      - name: The generated project must be complete
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"
            for f in README.md uv.lock .copier-answers.yml pyproject.toml \
                     VERSION VERSION-HISTORY.md CHANGELOG.md RELEASES.md \
                     how-to/src/CONTRIBUTING.md .github/workflows/claude.yml \
                     how-to/src/TEMPLATE-TOKENS.md \
                     how-to/src/TEMPLATE-GUIDE/GUIDE-TO-SKILLS.md \
                     how-to/src/TEMPLATE-GUIDE/14-UPDATING.md; do
              if [ ! -e "$f" ]; then
                echo "::error::INCLUDE_MOBILE=$mobile — $f missing from the generated project"
                status=1
              fi
            done
          done
          exit $status

      # THE MANIFEST MUST BE BRANDED, and this is the only place that can prove it.
      # pyproject.toml carries the house constant `syntek-base` in the template, because uv
      # validates [project] name as a package name and rejects the token delimiters — that
      # one line cost the repository its type-check, its dependency audit and every test
      # suite until 15/08/2026. A copier _task rewrites it at generation, ahead of
      # `uv lock`, so the name is NOT a token and nothing else checks it: [1/4] scans token
      # syntax and finds none here, and [4/4] proves the template parses, which it would
      # with the constant left in. If that task is ever reordered after `uv lock`, or its
      # anchor drifts, every generated project silently ships named after the template.
      - name: The generated manifest must carry the project's own name
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"
            name=$(grep -m1 '^name = ' pyproject.toml | sed 's/^name = "\(.*\)"$/\1/')
            if [ "$name" = "syntek-base" ]; then
              echo "::error::INCLUDE_MOBILE=$mobile — pyproject.toml is still named 'syntek-base'."
              echo "::error::The copier _task that brands it did not run, or its anchor no longer matches."
              status=1
            elif [ "$name" != "ci-probe" ]; then
              echo "::error::INCLUDE_MOBILE=$mobile — pyproject.toml name is '$name', expected 'ci-probe'."
              status=1
            else
              echo "INCLUDE_MOBILE=$mobile — manifest branded as '$name'"
            fi
            # And the lock must agree, which is what proves the task ran BEFORE uv lock.
            if [ -f uv.lock ] && grep -q '"syntek-base"' uv.lock; then
              echo "::error::INCLUDE_MOBILE=$mobile — uv.lock pins the template's name; the brand task ran too late."
              status=1
            fi
          done
          exit $status

      # A new project owns its version state. It must start at 0.1.0 with a single
      # entry of its own — never syntek-base's number, and never syntek-base's history.
      # These four files ship from .copier/ and are moved into place by a _tasks
      # entry, so this also proves that move ran.
      - name: A generated project starts fresh at 0.1.0
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"

            version="$(cat VERSION)"
            if [ "$version" != "0.1.0" ]; then
              echo "::error::INCLUDE_MOBILE=$mobile — VERSION is '$version', expected 0.1.0."
              echo "::error::The template's root version leaked into the generated project."
              status=1
            fi

            for f in CHANGELOG.md RELEASES.md VERSION-HISTORY.md; do
              # One entry only. More means syntek-base's own history came along.
              entries="$(grep -cE '^## \[|^## v|^\| [0-9]{2}/' "$f" || true)"
              if [ "$entries" -ne 1 ]; then
                echo "::error::INCLUDE_MOBILE=$mobile — $f has $entries entries, expected exactly 1."
                echo "::error::A new project must not inherit the template's release history."
                status=1
              fi
            done

            # The staging directory must be gone — _tasks moves all five files then rmdirs it.
            if [ -d .copier ]; then
              echo "::error::INCLUDE_MOBILE=$mobile — .copier/ survived generation: $(ls .copier)"
              status=1
            fi
          done
          exit $status

      # Seed content for a generated project's sub-packages. Bumping these in
      # syntek-base would hand every new project a sub-package history describing the
      # template's development rather than its own. See CONTRIBUTING.md Section 1b.
      - name: Sub-package version files are pinned at 0.1.0
        run: |
          status=0
          cd "$RUNNER_TEMP/gen-true"
          for pkg in code/src/django code/src/mobile; do
            for f in CHANGELOG.md VERSION-HISTORY.md RELEASES.md; do
              [ -e "$pkg/$f" ] || continue
              if ! grep -q '0\.1\.0' "$pkg/$f"; then
                echo "::error::$pkg/$f does not mention 0.1.0 — sub-package seeds must stay at 0.1.0"
                status=1
              fi
              entries="$(grep -cE '^## \[|^## v|^\| [0-9]{2}/' "$pkg/$f" || true)"
              if [ "$entries" -ne 1 ]; then
                echo "::error::$pkg/$f has $entries entries, expected exactly 1 (seed content)."
                status=1
              fi
            done
          done
          exit $status

      # The opt-in is gated by ONE mechanism: a templated _exclude entry. This step is
      # what proves it still works in both directions — present when asked for, and
      # genuinely absent, not merely empty, when not.
      - name: The mobile surface must obey the opt-in
        run: |
          status=0
          for p in code/src/mobile code/src/scripts/mobile \
                   .claude/skills/stack-react-native; do
            if [ ! -e "$RUNNER_TEMP/gen-true/$p" ]; then
              echo "::error::INCLUDE_MOBILE=true — $p is missing"; status=1
            fi
            if [ -e "$RUNNER_TEMP/gen-false/$p" ]; then
              echo "::error::INCLUDE_MOBILE=false — $p leaked into a web-only project"; status=1
            fi
          done
          for f in code/src/mobile/package.json code/src/mobile/app/index.tsx \
                   code/src/scripts/mobile/server.sh; do
            if [ ! -e "$RUNNER_TEMP/gen-true/$f" ]; then
              echo "::error::INCLUDE_MOBILE=true — $f is missing"; status=1
            fi
          done
          exit $status

      # The single-mechanism rule in prose is worth nothing without this assertion: no
      # file may carry templated contents, so every shared file must be byte-identical
      # across the two paths. Only the answers file may differ.
      - name: Shared files must be byte-identical across both paths
        run: |
          drift=$(diff -rq --exclude=.git --exclude=.copier-answers.yml \
                    "$RUNNER_TEMP/gen-false" "$RUNNER_TEMP/gen-true" \
                    2>/dev/null | grep -v '^Only in ' || true)
          if [ -n "$drift" ]; then
            echo "::error::a shared file differs between the two render paths"
            echo "$drift"
            exit 1
          fi
          echo "every shared file is byte-identical"

      # NOT CHECKED, deliberately: "a web-only project contains no reference to
      # scripts/mobile/". It does contain them — the CI workflows and the two script
      # aggregates name those paths behind a directory-existence guard, which is the
      # whole point of guarding rather than templating. A grep for the string cannot
      # tell a guarded reference from an orphaned one, so it would fail a correct repo.
      # The byte-identical check above is the real guarantee: nothing about the web-only
      # path differs from the mobile path except the files the opt-in removes.

      # NOTE: this file must never contain the literal dollar-brace-brace sequence.
      # GitHub Actions parses its expression syntax anywhere in a workflow file,
      # including inside run blocks, so writing it out — even quoted or backslashed —
      # makes the whole workflow invalid. The patterns below are assembled from
      # escaped braces so the sequence never appears.
      - name: Syntax that must survive rendering untouched
        run: |
          status=0
          for mobile in false true; do
            cd "$RUNNER_TEMP/gen-$mobile"
            gha=$(grep -rIoE '\$\{\{' .github/workflows | wc -l)
            bash_tests=$(grep -rIoE '\[\[' code/src/scripts | wc -l)
            [ "$gha" -gt 50 ] || { echo "::error::INCLUDE_MOBILE=$mobile — workflow expressions were eaten by rendering (found $gha)"; status=1; }
            [ "$bash_tests" -gt 200 ] || { echo "::error::INCLUDE_MOBILE=$mobile — bash test syntax was eaten by rendering (found $bash_tests)"; status=1; }
            echo "INCLUDE_MOBILE=$mobile — workflow expressions: $gha · bash test brackets: $bash_tests"
          done
          exit $status
