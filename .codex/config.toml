# Keep model choice in the user's configuration so the template does not pin a provider release.
approval_policy = "on-request"

# Sandbox: the named profile below, not legacy `sandbox_mode` — a profile is the only syntax
# that can deny reads. A per-run `--sandbox`/`-s`, `-c sandbox_mode=...` or the bypass flag
# still overrides it and drops the carve-outs, so never pass one in this repository.
default_permissions = "workspace-no-env"

# Existing scoped manuals stay discoverable while shared instructions are adopted.
project_doc_fallback_filenames = ["CLAUDE.md"]

# The built-in `:workspace` profile — what `workspace-write` meant: read everywhere, write the
# workspace roots and tmp, .git/.codex/.agents read-only — plus deny-read carve-outs, so no Codex
# process can read a live env file (`.claude/CLAUDE.md` Section 6). `.env.*.example` stays
# readable. The six names are held in step with `.claude/settings.json` and `.zed/settings.json`
# by `code/src/scripts/audits/env-read-deny.sh`. Tested on codex-cli 0.166.0 (15/11/2026).
[permissions.workspace-no-env]
description = "Workspace write, network off, live .env files unreadable"
extends = ":workspace"

# Linux expands `**` globs into bubblewrap masks with a depth-capped scan at each sandbox
# launch; code/src/docker/.env.* is 4 path components deep, so 8 leaves headroom. macOS
# Seatbelt matches the globs natively.
[permissions.workspace-no-env.filesystem]
glob_scan_max_depth = 8

[permissions.workspace-no-env.filesystem.":workspace_roots"]
"**/.env.dev" = "deny"
"**/.env.test" = "deny"
"**/.env.testing" = "deny"
"**/.env.staging" = "deny"
"**/.env.prod" = "deny"
"**/.env.production" = "deny"

# Network stays off, as `network_access = false` did.
[permissions.workspace-no-env.network]
enabled = false

[mcp_servers.code-review-graph]
command = "uvx"
args = ["code-review-graph", "serve"]

# Cross-artefact knowledge graph (docs, PM artefacts and code together) over the local
# graphify-out/ store. The server itself runs through uvx and needs no host install, but the
# store it reads is built only by the host-provided graphify CLI. Advisory beside
# code-review-graph: without a store the agent, not the server, reports graphify unmeasured,
# never clean (code/docs/CODE-REVIEW-GRAPH.md). Unpinned, like its sibling.
[mcp_servers.graphify]
command = "uvx"
args = ["--from", "graphifyy[mcp]", "graphify-mcp"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
env_vars = ["CONTEXT7_API_KEY"]

[mcp_servers.mcp-mermaid]
command = "npx"
args = ["-y", "mcp-mermaid"]

[mcp_servers.mcp-mermaid.env]
npm_config_ignore_scripts = "true"

# Web-grounded search, ask, reason and research over the Perplexity API. Needs
# PERPLEXITY_API_KEY in the environment; without it this one server fails to start.
#
# tool_timeout_sec matches the server's own request deadline (PERPLEXITY_TIMEOUT_MS,
# default 300000): perplexity_research runs for minutes, and Codex's default tool timeout
# would cut it off first.
[mcp_servers.perplexity]
command = "npx"
args = ["-y", "@perplexity-ai/mcp-server"]
env_vars = ["PERPLEXITY_API_KEY"]
tool_timeout_sec = 300

# Primary-source reader. `get` / `bulk_get` return the page's own markdown or a
# CSS-selected fragment, so a claim is cited to text the model actually read — which
# WebFetch cannot supply, because it answers a prompt against the page with a small model
# rather than handing back the source. See .claude/CLAUDE.md Section 3.2, tier 4.
#
# startup_timeout_sec is NOT optional: the default is 10s and a cold `uvx` resolves and
# downloads ~110MB (the playwright and patchright driver bundles) before the server speaks.
[mcp_servers.scrapling]
command = "uvx"
args = ["--from", "scrapling[ai]", "scrapling-mcp"]
startup_timeout_sec = 120
