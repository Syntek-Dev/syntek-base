[project]
name = "<%PROJECT_SLUG%>"
version = "0.1.0"
description = "<%PROJECT_DESCRIPTION%>"
requires-python = ">=3.14"
dependencies = [
  "django>=6.0.4",
  "django-prometheus>=2.3.1",
  "gunicorn",
  "uvicorn[standard]",
  # WhiteNoise serves hashed, pre-compressed static files from the app process itself
  # (CompressedManifestStaticFilesStorage in staging/prod), so the backend container is
  # hermetic — no static volume or separate static server. See config/settings.
  "whitenoise[brotli]>=6.12",
  "dj-database-url",
  "psycopg[binary]",
  "django-cors-headers",
  "django-cloudinary-storage",
  "cloudinary",
  # ── Frontend foundation: Django templates + HTMX + Alpine, server-rendered
  # throughout — there is no React and no client build step. django-components is the
  # single shared server-side component library (django-cotton was dropped — it
  # conflicts with django-components' global template-compilation monkeypatch);
  # django-htmx exposes request.htmx and partial helpers; django-ninja serves the JSON
  # API (at /api/, OpenAPI at /api/docs); django-ratelimit covers generic form rate
  # limiting. Security headers (CSP included) are set at the edge in the server deploy
  # repo — NEVER in this repo — so django-csp is deliberately absent. These are declared
  # now and wired incrementally.
  "django-htmx>=1.19",
  "django-components>=0.151",
  "django-ninja>=1.3",
  "django-ratelimit>=4.1",
  "sentry-sdk[django]",
  "argon2-cffi",
  "cryptography",
  "redis>=5.0.0",
  "django-valkey>=0.4.1",
  "celery[redis]>=5.3",
  # Private-document storage (S3 API). Public media goes to Cloudinary above.
  "boto3>=1.34",
]

# Deliberately NOT declared at baseline — add them with the feature that needs them:
#   pyotp / qrcode / webauthn  — TOTP and passkey ceremonies (the `authentication` agent)
#   bleach                     — sanitising user-authored HTML
#   python-magic / pyclamd     — upload MIME sniffing and ClamAV scanning
#   channels / channels-redis  — ASGI WebSockets; note the stack is one app process
#                                family, so real-time is a stack change argued in an ADR
#   cairosvg                   — SVG rasterisation for an asset pipeline
#   maturin                    — RUST-ONLY. The build backend for the PyO3 extension at
#                                code/src/rust/crates/nativecore/. It is declared in THAT
#                                crate's own pyproject.toml, not here, because this root is
#                                `package = false` — a virtual project never built into a
#                                wheel. On a project generated with INCLUDE_RUST, install it
#                                with `uv tool install maturin`; the scripts check for it.
#   fastmcp                    — the MCP tool surface at /mcp/, for LLM agent clients.
#                                Trigger: an agent must carry out this project's domain
#                                operations. NOT for "exposing the API to AI" — a Ninja
#                                endpoint is already callable by anything speaking HTTP.
#                                Brings starlette into the request path (config/asgi.py
#                                becomes a router). See code/docs/MCP-SERVER.md.

[tool.uv]
package = false

[tool.ruff]
src = ["code/src/django"]
target-version = "py314"
line-length = 100
exclude = [".claude", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert statements (used in tests)
    "S105",  # hardcoded passwords (false positives in settings)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "N806"]
"*/settings/*"   = ["S105", "F405", "F403"]
"*/tests/*"      = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
sections = { "django" = ["django"] }
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.basedpyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["code/src/django"]
exclude = ["**/migrations", "**/__pycache__", "**/tests/**", "**/conftest.py"]
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false

[dependency-groups]
dev = [
  "ruff>=0.11.0",
  "basedpyright>=1.28.0",
  "pip-audit",
]
test = [
  "pytest>=8.0",
  "pytest-django>=4.9",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "factory-boy>=3.3",
  "hypothesis>=6.0",
  "mutmut>=3.0",
  # ── Browser-level e2e. ONE browser driver, in Python: there is no Node test path in
  # this stack. HTMX, Alpine, axe and real-layout overflow are all browser-bound, and
  # Django's test client executes no JavaScript. Tests are marked `e2e` and never run
  # automatically — see [tool.pytest.ini_options] and code/src/scripts/tests/e2e-py.sh.
  "pytest-playwright>=0.5",
  # axe-core packaged for Python + Playwright. Bundles axe.min.js, so the a11y gate
  # carries no Node and no CDN fetch.
  "axe-core-python>=0.1",
]

[tool.pytest.ini_options]
pythonpath = ["code/src/django"]
testpaths = ["code/src/django"]
addopts = "-x -q --strict-markers"
DJANGO_SETTINGS_MODULE = "config.settings.test"
markers = [
  "unit: pure unit tests with no DB access",
  "integration: tests that require a real database",
  "e2e: end-to-end browser tests — never run automatically",
]

[tool.coverage.run]
source = ["apps"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/__init__.py",
]
