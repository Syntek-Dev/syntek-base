[project]
name = "<%PROJECT_SLUG%>"
version = "0.1.0"
description = "<%PROJECT_DESCRIPTION%>"
requires-python = ">=3.14"
dependencies = [
  "django>=6.0.4",
  "django-prometheus>=2.3.1",
  "gunicorn",
  "uvicorn[standard]",
  # WhiteNoise serves hashed, pre-compressed static files from the app process itself
  # (CompressedManifestStaticFilesStorage in staging/prod), so the backend container is
  # hermetic — no static volume or separate static server. See config/settings.
  "whitenoise[brotli]>=6.12",
  "dj-database-url",
  "psycopg[binary]",
  "django-cors-headers",
  "django-cloudinary-storage",
  "cloudinary",
  # ── Frontend foundation: Django templates + HTMX + Alpine, server-rendered
  # throughout — there is no React and no client build step. django-components is the
  # single shared server-side component library (django-cotton was dropped — it
  # conflicts with django-components' global template-compilation monkeypatch);
  # django-htmx exposes request.htmx and partial helpers; django-ninja serves the JSON
  # API (at /api/, OpenAPI at /api/docs); django-ratelimit covers generic form rate
  # limiting. Security headers (CSP included) are set at the edge in the server deploy
  # repo — NEVER in this repo — so django-csp is deliberately absent. These are declared
  # now and wired incrementally.
  "django-htmx>=1.19",
  "django-components>=0.151",
  "django-ninja>=1.3",
  "django-ratelimit>=4.1",
  "sentry-sdk[django]",
  "argon2-cffi",
  "cryptography",
  "redis>=5.0.0",
  "django-valkey>=0.4.1",
  "celery[redis]>=5.3",
  # Private-document storage (S3 API). Public media goes to Cloudinary above.
  "boto3>=1.34",
]

# Deliberately NOT declared at baseline — add them with the feature that needs them:
#   pyotp / qrcode / webauthn  — TOTP and passkey ceremonies (the `authentication` agent)
#   bleach                     — sanitising user-authored HTML
#   python-magic / pyclamd     — upload MIME sniffing and ClamAV scanning
#   channels / channels-redis  — ASGI WebSockets; note the stack is one app process
#                                family, so real-time is a stack change argued in an ADR
#   cairosvg                   — SVG rasterisation for an asset pipeline
#   maturin                    — RUST-ONLY. The build backend for the PyO3 extension at
#                                code/src/rust/crates/nativecore/. It is declared in THAT
#                                crate's own pyproject.toml, not here, because this root is
#                                `package = false` — a virtual project never built into a
#                                wheel. On a project generated with INCLUDE_RUST, install it
#                                with `uv tool install maturin`; the scripts check for it.
#   fastmcp                    — the MCP tool surface at /mcp/, for LLM agent clients.
#                                Trigger: an agent must carry out this project's domain
#                                operations. NOT for "exposing the API to AI" — a Ninja
#                                endpoint is already callable by anything speaking HTTP.
#                                Brings starlette into the request path (config/asgi.py
#                                becomes a router). See code/docs/MCP-SERVER.md.

[tool.uv]
package = false

[tool.ruff]
src = ["code/src/django"]
target-version = "py314"
line-length = 100
exclude = [".claude", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
    "TID", # flake8-tidy-imports (banned-api, below)
]
ignore = [
    "S105",  # hardcoded passwords (false positives in settings)
]

# S101 is deliberately NOT ignored globally. `assert` is banned outside tests: it cannot carry the
# InvariantViolation register key, it is indistinguishable from a failing test in the error tracker,
# and `python -O` strips it. Guard clauses raise instead — code/docs/NEGATIVE-SPACE.md § The guard
# clause. Test code is exempted below, per path, and nowhere else; a `# noqa: S101` is a finding.
[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "N806"]
"*/settings/*"   = ["S105", "F405", "F403"]
"*/tests/*"      = ["S101", "S105", "S106"]
"conftest.py"    = ["S101", "S105", "S106"]
# The one module allowed to import ninja.Schema — it is what re-exports the three bases.
"*/apps/core/schemas.py" = ["TID251"]
# The one module allowed to import Django's BaseCommand — it is what ManagementCommand extends.
"*/apps/core/management/base.py" = ["TID251"]
# N818 wants every exception named `*Error`. `InvariantViolation` and `DependencyUnavailable`
# are named as they are on purpose: neither is a `ServiceError`, and the names carry that
# (`DependencyUnavailable` also dodges `EnvironmentError`, a built-in alias of `OSError`).
# The taxonomy is doctrine — code/docs/NEGATIVE-SPACE.md § The error taxonomy — not a
# naming accident, so the rule yields here rather than the names.
"*/apps/core/services/errors.py" = ["N818"]
# The two PM asset builders shell out to xelatex to render the brand guide and the
# component sheet to PDF. S603 asks whether the input is untrusted; here it demonstrably
# is not, on all three counts that matter: the binary is resolved with `shutil.which`
# rather than taken from a caller, the argument vector is a literal list built in the
# function, and there is no `shell=True` for anything to be interpreted by. Neither
# script is application code — they are developer tooling that runs by hand and produces
# a PDF. Ignored per file rather than per line so the exemption is visible in one place
# and cannot spread by copy-paste into `code/src/django/`.
"*/06-BRAND-GUIDE/guide-build/*" = ["S603"]
"*/07-COMPONENTS/component-build/*" = ["S603"]

# Django Ninja's default is to SILENTLY IGNORE unknown request-body fields. The fix is
# `extra="forbid"`, which Pydantic inherits through subclassing — so it propagates from one
# base class, and the only way to bypass it is to import Schema from ninja directly. That is
# what this bans. See code/docs/api-design/NINJA-CONVENTIONS.md § Schema strictness.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"ninja.Schema".msg = "Import Schema (bodies), OutSchema (responses) or QuerySchema (query params) from apps.core.schemas — never ninja.Schema. See code/docs/api-design/NINJA-CONVENTIONS.md"
# A command has no HTTP status, so the three error classes have to be mapped onto what an
# operator reads and what a scheduler acts on. Subclassing Django's BaseCommand directly skips
# that mapping silently — the command still runs, and a broken invariant just looks like any
# other traceback. Both paths are banned because Django re-exports the class from the package,
# so banning only the module would leave a one-word bypass. See code/docs/MANAGEMENT-COMMANDS.md
"django.core.management.base.BaseCommand".msg = "Subclass ManagementCommand from apps.core.management.base — it maps the error taxonomy onto exit codes. See code/docs/MANAGEMENT-COMMANDS.md"
"django.core.management.BaseCommand".msg = "Subclass ManagementCommand from apps.core.management.base — it maps the error taxonomy onto exit codes. See code/docs/MANAGEMENT-COMMANDS.md"

[tool.ruff.lint.isort]
sections = { "django" = ["django"] }
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.basedpyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["code/src/django"]
exclude = ["**/migrations", "**/__pycache__", "**/tests/**", "**/conftest.py"]
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false

[dependency-groups]
dev = [
  # Floor raised 0.11.0 -> 0.16.3 (14/08/2026). Not housekeeping: from 0.16 ruff
  # formats Python inside Markdown fenced blocks, so the floor decides whether the
  # docs are in scope. It was found by CI resolving the floor to latest while the
  # host ran 0.14.11 — a `>=` constraint is not a pin, and the two disagreed about
  # what "formatted" meant. Raise this deliberately, and reformat in the same change.
  "ruff>=0.16.3",
  "basedpyright>=1.28.0",
  "pip-audit",
]
test = [
  "pytest>=8.0",
  "pytest-django>=4.9",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "factory-boy>=3.3",
  "hypothesis>=6.0",
  "mutmut>=3.0",
  # ── Browser-level e2e. ONE browser driver, in Python: there is no Node test path in
  # this stack. HTMX, Alpine, axe and real-layout overflow are all browser-bound, and
  # Django's test client executes no JavaScript. Tests are marked `e2e` and never run
  # automatically — see [tool.pytest.ini_options] and code/src/scripts/tests/e2e-py.sh.
  "pytest-playwright>=0.5",
  # axe-core packaged for Python + Playwright. Bundles axe.min.js, so the a11y gate
  # carries no Node and no CDN fetch.
  "axe-core-python>=0.1",
]

[tool.pytest.ini_options]
pythonpath = ["code/src/django"]
testpaths = ["code/src/django"]
addopts = "-x -q --strict-markers"
DJANGO_SETTINGS_MODULE = "config.settings.test"
markers = [
  "unit: pure unit tests with no DB access",
  "integration: tests that require a real database",
  "e2e: end-to-end browser tests — never run automatically",
]

[tool.coverage.run]
source = ["apps"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*/__init__.py",
]
