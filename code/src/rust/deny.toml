# cargo-deny policy for <%PROJECT_NAME%>.
#
# Run by code/src/scripts/rust/audit.sh and by the syntax-rust CI job. This is the
# supply-chain gate: crates.io has no review process, and a PyO3 extension runs in the
# same address space as Django with no sandbox between them. A dependency here is
# strictly more dangerous than a pure-Python one.
[advisories]
yanked = "deny"
# Only flag "unmaintained" for crates this workspace depends on DIRECTLY.
unmaintained = "workspace"
# EMPTY BY MEASUREMENT, 16/08/2026 — and the reason is worth keeping.
#
# This list carried RUSTSEC-2026-0194 and -0195, two DoS advisories in quick-xml 0.38.4
# reached only through Slint's accessibility stack (quick-xml <- zbus_xml <- ... <-
# accesskit_unix <- slint). They were accepted on 02/08/2026 as unfixable: the patched
# 0.41.0 line was blocked by version pins all the way up to Slint's own `=1.17.1`.
#
# They are gone because the MSRV floor moved. `rust-version` 1.85 -> 1.92 let the
# resolver take zbus 5.19, which no longer pulls quick-xml at all, so the whole chain
# left the graph — and cargo-deny began warning `advisory-not-detected` on both.
#
# An ignore that matches nothing is not harmless. It suppresses silently: if the crate
# ever returns through another path, the gate stays green and nobody is told. Delete an
# entry the moment its subject leaves the graph, and let a real recurrence re-open the
# argument on its own evidence.
ignore = []

[licenses]
# Permissive only. A copyleft dependency would propagate to anything linking this crate,
# which for a shared package layer is a licence decision, never an incidental one.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",   # Boost Software License — permissive (clipboard-win, error-code)
  "NCSA",      # University of Illinois/NCSA — permissive (libfuzzer-sys)
  "Unlicense", # public-domain dedication (ksni)
]
confidence-threshold = 0.9
# Do not warn about allow-list entries no current dependency uses — the list is a policy
# statement, not an inventory.
unused-allowed-license = "allow"
# Skip our own unpublished crates. Their `license` field carries the project's LICENCE
# answer, which is free text and generally not a valid SPDX expression.
private = { ignore = true }

# ── Slint — DESKTOP SURFACE ONLY ─────────────────────────────────────────────
# Present unconditionally (no file in this template has conditional contents). On a
# project without the desktop surface these simply match nothing, which cargo-deny
# reports as an informational note, not an error.
#
# Slint ships as `GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
# LicenseRef-Slint-Software-3.0`. We take the ROYALTY-FREE arm: free for proprietary and
# commercially sold desktop applications, in exchange for disclosing our use of Slint —
# the AboutSlint widget, enforced by code/src/scripts/desktop/package.sh.
#
# Per-crate exceptions rather than allow-list entries on purpose: this is a deliberate,
# conditional licence choice carrying an obligation, and it must be impossible to acquire
# by accident for an unrelated dependency.
#
# It does NOT cover embedded systems, nor redistributing a library that exposes Slint's
# own APIs. Full detail: code/docs/DESKTOP.md.
[[licenses.exceptions]]
crate = "slint"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint-build"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-common"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-compiler"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-core"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-core-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-selector"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-winit"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-femtovg"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-skia"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-software"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[bans]
# Two versions of the same crate in one binary usually means a transitive dependency
# lagged behind. It is a warning rather than an error because it is often outside your
# control, but it is never noise: for a crypto crate it can mean two implementations.
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
