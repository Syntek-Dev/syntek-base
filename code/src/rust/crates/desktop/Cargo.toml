# The native desktop application for <%PROJECT_NAME%>, built with Slint.
#
# A member of the workspace above rather than a second workspace: one toolchain pin, one
# deny.toml, one clippy.toml. `slint` is pinned HERE rather than in
# [workspace.dependencies] because exactly one member uses it — which also means turning
# INCLUDE_DESKTOP on adds files without editing a single shared one.

[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
# Never published. It is an application, not a library, and the Royalty-free Slint licence
# does not permit redistributing something that exposes Slint's own APIs.
publish = false
description = "Native desktop application for <%PROJECT_NAME%>"

[[bin]]
# `desktop` is a HOUSE CONSTANT, not a token — the same reasoning as `nativecore`, plus a
# hard constraint the other names do not have: rustc validates a crate name as an
# IDENTIFIER, and `<`, `%` and `>` are not legal in one. A token here does not merely read
# oddly before generation, it makes the whole workspace uncompilable — `cargo clippy
# --workspace` and every other workspace command fail in the template itself, so the lint
# table below can never be proven before a project is generated.
#
# The branded executable is still produced: `scripts/desktop/package.sh` renames the
# artefact after the build, where the name is a filename rather than a grammar.
name = "desktop"
path = "src/main.rs"

[dependencies]
slint = "1.17"

[build-dependencies]
slint-build = "1.17"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Same reasoning as nativecore: a panic here kills the user's application window with no
# error they can act on. Return Result and surface the failure in the UI.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
# The panicking macros `panic = "deny"` does not cover — clippy lints the `panic!` macro
# only, and all three sit in the `restriction` group that `all` excludes, so each is
# denied by name. `unreachable!()` included: a window that vanishes is no better for
# being unreachable in theory. A provably dead branch takes an
# `#[allow(clippy::unreachable)]` with the proof in a comment.
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
