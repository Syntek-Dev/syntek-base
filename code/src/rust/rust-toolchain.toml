# Pins the toolchain for every Rust operation in this repository.
#
# rustup reads this file automatically, so `cargo` invoked anywhere under code/src/rust/
# uses this exact toolchain — CI, the Docker build stage, and a developer's laptop all
# compile with the same compiler. Bumping it is a template release, not a routine change.
#
# The channel and `rust-version` in Cargo.toml are NOT a matched set — they answer
# different questions, and neither is derived from the other. The channel is the compiler
# everyone actually builds with; `rust-version` is the floor cargo RESOLVES against.
#
# The second half of that used to read "dragging the MSRV up buys nothing, because the
# toolchain is pinned anyway". That was true of MSRV as a consumer promise and is false of
# `resolver = "3"`, which is MSRV-aware: the floor decides which dependency versions the
# graph may use, whatever compiler is pinned here. Corrected 16/08/2026 after a floor of
# 1.85 was measured downgrading four crates that require 1.87.

[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
