
# Cargo workspace for <%PROJECT_NAME%>.
#
# Every crate in this repository is a member. Dependencies shared by more than one crate
# are pinned once in [workspace.dependencies] and inherited with `dep.workspace = true`,
# so a security patch is applied in exactly one place.
#
# Rust operations run through code/src/scripts/rust/*.sh — never raw `cargo`.

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "<%LICENCE%>"
authors = ["<%DEVELOPER_NAME%> <<%DEVELOPER_EMAIL%>>"]
# rust-version is a RESOLUTION INPUT, not only a promise to a consumer. `resolver = "3"`
# above is MSRV-aware: cargo picks the newest dependency version compatible with this
# number, so a floor left behind the pinned channel silently holds the whole graph back.
# Measured 16/08/2026 — at 1.85 an update reported "Locking 57 packages to latest Rust 1.85
# compatible versions" and DOWNGRADED zbus 5.18 → 5.14, zvariant, zbus_names and
# zvariant_utils, all of which now require 1.87. The toolchain in rust-toolchain.toml is
# still the compiler everyone builds with; this is what they are allowed to resolve against.
rust-version = "1.92"

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py314"] }
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10"

# Release profile for the extension module. `panic = "abort"` is NOT set: a Rust panic
# crossing the PyO3 boundary is converted into a Python exception, and aborting would
# take the whole Gunicorn worker with it.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
