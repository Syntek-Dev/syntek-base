server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_upstream http://django:8000;
    root /staticfiles;

    # Django serves the finders live under DEBUG; nginx only forwards.
    location /static/ {
        try_files $uri @django;
        proxy_pass $django_upstream;
        access_log off;
    }

    location / {
        proxy_pass $django_upstream;
    }

    location @django {
        proxy_pass $django_upstream;
    }
}
