<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — known positive (three-up)</title>
    <!--
      KNOWN POSITIVE. Three cards into a three-column grid, so at 1280px they render
      as one row of three boxes with identical width and height. This is the Section 4.1
      repetition tell, and render-slop.sh --self-test asserts the detector stamps it.

      Do not "fix" this screen. It is ground truth, not a wireframe: its whole job is
      to be wrong in exactly one measurable way. If the detector stops flagging it,
      the detector is what broke.

      Styling is inline and self-contained ON PURPOSE — this pair must not depend on
      SHARED/wireframe.css, or a legitimate change to the wireframe system would
      silently move the ground truth the gate is proved against.
    -->
    <style>
      body {
        margin: 0;
        padding: 48px;
        font-family: system-ui, sans-serif;
      }
      .row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .card {
        min-height: 220px;
        padding: 24px;
        border: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Known positive</h1>
      <div class="row">
        <article class="card">
          <h2>One</h2>
          <p>Three equal cards on one row at 1280px.</p>
        </article>
        <article class="card">
          <h2>Two</h2>
          <p>Same width, same height, same device.</p>
        </article>
        <article class="card">
          <h2>Three</h2>
          <p>The row the detector must stamp.</p>
        </article>
      </div>
    </main>
  </body>
</html>
