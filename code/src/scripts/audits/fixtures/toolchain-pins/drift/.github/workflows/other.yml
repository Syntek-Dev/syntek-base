name: Fixture other

on: workflow_dispatch

jobs:
  other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@0000000000000000000000000000000000000000 # v7.1.0
        with:
          node-version-file: .node-version

      - uses: actions/setup-python@0000000000000000000000000000000000000000 # v6.0.0
        with:
          python-version: "3.x"

  unversioned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@0000000000000000000000000000000000000000 # v7.1.0

      - uses: astral-sh/setup-uv@0000000000000000000000000000000000000000 # v10.0.1
