name: Fixture gate

on: workflow_dispatch

env:
  UV_VERSION: "0.12.5"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@0000000000000000000000000000000000000000 # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@0000000000000000000000000000000000000000 # v6.0.10

      - uses: actions/setup-node@0000000000000000000000000000000000000000 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Probe the interpreter
        run: uv run --no-project --python 3.14 python -V
