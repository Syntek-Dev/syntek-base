# secrets-in-source.yml
#
# Hard-coded credentials in source. House doctrine is absolute:
#   .claude/CLAUDE.md section 6, "All secrets via environment variables, never
#   hardcoded", and code/docs/security/SECRETS-AND-TRANSPORT.md, "Never hardcode
#   secrets. This is an absolute rule with no exceptions."
#
# Why this is not already covered: pyproject.toml deliberately ignores ruff's S105
# (hardcoded password string) because it fires on Django settings key names. That
# leaves the real case unscanned. These rules require a credential-shaped *name* and
# a credential-shaped *value* together, which is what makes them quiet enough to gate.
#
# A finding here is not a lint failure to be silenced. Treat the value as compromised
# and rotate it (SECRETS-AND-TRANSPORT.md, "Repository hygiene").
#
# Authored in-house from this repository's own guides. No upstream rule text was
# consulted, copied, adapted or paraphrased (see the audits CLAUDE.md licence note).

rules:
  - id: hardcoded-credential-assignment
    languages: [python]
    severity: ERROR
    paths:
      exclude:
        - "*.example"
        - "conftest.py"
        - "tests/"
        - "test_*.py"
        - "*_test.py"
    patterns:
      - pattern: $NAME = $VALUE
      - metavariable-regex:
          metavariable: $NAME
          regex: "(?i)^[A-Za-z0-9_.]*(secret|password|passwd|api_?key|apikey|access_?key|auth_?token|private_?key|credential|client_?secret|encryption_?key|signing_?key)[A-Za-z0-9_.]*$"
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^[''"][^''"\s]{12,}[''"]$'
    message: >-
      A credential-shaped name is assigned a literal value. Project doctrine has no
      exception to this: all secrets, API keys, tokens and credentials live in
      environment variables (.claude/CLAUDE.md section 6, and
      code/docs/security/SECRETS-AND-TRANSPORT.md, "Secrets Management"). Read it with
      `os.environ["NAME"]` and declare it in the matching `.env.*.example` template with
      an empty or obviously placeholder value. If this value ever reached a commit,
      treat it as compromised and rotate it now: git history is not a redaction tool.
    metadata:
      doctrine: "All secrets via environment variables, never hardcoded."
      guide: code/docs/security/SECRETS-AND-TRANSPORT.md
      owasp: "A07:2021 Identification and Authentication Failures"
      why-not-ruff: "pyproject.toml ignores ruff S105, so this case is otherwise unscanned."
      authored: in-house

  - id: hardcoded-credential-in-dict-literal
    languages: [python]
    severity: ERROR
    paths:
      exclude:
        - "*.example"
        - "conftest.py"
        - "tests/"
        - "test_*.py"
        - "*_test.py"
    patterns:
      - pattern: "{..., $KEY: $VALUE}"
      - metavariable-regex:
          metavariable: $KEY
          regex: '(?i)^[''"][A-Za-z0-9_.]*(secret|password|passwd|api_?key|apikey|access_?key|auth_?token|private_?key|credential|client_?secret)[A-Za-z0-9_.]*[''"]$'
      - metavariable-regex:
          metavariable: $VALUE
          regex: '^[''"][^''"\s]{12,}[''"]$'
    message: >-
      A credential-shaped key in a dictionary literal carries a literal value. Django
      settings dictionaries (DATABASES, CACHES, a third-party client config) are the
      usual place this happens, and they are exactly the files that get read aloud in a
      screen share. Move the value to an environment variable
      (.claude/CLAUDE.md section 6, code/docs/security/SECRETS-AND-TRANSPORT.md).
    metadata:
      doctrine: "All secrets via environment variables, never hardcoded."
      guide: code/docs/security/SECRETS-AND-TRANSPORT.md
      owasp: "A07:2021 Identification and Authentication Failures"
      authored: in-house

  - id: hardcoded-connection-uri-with-password
    languages: [generic]
    severity: ERROR
    paths:
      exclude:
        - "*.example"
        - "*.lock"
    pattern-regex: '\b(?:postgres|postgresql|mysql|mongodb|redis|rediss|amqp|amqps|ftp)://[^\s:/@"'']+:[^\s:/@"'']+@'
    message: >-
      A connection URI carries an inline password. The whole string is a credential, and
      it will be copied into a log line, a traceback or a Sentry event the first time the
      connection fails. Build the URI from environment variables at runtime
      (code/docs/security/SECRETS-AND-TRANSPORT.md, "Secrets Management"), and keep the
      placeholder form in `.env.*.example` only.
    metadata:
      doctrine: "All secrets via environment variables, never hardcoded."
      guide: code/docs/security/SECRETS-AND-TRANSPORT.md
      owasp: "A07:2021 Identification and Authentication Failures"
      authored: in-house

  - id: hardcoded-private-key-material
    languages: [generic]
    severity: ERROR
    pattern-regex: "-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY-----"
    message: >-
      Private key material is embedded in a tracked file. Keys are supplied by the
      environment or the secrets manager at run time, never checked in
      (code/docs/security/SECRETS-AND-TRANSPORT.md, "Secrets Management"). Remove it,
      then rotate the key: it must be treated as compromised from the moment it was
      written to disk in the repository.
    metadata:
      doctrine: "All secrets via environment variables, never hardcoded."
      guide: code/docs/security/SECRETS-AND-TRANSPORT.md
      owasp: "A02:2021 Cryptographic Failures"
      authored: in-house

  - id: django-insecure-default-secret-key
    languages: [generic]
    severity: ERROR
    paths:
      exclude:
        - "*.example"
    pattern-regex: '[''"]django-insecure-'
    message: >-
      This is the throwaway SECRET_KEY Django writes at project creation. It is a real
      signing key in production: it signs sessions, password-reset tokens and every
      `signing.dumps()` payload. Replace it with an environment variable
      (.claude/CLAUDE.md section 6, code/docs/security/SECRETS-AND-TRANSPORT.md) and
      keep the literal out of the repository entirely.
    metadata:
      doctrine: "All secrets via environment variables, never hardcoded."
      guide: code/docs/security/SECRETS-AND-TRANSPORT.md
      owasp: "A02:2021 Cryptographic Failures"
      authored: in-house
