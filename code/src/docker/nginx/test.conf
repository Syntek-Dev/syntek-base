# Test reverse proxy — everything resolves to the django-test upstream.
#
# The baseline serves only /control/ (Django's admin). The catch-all below is kept so
# application routes work the moment they are added, without touching this file.

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Docker's embedded DNS, so nginx resolves the upstream at request time rather than
    # caching it at start-up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $django_upstream http://django-test:8000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # Collected static files, shared from the test image via the staticfiles volume.
    location /static/ {
        alias /staticfiles/;
        access_log off;
    }

    location /media/ {
        proxy_pass $django_upstream;
    }

    # Django's built-in admin. Never /admin/ — see code/docs/URL-STRATEGY.md.
    location /control/ {
        proxy_pass $django_upstream;
    }

    location / {
        proxy_pass $django_upstream;
    }
}
