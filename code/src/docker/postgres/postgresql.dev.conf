# Dev-only PostgreSQL configuration.
# Mounted read-only into the db service via docker-compose.dev.yml.
#
# Statement logging is off. Logged statements carry their bound parameters, so any
# encrypted-at-rest column would reach the container logs in the clear the moment it is
# queried. If slow-query visibility is needed later, weigh it against that exposure
# explicitly rather than just raising the level — see code/docs/PERFORMANCE.md.

listen_addresses = '*'

log_statement = 'none'
log_min_duration_statement = -1
log_connections = off
log_disconnections = off
