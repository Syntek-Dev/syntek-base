# Development stack — hot-reload, reachable at http://localhost:81
# Run from the project root:
#   docker compose --env-file code/src/docker/.env.dev -f code/src/docker/docker-compose.dev.yml up
#
# Required env vars: POSTGRES_PASSWORD, SECRET_KEY
# Optional:          POSTGRES_USER (default: <%PROJECT_SLUG%>), DEBUG (default: true)
name: "<%PROJECT_SLUG%>-dev"

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: "<%PROJECT_SLUG%>_dev"
      POSTGRES_USER: ${POSTGRES_USER:-<%PROJECT_SLUG%>}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--no-data-checksums"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
      - ./postgres/postgresql.dev.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    # The probe reads the container's OWN environment ($$ escapes compose interpolation), so
    # nothing project-specific appears inside a CMD-SHELL string. A token interpolated here
    # instead is a shell redirection, not a name: `-d <%PROJECT_SLUG%>_dev` sends the shell
    # looking for a file called `%PROJECT_SLUG%`, the probe never runs, and `db` never reports
    # healthy — which silently stops every service that waits on it.
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  cache:
    image: valkey/valkey:8-alpine
    command: valkey-server --save 20 1 --loglevel warning
    volumes:
      - valkey_dev_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  django:
    build:
      context: ../../..
      dockerfile: code/src/docker/django/Dockerfile.dev
    volumes:
      - ../django:/workspace/code/src/django
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgresql://${POSTGRES_USER:-<%PROJECT_SLUG%>}:${POSTGRES_PASSWORD}@db:5432/<%PROJECT_SLUG%>_dev
      REDIS_URL: redis://cache:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEBUG: "${DEBUG:-true}"
    # /health/ — the dedicated liveness route, which now exists (apps.health). It answers
    # 200 `ok` and touches no dependency, so this probe reports on the process rather than
    # on PostgreSQL. Previously /control/, whose 302 proved the same thing by accident and
    # only while the admin remained the one route the baseline served. The prod and staging
    # images already probed /health/, so until it landed they shipped permanently unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # Host 81, not 80 — a local router (e.g. DDEV) commonly holds 127.0.0.1:80.
      - "127.0.0.1:81:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../django/staticfiles:/staticfiles:ro
    depends_on:
      - django
    restart: unless-stopped

volumes:
  postgres_dev_data:
  valkey_dev_data:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24
          gateway: 10.0.1.1
