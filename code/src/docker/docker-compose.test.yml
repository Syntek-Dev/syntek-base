# Test stack — automated testing, reachable at http://localhost:83
# Run from the project root:
#   docker compose -f code/src/docker/docker-compose.test.yml up --abort-on-container-exit
# Tests exit with pytest's exit code.
name: "<%PROJECT_SLUG%>-test"

services:
  db:
    image: postgres:18-alpine
    command: postgres -N 200
    environment:
      POSTGRES_DB: "<%PROJECT_SLUG%>_test"
      POSTGRES_USER: ${POSTGRES_USER:-<%PROJECT_SLUG%>}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_password_change_me}
      # PG18 defaults pg_hba.conf to requiring SSL for remote hosts; scram-sha-256
      # without SSL is fine on the isolated test network.
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--no-data-checksums"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql
    # The probe reads the container's OWN environment ($$ escapes compose interpolation), so
    # nothing project-specific appears inside a CMD-SHELL string. A token interpolated here
    # instead is a shell redirection, not a name: `-d <%PROJECT_SLUG%>_test` sends the shell
    # looking for a file called `%PROJECT_SLUG%`, the probe never runs, and `db` never reports
    # healthy — which silently stops every service that waits on it.
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  cache:
    image: valkey/valkey:8-alpine
    command: valkey-server --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  django-test:
    build:
      context: ../../..
      dockerfile: code/src/docker/django/Dockerfile.test
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://${POSTGRES_USER:-<%PROJECT_SLUG%>}:${POSTGRES_PASSWORD:-test_password_change_me}@db:5432/<%PROJECT_SLUG%>_test
      REDIS_URL: redis://cache:6379/0
      SECRET_KEY: ${SECRET_KEY:-test-secret-key-not-for-production}
    volumes:
      - ../scripts/tests/reports:/workspace/code/src/scripts/tests/reports:rw
      - staticfiles_test:/workspace/code/src/django/staticfiles
    # See the note in docker-compose.dev.yml — /health/ is the dedicated liveness route.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      # Host 83 (dev nginx holds 81) so both stacks can run concurrently.
      - "127.0.0.1:83:80"
    volumes:
      - ./nginx/test.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_test:/staticfiles:ro
    depends_on:
      - django-test

volumes:
  staticfiles_test:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.1
