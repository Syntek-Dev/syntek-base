# Production stack — images pulled exclusively from GHCR (built by GitHub Actions).
# The server provides Nginx (reverse proxy), Postgres, Valkey, and the tunnel.
# Django runs Gunicorn with Uvicorn workers (ASGI) and server-renders the site.
#
# Server Nginx should proxy: /static/, /media/, /control/, / → http://127.0.0.1:8000
#
# Deploy:
#   docker compose -f docker-compose.prod.yml pull && \
#   docker compose -f docker-compose.prod.yml up -d
#
# Required env vars (managed secrets on the server — never a committed .env):
#   DATABASE_URL, REDIS_URL, SECRET_KEY, ALLOWED_HOSTS, IMAGE_TAG
name: "<%PROJECT_SLUG%>-prod"

services:
  django:
    image: ghcr.io/<%ORG_SLUG%>/<%PROJECT_SLUG%>/django:${IMAGE_TAG:?IMAGE_TAG is required}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DEBUG: "false"
      # Gunicorn + Uvicorn worker tuning
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_MAX_REQUESTS: ${GUNICORN_MAX_REQUESTS:-1000}
    restart: unless-stopped
