# The web surface is server-rendered by Django and has no client build: the root
# package.json carries repo tooling only (markdownlint, prettier, eslint, lefthook,
# bruno). The glob below exists for the OPTIONAL React Native mobile surface at
# code/src/mobile/, which is a real workspace member with its own package.json.
#
# Why a glob and not a named entry: pnpm treats a matched directory as a package only
# when it contains a package.json, so this resolves to the mobile app when the project
# opted in and to NOTHING when it did not. That keeps this file byte-identical on both
# template render paths, which is what lets the opt-in stay gated entirely by one
# templated `_exclude` entry in copier.yml — one conditionalisation mechanism, with no
# file anywhere carrying templated contents.
#
# Trade-off accepted: the glob is implicit. Any future directory under code/src/ that
# carries a package.json joins this workspace without anyone declaring it.
packages:
  - "code/src/*"
allowBuilds:
  esbuild: false
  lefthook: false
  msw: false
  protobufjs: false
  sharp: false
  # Native resolver pulled in by the mobile surface's eslint plugins. Left unbuilt like
  # every other entry here — it ships prebuilt binaries, and mobile lint passes without
  # running its install script.
  unrs-resolver: false
# Ignored advisories, and they are read from THIS FILE — `pnpm audit` has no
# CLI flag for them, and passing `--ignore <GHSA>` makes pnpm print "No new
# vulnerabilities were ignored" and exit 0 without auditing anything at all
# (that false green is fixed in .claude/hooks/lib/check-security.sh).
#
# The key is `audit.ignore`, renamed from `auditConfig.ignoreGhsas` on
# 14/08/2026 once the pin reached 11.21.0. The attempt on 13/08/2026 failed
# because the `audit:` section landed across the 11.15–11.19 releases and the
# pin was 11.15.1, at the very bottom of that window: the ignores stopped
# applying silently, the `(N ignored)` line vanishing with no warning and no
# error. Both spellings still work and the new section WINS when both are
# present, so never carry both — a leftover `auditConfig:` block would sit
# there looking authoritative while deciding nothing.
#
# Verified the way the old comment demanded, by the report line rather than the
# exit code — `bash code/src/scripts/audits/security.sh --js-only`, three ways:
#   auditConfig.ignoreGhsas  →  4 high (4 ignored)   clean
#   audit.ignore             →  4 high (4 ignored)   clean
#   neither key              →  4 high              VULNERABLE
# The third run is the one that makes the other two mean anything: it is what
# proves the entries below are load-bearing rather than decorative.
#
# Four of the five entries resolve in this tree — GHSA-jxxr-4gwj-5jf2 now
# matches nothing, so 4 is the expected count and not a shortfall. Left in
# place rather than deleted: an ignore that matches nothing costs nothing, and
# the advisory can return through a different consumer.
# Source: https://pnpm.io/cli/audit
audit:
  ignore:
    - GHSA-jxxr-4gwj-5jf2
    - GHSA-5375-pq7m-f5r2
    - GHSA-99f4-grh7-6pcq
    # image-size — NO PATCHED RELEASE EXISTS. Both advisories name ">=2.0.3" as
    # the fix; the newest published version is 2.0.2, so there is nothing to
    # upgrade to and an override floor of >=2.0.3 fails the install outright
    # (ERR_PNPM_NO_MATCHING_VERSION, hit 13/08/2026). Reached only through
    # expo → @expo/metro → metro, i.e. the MOBILE surface's bundler: dev-time
    # tooling, absent from every deployed artefact and from a web-only project
    # entirely. Ignored on availability, not on judgement — re-check when 2.0.3
    # ships and delete both lines.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
minimumReleaseAgeExclude:
  - js-yaml@4.1.2
  - markdown-it@14.1.2
  - axios@1.15.0
  - postcss@8.5.10
  - axios@1.15.1
  - axios@1.15.2
  - fast-uri@3.1.2
  - esbuild@0.28.1
  - form-data@4.0.6
  - "@babel/core@7.29.1"
  - ws@8.21.0
  - protobufjs@7.6.3
  - protobufjs@8.5.1
overrides:
  # Advisory floors, each BOUNDED BY ITS MAJOR — `>=<patched> <<next major>`.
  #
  # Re-floored 13/08/2026 against `audits/security.sh --js-only`: every one was
  # below its patched version, which is why 36 advisories (19 high, 17 moderate)
  # stood open. The gate had never reported them — see the false green fixed in
  # .claude/hooks/lib/check-security.sh.
  #
  # The upper bound is not decoration. An override is a FORCED resolution, so a
  # bare `>=` floor resolves to whatever is newest and drags every consumer
  # across any major boundary in between — silently, because the advisory is
  # cleared either way. Measured the same day: a bare floor would have taken
  # nanoid 3 → 6 (ESM-only, breaks every CJS require), js-yaml 4 → 5,
  # undici 7 → 8, linkify-it 5 → 6 and fast-uri 3 → 4. Fixing a moderate
  # advisory by breaking the build is not a fix. Bound every one.
  axios: ">=1.18.0 <2"
  fast-uri: ">=3.1.5 <4"
  js-yaml: ">=4.3.1 <5"
  undici: ">=7.29.0 <8"
  ip-address: ">=10.3.1 <11"
  linkify-it: ">=5.0.2 <6"
  nanoid: ">=3.3.18 <4"
  markdown-it@>=13.0.0 <14.1.2: ^14.1.2
  postcss@<8.5.10: ^8.5.10
  esbuild@<0.28.1: ^0.28.1
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  "@babel/core@<=7.29.0": ^7.29.1
  lodash: ">=4.18.0"
  uuid: ">=11.0.0"
  glob: ">=11.0.0"
  # istanbul's coverage instrumentation reaches Jest through test-exclude. Version 6
  # calls promisify() on glob's default export, which stopped being a function in glob
  # 11 — so the `glob: ">=11.0.0"` line above silently breaks mobile coverage collection.
  # v7 uses glob's named export and satisfies that floor, keeping the security posture.
  test-exclude: ">=7.0.1"
  # Same root cause, second consumer — but the real constraint is an INTEROP SHAPE, not a
  # version floor. @jest/reporters@29.7.0 does `_interopRequireDefault(require('glob'))` and
  # then calls glob.sync. glob 10 and 11 both set __esModule with no `default` export, so
  # `.default.sync` is undefined and the coverage reporter dies — upgrading is not an option,
  # and jest-expo pins the Jest 29 line so the reporter cannot be replaced either.
  # glob 9 is the NEWEST version that still works: it ships a CJS wrapper
  # (module.exports = Object.assign(globFn, { default: globFn, glob: globFn })) whose default
  # carries .sync. Preferred over glob 7 because its dependencies are minipass / minimatch 8 /
  # fs.realpath / path-scurry — it drops inflight@1.0.6, the unbounded-memory-leak package the
  # repo-wide floor above removes everywhere else. Scoped to that ONE dev-only, test-time
  # package; the floor is untouched and nothing in the delivery path is affected.
  "@jest/reporters>glob": "^9.3.5"
  ws: ">=8.21.0"
  brace-expansion: ">=5.0.9 <6"
  qs: ">=6.15.2"
  shell-quote: ">=1.8.4"
  # protobufjs keeps its two-major split rather than taking a single floor: the
  # 7.x and 8.x lines have separate advisories and separate consumers, and a
  # blanket ">=8.6.6" would drag a 7.x consumer across a major boundary to fix a
  # vulnerability that its own line already patches.
  "@grpc/proto-loader>protobufjs": ">=8.6.6"
  "grpc-js-reflection-client>protobufjs": ">=8.6.6"
  protobufjs@>=8.0.0 <8.6.6: ">=8.6.6"
  protobufjs@>=7.0.0 <7.6.3: ^7.6.3
allowedDeprecatedVersions:
  whatwg-encoding: "*"
  node-domexception: "*"
