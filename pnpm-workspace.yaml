# The web surface is server-rendered by Django and has no client build: the root
# package.json carries repo tooling only (markdownlint, prettier, eslint, lefthook,
# bruno). The glob below exists for the OPTIONAL React Native mobile surface at
# code/src/mobile/, which is a real workspace member with its own package.json.
#
# Why a glob and not a named entry: pnpm treats a matched directory as a package only
# when it contains a package.json, so this resolves to the mobile app when the project
# opted in and to NOTHING when it did not. That keeps this file byte-identical on both
# template render paths, which is what lets the opt-in stay gated entirely by one
# templated `_exclude` entry in copier.yml — one conditionalisation mechanism, with no
# file anywhere carrying templated contents.
#
# Trade-off accepted: the glob is implicit. Any future directory under code/src/ that
# carries a package.json joins this workspace without anyone declaring it.
packages:
  - "code/src/*"
allowBuilds:
  esbuild: false
  lefthook: false
  msw: false
  protobufjs: false
  sharp: false
  # Native resolver pulled in by the mobile surface's eslint plugins. Left unbuilt like
  # every other entry here — it ships prebuilt binaries, and mobile lint passes without
  # running its install script.
  unrs-resolver: false
# Ignored advisories, and they are read from THIS FILE — `pnpm audit` has no
# CLI flag for them, and passing `--ignore <GHSA>` makes pnpm print "No new
# vulnerabilities were ignored" and exit 0 without auditing anything at all
# (that false green is fixed in .claude/hooks/lib/check-security.sh).
#
# The key is `audit.ignore`, renamed from `auditConfig.ignoreGhsas` on
# 14/08/2026 once the pin reached 11.21.0. The attempt on 13/08/2026 failed
# because the `audit:` section landed across the 11.15–11.19 releases and the
# pin was 11.15.1, at the very bottom of that window: the ignores stopped
# applying silently, the `(N ignored)` line vanishing with no warning and no
# error. Both spellings still work and the new section WINS when both are
# present, so never carry both — a leftover `auditConfig:` block would sit
# there looking authoritative while deciding nothing.
#
# Verified the way the old comment demanded, by the report line rather than the
# exit code — `bash code/src/scripts/audits/security.sh --js-only`. The rename
# was proven three ways on 14/08/2026, when four entries still resolved:
#   auditConfig.ignoreGhsas  →  4 high (4 ignored)   clean
#   audit.ignore             →  4 high (4 ignored)   clean
#   neither key              →  4 high              VULNERABLE
# The third run is the one that makes the other two mean anything: it is what
# proves the entries below are load-bearing rather than decorative. Re-proven
# 15/08/2026 by the same method after the deletion described next:
#   audit.ignore             →  2 high (2 ignored)   clean
#   neither key              →  2 high              VULNERABLE
# Re-proven 14/10/2026 after the sweep below added five and deleted three:
#   audit.ignore  →  1 low (1 ignored) | 2 moderate (2 ignored) | 3 high (3 ignored)   clean
#   neither key   →  1 low | 2 moderate | 3 high                                     VULNERABLE
# Re-proven 02/11/2026 after the second sweep added five, deleted two and kept the
# patched pair:
#   audit.ignore  →  2 low (2 ignored) | 4 moderate (4 ignored) | 3 high (3 ignored)   clean
#   neither key   →  2 low | 4 moderate | 3 high                                     VULNERABLE
# Every entry now resolves, so the `(N ignored)` total equals the list length.
#
# Two @grpc/grpc-js entries — GHSA-5375-pq7m-f5r2 and GHSA-99f4-grh7-6pcq —
# were DELETED on 15/08/2026 rather than documented, because a patched release
# existed the whole time they sat here. They arrived unannotated in fc905eb and
# were carried unexplained for two weeks. @usebruno/requests (0.19.0, locked then
# and now) declares ^1.13.3, so the fixed 1.14.4 already satisfied the range: the
# lockfile was merely stale, and `pnpm update @grpc/grpc-js` cleared both with no
# override needed. The rule the deletion sets: an ignore whose advisory HAS a
# published fix is a suppression, not a decision. Ignore on availability, never
# on inertia.
#
# Three more were DELETED on 14/10/2026 under that rule:
# - GHSA-jxxr-4gwj-5jf2 (brace-expansion >=5.0.0 <5.0.6). It had matched nothing
#   since the brace-expansion floor passed 5.0.6, and was kept on "an ignore that
#   matches nothing costs nothing". It costs the rule: its fix was published, so
#   it was a suppression waiting for a consumer to re-arm it.
# - The image-size pair, GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq. Their re-check
#   trigger fired (2.0.3 shipped 14/09/2026) but 2.x would cross metro 0.84.4's
#   ^1.0.2, so the fix taken is removal instead: metro 0.84.5 dropped image-size,
#   and @expo/metro 56.0.2 is the first release whose exact metro-* pins all land
#   on 0.84.5. Both sit inside ranges already declared (expo: @expo/metro ~56.0.0;
#   react-native and @react-native/*: ^0.84.3), so a lockfile refresh took them
#   with no override. Six metro selectors did the moving on the day and were
#   retired once dependencies/update.sh could refresh a transitive dependency
#   itself; the lockfile holds the result.
#
# One more was DELETED on 02/11/2026 under the same rule, because its named trigger
# fired: GHSA-86w9-cpqp-85rv (node-forge, "delete when a release above 1.4.0
# ships"). 1.4.1 shipped 27/10/2026 with the fix and 1.4.2 is latest; both
# consumers, @expo/cli and @expo/code-signing-certificates, declare ^1.3.3, so a
# lockfile refresh took it — and eleven further node-forge advisories with it.
# And GHSA-vfj7-8cjw-p6xm (braces <=3.0.3): GitHub WITHDREW the advisory on
# 23/10/2026, so it matched nothing — braces is still 3.0.3 and unchanged. An ignore
# for a withdrawn advisory is the same suppression waiting to re-arm.
#
# Three more were DELETED on 09/11/2026 with Expo SDK 58, each because its named
# trigger fired, and the patch went with its pair:
# - GHSA-mrhx-c7xc-m3w5 (zod 3.x). expo 58.0.23 is on @expo/cli 58.1.19, which has no
#   zod; the only zod left resolves to 4.6.7, past the 4.6.6 fix.
# - GHSA-vcc3-ghjq-m6fr and GHSA-qr28-fpjm-wq7f (decode-uri-component), with
#   patches/decode-uri-component@0.2.2.patch. expo-router 58.0.30 no longer depends on
#   query-string@7, so decode-uri-component is absent from the graph.
# Proven by the report line: with all three gone the audit read 6 ignored and clean,
# and with the key removed the same six, and only those, came back VULNERABLE.
#
# Every entry left below is LEFT VULNERABLE and says so. Were a patched-in-place
# entry ever needed again, it would be a second kind — the code fixed, the line there
# only because `pnpm audit` cannot see a patch — and it would sit under a heading of
# its own. Never collapse the two under one heading.
# Source: https://pnpm.io/cli/audit
audit:
  ignore:
    # LEFT VULNERABLE, each on availability. Added 14/10/2026; re-check every one
    # when its named trigger fires and delete the line, never on a calendar.
    #
    # katex — NO FIX THIS GRAPH CAN CONSUME. Fixed only in 0.18.2; the sole
    # consumer, micromark-extension-math@3.1.0 (newest, pinned by markdownlint
    # 0.41.1, newest), declares ^0.16.0 and 0.16.47 is the last 0.16. An override
    # would cross the 0.x caret boundary. Exploitation needs pre-existing prototype
    # pollution AND a render call; markdownlint loads katex through the package
    # index but uses only the `math` syntax extension, so `renderToString` is never
    # called. Dev-only (root markdown lint). Re-check when micromark-extension-math
    # widens its katex range.
    - GHSA-238p-pmpm-9mq7
    # @faker-js/faker — NO FIX IN THE CONSUMER'S MAJOR, AND NO RESOLUTION REACHES
    # THE CODE. Fixed only in >=10.5.0; 9.9.0 is the newest 9.x and
    # @usebruno/requests declares ^9.7.0. The faker that runs is inlined into the
    # @usebruno/requests and @usebruno/common dist bundles, so an override would
    # move only an unloaded copy. Dev-only (Bruno API test runner). Re-check when
    # Bruno moves to faker ^10.
    - GHSA-qxc2-j82w-r537
    # csv-parse — NO FIX IN THE CONSUMER'S MAJOR. Fixed only in >=7.0.2; 5.6.0 is
    # the newest 5.x, every 6.x is affected, and @usebruno/cli declares ^5.5.6, so
    # an override would cross two majors. Reached only by `bru run --csv-file-path`,
    # which tests/api.sh never passes on its own. Dev-only. Re-check when @usebruno/cli moves
    # to csv-parse ^7.
    - GHSA-8cw4-87c7-c6xx
    #
    # Added 02/11/2026, on the same terms.
    #
    # minimatch — NO FIX THIS GRAPH CAN CONSUME. Fixed only in >=11.0.1 (11.0.0 first
    # shipped 27/10/2026); the advisory range is a blanket <11.0.1, and every locked line
    # is already the newest of its major: 3.1.5 (legacy-v3), 8.0.7 (legacy-v8), 10.2.6
    # (newest 10; 10.2.5 also locked). 11 is a breaking rewrite, not a floor: it drops
    # makeRe, AST and MMRegExp, and `set` now holds Matcher objects where glob 9/13's
    # processor tests `instanceof RegExp` — glob itself took 11 only in its own 14.0.0
    # major. Every consumer declares ^3 / ^8 / ^10 and none has a release on ^11 bar glob
    # 14, so an override would cross a major for each one.
    # What is actually exposed: the amplification is in firstPhasePreProcess(), run only
    # at optimizationLevel >= 2. 3.1.5 does not contain that code at all. eslint 9/10,
    # @eslint/config-array, @eslint/eslintrc, eslint-plugin-import/react,
    # @typescript-eslint/typescript-estree, @expo/fingerprint and test-exclude use the
    # default level 1 and never reach it. glob 9.3.5 (test-exclude 6) and glob 13.0.6
    # (expo CLI/config/metro-config, jest 30) pass optimizationLevel: 2, so the path runs
    # on MOBILE dev/build tooling only — over glob patterns from repo config, never from a
    # request. Absent from every deployed artefact; a web-only project reaches it only
    # through root eslint 10, at level 1, where the vulnerable function never runs.
    # Re-check when glob ships a 13.x or 9.x on minimatch ^11, when expo/jest-expo move
    # to glob ^14, or when minimatch backports the fix to 10.x / 8.x.
    - GHSA-g3hv-75wg-m249
    # glob — NO FIX IN THE CONSUMERS' MAJOR. Affects 9.0.0-14.0.1, fixed only in
    # >=14.0.2. 13.0.6 is the newest 13.x and every @expo/* consumer declares ^13.0.0,
    # at the locked release and at latest alike (cli, config, config-plugins and
    # metro-config 58.x; fingerprint 0.21), as do jest-config, jest-runtime
    # and @jest/reporters 30 since 09/11/2026, so an override would cross a major.
    # The flaw: traversal continues after an AbortSignal fires. Only @expo/cli's
    # anyMatchAsync passes a signal (it aborts after the first match, in the
    # TypeScript doctor check), so the cost is wasted local fs traversal over
    # repo-defined patterns. The same line covers the jest 30 copies at 13.0.6 and
    # test-exclude 6's at 9.3.5 (the `glob@<9` selector below): neither passes a
    # signal, and no 9.x fix exists.
    # Build-time / dev-only, absent from every deployed artefact. Re-check when
    # @expo/* declares glob ^14, or a 13.x/9.x backport ships.
    - GHSA-3g3m-2fjr-6pw4
    # deepmerge — NO PATCHED RELEASE EXISTS. Affects 4.2.0-4.3.1, and 4.3.1 is
    # latest (unchanged since 03/2023). Sole consumer since 09/11/2026: jest-config@30
    # (^4.3.1); the @expo/config path left with SDK 58. It merges only repo-authored
    # jest config, never a request body, so an attacker-shaped source object needs write
    # access to the repo. Dev-only (jest), absent from every deployed artefact and from
    # a web-only project. Delete when deepmerge >4.3.1 ships or a jest without it is in.
    - GHSA-gcqx-w48m-w2h4
# Each entry names a version this lockfile actually resolves to. One that matches
# nothing exempts nothing, so it is deleted with the bump that stranded it
# (02/11/2026: nine such, from the 14/10/2026 floors).
minimumReleaseAgeExclude:
  - form-data@4.0.6
  - ws@8.21.0
overrides:
  # Advisory floors, each BOUNDED BY ITS MAJOR — `>=<patched> <<next major>`. Two
  # selectors below are deliberate exceptions, each annotated: `uuid@<11.1.1` and
  # `glob@<9` have no lower bound, so they catch EVERY older major, not only the
  # consumers their comments name.
  #
  # Re-floored 13/08/2026 against `audits/security.sh --js-only`: every one was
  # below its patched version, which is why 36 advisories (19 high, 17 moderate)
  # stood open. The gate had never reported them — see the false green fixed in
  # .claude/hooks/lib/check-security.sh.
  #
  # The upper bound is not decoration. An override is a FORCED resolution, so a
  # bare `>=` floor resolves to whatever is newest and drags every consumer
  # across any major boundary in between — silently, because the advisory is
  # cleared either way. Measured the same day: a bare floor would have taken
  # nanoid 3 → 6 (ESM-only, breaks every CJS require), js-yaml 4 → 5,
  # undici 7 → 8, linkify-it 5 → 6 and fast-uri 3 → 4. Fixing a moderate
  # advisory by breaking the build is not a fix. Bound every one.
  #
  # Re-floored again 14/10/2026: 78 advisories open (3 critical, 43 high) against
  # a pnpm-lock.yaml untouched since 02/09. Floors raised in place below; qs and shell-quote
  # bounded for the first time — shell-quote's old floor, 1.8.4, was the very version
  # that introduced its critical (GHSA-pqg4-j6r4-53mv).
  axios: ">=1.20.0 <2"
  # GHSA-c83g-rgw3-j3cx and the normalizeStats prototype-write advisory, both high,
  # both naming ">=4.28.7". Reached dev-time only, through @usebruno/cli >
  # @usebruno/converters > jscodeshift > @babel/* — the Bruno API test runner, absent
  # from every deployed artefact. An override rather than an ignore because a patched
  # release exists and this graph can consume it: 4.28.8 is the newest 4.x and the
  # `<5` bound keeps it there, per the forced-resolution rule this block opens with.
  browserslist: ">=4.28.7 <5"
  fast-uri: ">=3.1.9 <4"
  # js-yaml is split per major, because the blanket ">=4.3.1 <5" it replaces forced
  # two consumers across a major: markdownlint-cli2 DOWN to 4, and
  # @istanbuljs/load-nyc-config (^3.13.1) UP to 4. markdownlint-cli2 0.24.0 pins the
  # patched 5.4.3 itself (GHSA-r3ph-w7gj-g6xm), so its 5.x selector was pruned
  # 09/11/2026; a selector that matches nothing is a rule nobody can see fire.
  #
  # load-nyc-config KEEPS its 3 → 4 crossing, deliberately and scoped to that one
  # parent. js-yaml 3 pulls argparse@1 → sprintf-js@1.0.3, whose advisory
  # (GHSA-hp3w-g68c-fv3c) has no fix, so the doctrine-clean 3.x selector would add an
  # unfixable advisory to fix nothing. The crossing is safe: load-nyc-config 1.1.0
  # calls only `.load`, and only on a .nycrc.yml / .nycrc.yaml, of which the repo
  # has none.
  "@istanbuljs/load-nyc-config>js-yaml": ^4.3.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  undici: ">=7.30.1 <8"
  ip-address: ">=10.7.1 <11"
  linkify-it: ">=5.0.2 <6"
  nanoid: ">=3.3.18 <4"
  # markdown-it and smol-toml selectors pruned 09/11/2026: markdownlint-cli2 0.24.0, their
  # only consumer, pins the patched markdown-it 15.0.3 (GHSA-gfr2-rv44-r23c,
  # GHSA-vfgh-jcmw-g37q) and smol-toml 1.9.1 (GHSA-r4xh-jqrq-34v2) itself.
  #
  # re2js — GHSA-gg6h-894w-4m9c (high, quadratic lookbehind matching), affects
  # >=2.2.0 <2.8.7. markdownlint 0.42.0 pins 2.8.6 exactly, and markdownlint-cli2 0.24.0
  # pins that markdownlint exactly, so no in-range bump clears it; markdownlint 0.42.1
  # moves to re2js 2.9.1 upstream, which is what this resolves to. Dev-time only: the
  # Markdown linter, absent from every deployed artefact. Retire once a markdownlint-cli2
  # release pins markdownlint >=0.42.1.
  re2js@>=2.2.0 <2.8.7: ^2.8.7
  postcss@<8.5.10: ^8.5.10
  esbuild@<0.28.1: ^0.28.1
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  "@babel/core@<=7.29.0": ^7.29.1
  # ── Bounded 14/10/2026: the six bare floors below arrived unannotated in fc905eb
  # (01/08/2026); four of them — uuid, glob, ws and the protobufjs parent lines — were
  # forcing consumers across majors they never declared. ──
  #
  # lodash — GHSA-r5fr-rjxr-66jc and GHSA-f23m-r3pf-42rh, fixed 4.18.0. Floored at
  # 4.18.1 because npm deprecates 4.18.0 as a bad release.
  lodash: ">=4.18.1 <5"
  # uuid — GHSA-w5hq-g745-h8pq affects every version below 11.1.1, plus 12.0.0 and
  # 13.0.0. xcode (^7.0.3, the expo iOS prebuild) and @usebruno/js (^10.0.0) have no
  # fix in their own majors, so they cross to 11 DELIBERATELY: 11.1.1 is the newest
  # line that still ships a CommonJS `require` build. The old ">=11.0.0" floor sent
  # them to 14, ESM-only, which xcode's `require('uuid')` reached only through Node
  # 24's require(esm) — and broke outright on any Node that cannot do that.
  uuid@<11.1.1: ^11.1.1
  uuid@>=12.0.0 <12.0.1: ^12.0.1
  uuid@>=13.0.0 <13.0.1: ^13.0.1
  # glob — GHSA-5j98-mcp5-4vw2 affects 10.2-10.4 and 11.0.x only; 7 and 9 never had
  # it. The old ">=11.0.0" floor existed to evict inflight@1.0.6 (glob 7's unbounded
  # memory leak), not to fix an advisory, and it dragged jest-config and jest-runtime
  # (^7.1.3) to 13, where jest-runtime's `_glob().default.sync` is undefined — the
  # error is swallowed, so it failed quietly rather than loudly.
  #
  # Pre-9 consumers cross to 9 DELIBERATELY instead. glob 9 is the newest line whose
  # CommonJS wrapper (module.exports = Object.assign(globFn, { default: globFn, glob:
  # globFn })) carries `.default.sync`, and it drops inflight. Until 09/11/2026 the
  # main consumers were @jest/reporters@29.7.0 and jest-runtime, with jest-expo 57
  # pinning the Jest 29 line; Jest 30 (jest-expo 58) moved both to glob ^13.
  # Re-measured 09/11/2026 with the selector removed: the one pre-9 consumer left is
  # test-exclude@6.0.0 (^7.1.4), reached through @react-native/jest-preset@0.88.1 >
  # babel-jest@29 > babel-plugin-istanbul 6, and it resolved to glob 7.2.3 with
  # inflight@1.0.6 back in the graph. So the selector still earns its place, for that
  # one consumer. test-exclude 6 loads on glob 9 — it promisifies glob's default export, which is
  # a function there — but its async `glob()` would never settle, because glob 9 returns a
  # promise and ignores the callback. That is safe only because babel-plugin-istanbul 6
  # calls nothing but `shouldInstrument`, which uses minimatch, never glob; re-check if a
  # test-exclude consumer ever calls `glob()`. glob 9 is npm-deprecated ("old versions"),
  # unlike lodash 4.18.0's "bad release": kept for the interop shape, which no newer line has.
  #
  # Since 30/10/2026 glob 9.3.5 is itself inside GHSA-3g3m-2fjr-6pw4 (9.0.0-14.0.1, no
  # 9.x fix), while the ^7 its consumer declares is not. Kept anyway (02/11/2026, again
  # 09/11/2026): the flaw needs an AbortSignal and test-exclude passes none, and the audit.ignore line
  # it shares with expo's glob 13 is needed either way. Deleting this selector would
  # clear the 9.3.5 finding but bring back inflight@1.0.6, the leak it exists to evict.
  # Revisit if that ignore is ever deleted.
  glob@<9: ^9.3.5
  glob@>=10.0.0 <10.5.0: ^10.5.0
  glob@>=11.0.0 <11.1.0: ^11.1.0
  # ws — GHSA-96hv-2xvq-fx4p, fixed 7.5.11 and 8.21.0. The old ">=8.21.0" floor sent
  # react-native, metro, @react-native/dev-middleware and react-devtools-core (^7) to
  # 8, when their own line carries the fix.
  ws@>=7.0.0 <7.5.11: ^7.5.11
  ws@>=8.0.0 <8.21.0: ^8.21.0
  # brace-expansion is split per major, one fix per line (1.1.21, 2.1.7, 5.0.12 all
  # shipped 14/09/2026). The blanket ">=5.0.9 <6" it replaces forced minimatch 3
  # (^1.1.7) and minimatch 8 (^2.0.1) onto v5 — and v5's CommonJS build exports
  # `{ expand }`, not a function, so minimatch 3's `require('brace-expansion')(p)`
  # threw on any brace glob. Measured 14/10/2026 against the installed 5.0.9.
  brace-expansion@<2: ^1.1.21
  brace-expansion@>=2.0.0 <3: ^2.1.7
  brace-expansion@>=5.0.0 <6: ^5.0.12
  qs: ">=6.16.1 <7"
  shell-quote: ">=1.11.0 <2"
  # protobufjs keeps its two-major split rather than taking a single floor: the
  # 7.x and 8.x lines have separate advisories and separate consumers, and a
  # blanket ">=8.6.6" would drag a 7.x consumer across a major boundary to fix a
  # vulnerability that its own line already patches.
  #
  # Until 14/10/2026 two parent-scoped lines did exactly that: they sent
  # @grpc/proto-loader (^7.2.5 / ^7.5.5) to 8.x, and parent scope beats a version
  # selector, so the crossing also hid that the 7.x floor was too low — GHSA-j3f2-
  # 48v5-ccww affects 7.5.0-7.6.4, fixed 7.6.5. Both deleted; each line now carries
  # its own fix, bounded by its major.
  protobufjs@>=7.0.0 <7.6.5: ^7.6.5
  protobufjs@>=8.0.0 <8.6.6: ^8.6.6
  # yaml — GHSA-48c2-rrv3-qjmp (moderate, stack overflow on deeply nested collections),
  # affects >=2.0.0 <2.8.3. Added 09/11/2026 with @usebruno/cli 4.0 -> 4.3: its
  # @usebruno/js went from `yaml ^2.3.4` (0.50.0, which resolved here to 2.9.0) to an
  # EXACT `2.3.4` pin (0.55.0), so the bump reintroduced the advisory. Dev-time only, the
  # Bruno API runner. Bounded by the 2.x major; 2.9.0 is the line Bruno already ran on.
  yaml@>=2.0.0 <2.8.3: ^2.8.3
allowedDeprecatedVersions:
  whatwg-encoding: "*"
  node-domexception: "*"
# Patched dependencies — a LAST RESORT, and none is carried today. The last, for
# decode-uri-component@0.2.2, was deleted 09/11/2026 with the two audit.ignore lines it
# answered, because expo-router 58 dropped the only consumer (query-string@7).
#
# The bar, if one is ever needed again: an advisory whose fix exists but which THIS
# graph cannot consume (a consumable fix takes an override, never a patch). Key it to
# an EXACT version, so it stops matching the day the package moves and `pnpm audit`
# goes loud again. Set `allowUnusedPatches: true` alongside it: this file is
# byte-identical on both template render paths, a web-only project may not have the
# patched package at all, and pnpm 11 throws on a patch it could not apply.
# Pair it with an audit.ignore line under its own PATCHED IN PLACE heading, since
# `pnpm audit` keys on the resolved version and cannot see a patch.
# Source: https://pnpm.io/cli/patch
