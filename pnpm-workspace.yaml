# The web surface is server-rendered by Django and has no client build: the root
# package.json carries repo tooling only (markdownlint, prettier, eslint, lefthook,
# bruno). The glob below exists for the OPTIONAL React Native mobile surface at
# code/src/mobile/, which is a real workspace member with its own package.json.
#
# Why a glob and not a named entry: pnpm treats a matched directory as a package only
# when it contains a package.json, so this resolves to the mobile app when the project
# opted in and to NOTHING when it did not. That keeps this file byte-identical on both
# template render paths, which is what lets the opt-in stay gated entirely by one
# templated `_exclude` entry in copier.yml — one conditionalisation mechanism, with no
# file anywhere carrying templated contents.
#
# Trade-off accepted: the glob is implicit. Any future directory under code/src/ that
# carries a package.json joins this workspace without anyone declaring it.
packages:
  - "code/src/*"
allowBuilds:
  esbuild: false
  lefthook: false
  msw: false
  protobufjs: false
  sharp: false
  # Native resolver pulled in by the mobile surface's eslint plugins. Left unbuilt like
  # every other entry here — it ships prebuilt binaries, and mobile lint passes without
  # running its install script.
  unrs-resolver: false
# Ignored advisories, and they are read from THIS FILE — `pnpm audit` has no
# CLI flag for them, and passing `--ignore <GHSA>` makes pnpm print "No new
# vulnerabilities were ignored" and exit 0 without auditing anything at all
# (that false green is fixed in .claude/hooks/lib/check-security.sh).
#
# The key is `audit.ignore`, renamed from `auditConfig.ignoreGhsas` on
# 14/08/2026 once the pin reached 11.21.0. The attempt on 13/08/2026 failed
# because the `audit:` section landed across the 11.15–11.19 releases and the
# pin was 11.15.1, at the very bottom of that window: the ignores stopped
# applying silently, the `(N ignored)` line vanishing with no warning and no
# error. Both spellings still work and the new section WINS when both are
# present, so never carry both — a leftover `auditConfig:` block would sit
# there looking authoritative while deciding nothing.
#
# Verified the way the old comment demanded, by the report line rather than the
# exit code — `bash code/src/scripts/audits/security.sh --js-only`. The rename
# was proven three ways on 14/08/2026, when four entries still resolved:
#   auditConfig.ignoreGhsas  →  4 high (4 ignored)   clean
#   audit.ignore             →  4 high (4 ignored)   clean
#   neither key              →  4 high              VULNERABLE
# The third run is the one that makes the other two mean anything: it is what
# proves the entries below are load-bearing rather than decorative. Re-proven
# 15/08/2026 by the same method after the deletion described next:
#   audit.ignore             →  2 high (2 ignored)   clean
#   neither key              →  2 high              VULNERABLE
# Re-proven 14/10/2026 after the sweep below added five and deleted three:
#   audit.ignore  →  1 low (1 ignored) | 2 moderate (2 ignored) | 3 high (3 ignored)   clean
#   neither key   →  1 low | 2 moderate | 3 high                                     VULNERABLE
# Every entry now resolves, so the `(N ignored)` total equals the list length.
#
# Two @grpc/grpc-js entries — GHSA-5375-pq7m-f5r2 and GHSA-99f4-grh7-6pcq —
# were DELETED on 15/08/2026 rather than documented, because a patched release
# existed the whole time they sat here. They arrived unannotated in fc905eb and
# were carried unexplained for two weeks. @usebruno/requests (0.19.0, locked then
# and now) declares ^1.13.3, so the fixed 1.14.4 already satisfied the range: the
# lockfile was merely stale, and `pnpm update @grpc/grpc-js` cleared both with no
# override needed. The rule the deletion sets: an ignore whose advisory HAS a
# published fix is a suppression, not a decision. Ignore on availability, never
# on inertia.
#
# Three more were DELETED on 14/10/2026 under that rule:
# - GHSA-jxxr-4gwj-5jf2 (brace-expansion >=5.0.0 <5.0.6). It had matched nothing
#   since the brace-expansion floor passed 5.0.6, and was kept on "an ignore that
#   matches nothing costs nothing". It costs the rule: its fix was published, so
#   it was a suppression waiting for a consumer to re-arm it.
# - The image-size pair, GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq. Their re-check
#   trigger fired (2.0.3 shipped 14/09/2026) but 2.x would cross metro 0.84.4's
#   ^1.0.2, so the fix taken is removal instead: metro 0.84.5 dropped image-size,
#   and @expo/metro 56.0.2 is the first release whose exact metro-* pins all land
#   on 0.84.5. Both sit inside ranges already declared (expo: @expo/metro ~56.0.0;
#   react-native and @react-native/*: ^0.84.3), and the selectors under
#   `overrides:` take them.
#
# Read the entries as two kinds, because they are not the same decision. Every
# entry under the LEFT VULNERABLE heading is exactly that, and says so. The
# decode-uri-component entry is not: the code is fixed, and the line exists only
# because `pnpm audit` cannot see a patch. Never collapse the two under one heading.
# Source: https://pnpm.io/cli/audit
audit:
  ignore:
    # LEFT VULNERABLE, each on availability. Added 14/10/2026; re-check every one
    # when its named trigger fires and delete the line, never on a calendar.
    #
    # node-forge — NO PATCHED RELEASE EXISTS. 1.4.0 is both latest and
    # last_affected; the fix (digitalbazaar/forge PR #1152) is unreleased. Reached
    # only through @expo/cli and @expo/code-signing-certificates: the Node-side
    # Expo CLI, absent from every deployed artefact and from a web-only project.
    # Delete when a release above 1.4.0 ships.
    - GHSA-86w9-cpqp-85rv
    # braces — NO PATCHED RELEASE EXISTS. 3.0.3 is both latest and last_affected,
    # and its sole consumer, micromatch@4.0.8, is itself the newest micromatch.
    # Build-time on mobile (the metro / @expo/metro-file-map crawl) and dev-only
    # everywhere else (markdownlint-cli2, jest); the glob patterns come from repo
    # config, never from a request. Delete when braces >3.0.3 or a micromatch that
    # drops it ships.
    - GHSA-vfj7-8cjw-p6xm
    # katex — NO FIX THIS GRAPH CAN CONSUME. Fixed only in 0.18.2; the sole
    # consumer, micromark-extension-math@3.1.0 (newest, pinned by markdownlint
    # 0.41.1, newest), declares ^0.16.0 and 0.16.47 is the last 0.16. An override
    # would cross the 0.x caret boundary. Exploitation needs pre-existing prototype
    # pollution AND a render call; markdownlint loads katex through the package
    # index but uses only the `math` syntax extension, so `renderToString` is never
    # called. Dev-only (root markdown lint). Re-check when micromark-extension-math
    # widens its katex range.
    - GHSA-238p-pmpm-9mq7
    # @faker-js/faker — NO FIX IN THE CONSUMER'S MAJOR, AND NO RESOLUTION REACHES
    # THE CODE. Fixed only in >=10.5.0; 9.9.0 is the newest 9.x and
    # @usebruno/requests declares ^9.7.0. The faker that runs is inlined into the
    # @usebruno/requests and @usebruno/common dist bundles, so an override would
    # move only an unloaded copy. Dev-only (Bruno API test runner). Re-check when
    # Bruno moves to faker ^10.
    - GHSA-qxc2-j82w-r537
    # csv-parse — NO FIX IN THE CONSUMER'S MAJOR. Fixed only in >=7.0.2; 5.6.0 is
    # the newest 5.x, every 6.x is affected, and @usebruno/cli declares ^5.5.6, so
    # an override would cross two majors. Reached only by `bru run --csv-file-path`,
    # which tests/api.sh never passes on its own. Dev-only. Re-check when @usebruno/cli moves
    # to csv-parse ^7.
    - GHSA-8cw4-87c7-c6xx
    #
    # PATCHED IN PLACE
    #
    # decode-uri-component — PATCHED IN PLACE, NOT SUPPRESSED. The one entry here
    # that does not mean "left vulnerable": patches/decode-uri-component@0.2.2.patch
    # carries 0.5.0's fix and pnpm applies it on every install. `pnpm audit` keys on
    # the version the lockfile resolved and a patch does not move it, so the advisory
    # is reported against code that no longer contains the flaw. Deleting the patch
    # without deleting this line is the failure mode to guard against — they are one
    # change, in both directions.
    #
    # Why a patch and not an override. The fix ships in 0.5.0 ONLY, and 0.5.0 is
    # ESM-only. The sole consumer — query-string@7.1.3, reached through expo-router —
    # is CommonJS. Measured 01/09/2026 on Node 24: `require('decode-uri-component')`
    # against 0.5.0 returns `{__esModule, default}`, and calling it throws
    # `TypeError: d is not a function`. 0.2.2 is the newest CommonJS release and every
    # CommonJS release is vulnerable, so there is no version to float to. Same INTEROP
    # SHAPE constraint the @jest/reporters>glob override below documents — but with no
    # compatible version in existence, which is what makes this the one case a patch
    # earns.
    #
    # What it cost unpatched, measured the same day: `'%A0'.repeat(800)`, a 2.4 KB
    # deep-link query, held the JS thread for 12.8 s — growth ~4.3x per doubling of
    # input, from the recursive bisection in the fallback decoder. Patched: 0.15 ms,
    # and 300 KB of the same input in 23 ms. expo-router parses deep-link URLs on
    # device, so this sat in the MOBILE DELIVERY PATH, not in dev-time tooling like
    # the entries above.
    - GHSA-vcc3-ghjq-m6fr
minimumReleaseAgeExclude:
  - js-yaml@4.1.2
  - markdown-it@14.1.2
  - axios@1.15.0
  - postcss@8.5.10
  - axios@1.15.1
  - axios@1.15.2
  - fast-uri@3.1.2
  - esbuild@0.28.1
  - form-data@4.0.6
  - "@babel/core@7.29.1"
  - ws@8.21.0
  - protobufjs@7.6.3
  - protobufjs@8.5.1
overrides:
  # Advisory floors, each BOUNDED BY ITS MAJOR — `>=<patched> <<next major>`.
  #
  # Re-floored 13/08/2026 against `audits/security.sh --js-only`: every one was
  # below its patched version, which is why 36 advisories (19 high, 17 moderate)
  # stood open. The gate had never reported them — see the false green fixed in
  # .claude/hooks/lib/check-security.sh.
  #
  # The upper bound is not decoration. An override is a FORCED resolution, so a
  # bare `>=` floor resolves to whatever is newest and drags every consumer
  # across any major boundary in between — silently, because the advisory is
  # cleared either way. Measured the same day: a bare floor would have taken
  # nanoid 3 → 6 (ESM-only, breaks every CJS require), js-yaml 4 → 5,
  # undici 7 → 8, linkify-it 5 → 6 and fast-uri 3 → 4. Fixing a moderate
  # advisory by breaking the build is not a fix. Bound every one.
  #
  # Re-floored again 14/10/2026: 78 advisories open (3 critical, 43 high) against
  # a pnpm-lock.yaml untouched since 02/09. Floors raised in place below; qs and shell-quote
  # bounded for the first time — shell-quote's old floor, 1.8.4, was the very version
  # that introduced its critical (GHSA-pqg4-j6r4-53mv).
  axios: ">=1.20.0 <2"
  # GHSA-c83g-rgw3-j3cx and the normalizeStats prototype-write advisory, both high,
  # both naming ">=4.28.7". Reached dev-time only, through @usebruno/cli >
  # @usebruno/converters > jscodeshift > @babel/* — the Bruno API test runner, absent
  # from every deployed artefact. An override rather than an ignore because a patched
  # release exists and this graph can consume it: 4.28.8 is the newest 4.x and the
  # `<5` bound keeps it there, per the forced-resolution rule this block opens with.
  browserslist: ">=4.28.7 <5"
  fast-uri: ">=3.1.8 <4"
  # js-yaml is split per major, because the blanket ">=4.3.1 <5" it replaces forced
  # two consumers across a major: markdownlint-cli2 (pins 5.2.2) DOWN to 4, and
  # @istanbuljs/load-nyc-config (^3.13.1) UP to 4. The 5.x selector returns
  # markdownlint-cli2 to its own line, patched (GHSA-r3ph-w7gj-g6xm).
  #
  # load-nyc-config KEEPS its 3 → 4 crossing, deliberately and scoped to that one
  # parent. js-yaml 3 pulls argparse@1 → sprintf-js@1.0.3, whose advisory
  # (GHSA-hp3w-g68c-fv3c) has no fix, so the doctrine-clean 3.x selector would add an
  # unfixable advisory to fix nothing. The crossing is safe: load-nyc-config 1.1.0
  # calls only `.load`, and only on a .nycrc.yml / .nycrc.yaml, of which the repo
  # has none.
  "@istanbuljs/load-nyc-config>js-yaml": ^4.3.2
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  js-yaml@>=5.0.0 <5.4.1: ^5.4.1
  undici: ">=7.29.1 <8"
  ip-address: ">=10.7.1 <11"
  linkify-it: ">=5.0.2 <6"
  nanoid: ">=3.3.18 <4"
  # The old `>=13.0.0 <14.1.2` selector matched markdownlint-cli2 0.22.x's exact
  # 14.1.1 pin, then stopped matching once 0.23 pinned 14.3.0 — pnpm applies a
  # selector only where it intersects the declared spec. The lower bound now starts
  # at 14 so a future ^13 consumer is never forced across a major.
  markdown-it@>=14.0.0 <14.3.1: ^14.3.1
  # markdownlint-cli2 pins smol-toml exactly, and its newest release (0.23.3) pins
  # 1.8.0, still inside GHSA-r4xh-jqrq-34v2 — so no upstream bump clears it.
  smol-toml: ">=1.9.0 <2"
  postcss@<8.5.10: ^8.5.10
  esbuild@<0.28.1: ^0.28.1
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  "@babel/core@<=7.29.0": ^7.29.1
  lodash: ">=4.18.0"
  uuid: ">=11.0.0"
  glob: ">=11.0.0"
  # istanbul's coverage instrumentation reaches Jest through test-exclude. Version 6
  # calls promisify() on glob's default export, which stopped being a function in glob
  # 11 — so the `glob: ">=11.0.0"` line above silently breaks mobile coverage collection.
  # v7 uses glob's named export and satisfies that floor, keeping the security posture.
  test-exclude: ">=7.0.1"
  # Same root cause, second consumer — but the real constraint is an INTEROP SHAPE, not a
  # version floor. @jest/reporters@29.7.0 does `_interopRequireDefault(require('glob'))` and
  # then calls glob.sync. glob 10 and 11 both set __esModule with no `default` export, so
  # `.default.sync` is undefined and the coverage reporter dies — upgrading is not an option,
  # and jest-expo pins the Jest 29 line so the reporter cannot be replaced either.
  # glob 9 is the NEWEST version that still works: it ships a CJS wrapper
  # (module.exports = Object.assign(globFn, { default: globFn, glob: globFn })) whose default
  # carries .sync. Preferred over glob 7 because its dependencies are minipass / minimatch 8 /
  # fs.realpath / path-scurry — it drops inflight@1.0.6, the unbounded-memory-leak package the
  # repo-wide floor above removes everywhere else. Scoped to that ONE dev-only, test-time
  # package; the floor is untouched and nothing in the delivery path is affected.
  "@jest/reporters>glob": "^9.3.5"
  ws: ">=8.21.0"
  # brace-expansion is split per major, one fix per line (1.1.21, 2.1.7, 5.0.12 all
  # shipped 14/09/2026). The blanket ">=5.0.9 <6" it replaces forced minimatch 3
  # (^1.1.7) and minimatch 8 (^2.0.1) onto v5 — and v5's CommonJS build exports
  # `{ expand }`, not a function, so minimatch 3's `require('brace-expansion')(p)`
  # threw on any brace glob. Measured 14/10/2026 against the installed 5.0.9.
  brace-expansion@<2: ^1.1.21
  brace-expansion@>=2.0.0 <3: ^2.1.7
  brace-expansion@>=5.0.0 <6: ^5.0.12
  qs: ">=6.16.0 <7"
  shell-quote: ">=1.11.0 <2"
  # In-range refreshes, written as selectors because each consumer's declared range
  # ALREADY admits the fix — the lockfile was merely stale, as with @grpc/grpc-js on
  # 15/08. A selector rather than a refresh because update.sh's `--package` runs
  # `pnpm update --latest`, which (measured 14/10/2026 on pnpm 11.25.0) never
  # re-resolves a transitive dependency and reports "already current". Each is
  # scoped to the vulnerable versions of its own line, so none can cross a major.
  #
  # Dev-only (Bruno API test runner): handlebars carries two criticals; the grpc-js
  # and moment copies that actually run are inlined by Bruno itself — grpc-js into
  # @usebruno/requests' dist, moment into @usebruno/js's QuickJS sandbox bundle — so
  # these two clear the audit and the node-vm sandbox path, nothing more.
  handlebars@>=4.0.0 <4.7.10: ^4.7.10
  "@grpc/grpc-js@>=1.13.0 <1.14.5": ^1.14.5
  moment@>=2.29.2 <2.31.0: ^2.31.0
  # Build-time (expo CLI, prebuild plist handling, dev server, @expo/metro-config's
  # postcss).
  "@xmldom/xmldom@>=0.8.0 <0.8.15": ^0.8.15
  "@xmldom/xmldom@>=0.9.0 <0.9.12": ^0.9.12
  compression@<1.8.2: ^1.8.2
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  # The metro family to 0.84.5+, inside ranges already declared (expo's @expo/metro
  # ~56.0.0; react-native and @react-native/*'s metro-* ^0.84.3). This is
  # what removes image-size (and its two ignores above): metro 0.84.4 depended on it,
  # 0.84.5 does not. @expo/metro 56.0.2 is the first that pins every metro-* at 0.84.5
  # — 56.0.1 still pins metro-transform-worker 0.84.4, which pins metro 0.84.4.
  # metro-runtime ships in the app bundle, so this one is verified by the mobile suite.
  #
  # One selector per metro-* package that something outside the family declares
  # directly (react-native, @react-native/*): without one, pnpm keeps the locked 0.84.4
  # for that edge and the family splits three ways. With them the graph lands where a
  # fresh resolve would — 0.84.5 under @expo/metro's exact pins, 0.84.6 elsewhere.
  "@expo/metro@>=56.0.0 <56.0.2": ~56.0.2
  metro@>=0.84.0 <0.84.5: ~0.84.5
  metro-config@>=0.84.0 <0.84.5: ~0.84.5
  metro-core@>=0.84.0 <0.84.5: ~0.84.5
  metro-runtime@>=0.84.0 <0.84.5: ~0.84.5
  metro-source-map@>=0.84.0 <0.84.5: ~0.84.5
  # protobufjs keeps its two-major split rather than taking a single floor: the
  # 7.x and 8.x lines have separate advisories and separate consumers, and a
  # blanket ">=8.6.6" would drag a 7.x consumer across a major boundary to fix a
  # vulnerability that its own line already patches.
  "@grpc/proto-loader>protobufjs": ">=8.6.6"
  "grpc-js-reflection-client>protobufjs": ">=8.6.6"
  protobufjs@>=8.0.0 <8.6.6: ">=8.6.6"
  protobufjs@>=7.0.0 <7.6.3: ^7.6.3
allowedDeprecatedVersions:
  whatwg-encoding: "*"
  node-domexception: "*"
# Patched dependencies — a LAST RESORT, and the bar is the one the entry above
# states: an advisory whose fix exists but which THIS graph cannot consume. An
# advisory with a consumable fix takes an override, never a patch.
#
# The key is an EXACT version on purpose. The day expo moves off 0.2.2 the patch
# stops matching, `allowUnusedPatches` keeps the install quiet, and `pnpm audit`
# goes loud again on whatever replaced it — which is the signal you want. A range
# or name-only key would silently re-apply a diff written against different code.
#
# `allowUnusedPatches` is load-bearing twice over. It is also what lets this file
# stay byte-identical on both template render paths: a WEB-ONLY project has no
# code/src/mobile/, so decode-uri-component is absent from its graph entirely and
# this patch applies to nothing. pnpm 11 removed `ignorePatchFailures` and now
# throws on a failed patch, so without this the install would break there.
# Source: https://pnpm.io/cli/patch
patchedDependencies:
  # GHSA-vcc3-ghjq-m6fr. Backports 0.5.0's single-pass O(n) decoder into 0.2.2's
  # CommonJS shape, keeping the `+` to space step 0.3.0 dropped. Output verified
  # identical to 0.5.0 over 20,000 randomised inputs plus a curated malformed
  # corpus, and identical to 0.2.2 on every well-formed input.
  decode-uri-component@0.2.2: patches/decode-uri-component@0.2.2.patch
allowUnusedPatches: true
