# copier.yml — the contract a new project is generated from.
#
#   uvx copier copy gh:Syntek-Dev/syntek-base my-project
#
# Full guide: how-to/src/TEMPLATE-GUIDE/. Token reference: how-to/src/TEMPLATE-TOKENS.md.

_min_copier_version: "9.0.0"

# Every file is a template — tokens are not confined to a suffixed subset.
_templates_suffix: ""

# Tokens are written <%TOKEN%> rather than {{TOKEN}} so they cannot collide with
# anything already in the tree: Django templates ({{ }} / {% %}), GitHub Actions
# expressions (${{ }}), Bruno variables ({{ }}) or bash test syntax ([[ ]]).
_envops:
  variable_start_string: "<%"
  variable_end_string: "%>"
  block_start_string: "<:"
  block_end_string: ":>"
  comment_start_string: "<~"
  comment_end_string: "~>"
  keep_trailing_newline: true

# Files that belong to syntek-base itself and must not land in your project.
# NOTE: these are gitignore patterns — an unanchored name matches at ANY depth, so
# the template-only files are anchored with a leading slash. Without it, `README.md`
# would also swallow .copier/README.md and `CONTRIBUTING.md` would swallow
# how-to/src/CONTRIBUTING.md, which the generated project needs.
_exclude:
  - /copier.yml
  - .git
  - /.github/CODEOWNERS
  - /.github/ISSUE_TEMPLATE
  - /.github/PULL_REQUEST_TEMPLATE.md
  - /.github/scripts # template-integrity checks — meaningless once rendered
  - /.github/workflows/audit-template.yml
  - /README.md # the project's README ships from .copier/README.md (see _tasks)
  # Root version state belongs to syntek-base, not to your project. A generated
  # project starts at 0.1.0 with an empty history, seeded from .copier/ by _tasks —
  # otherwise every new project would claim the template's version number and
  # inherit twenty entries of the template's own development as its changelog.
  #
  # Shipping via .copier/ also makes them seed-once: _tasks run on `copy` and never
  # on `update`, so `copier update` can never overwrite a project's release history
  # with the template's. That is the same mechanism README.md already relies on.
  - /VERSION
  - /VERSION-HISTORY.md
  - /CHANGELOG.md
  - /RELEASES.md
  # Project memory is an ACCUMULATOR, so the same argument reaches it: syntek-base's own
  # memory — how this repo's .gitignore overrides work, which account may bypass branch
  # protection, which internal epic found what — is meaningless and actively misleading
  # in a generated project, where Section 2.1 has every session read it second and believe it.
  #
  # Excluding it rather than shipping a stub is what keeps the file usable HERE. Section 2.1
  # hardcodes `.claude/MEMORY.md` as read-second and that line ships, so the file must
  # exist in both repos and can never be retired — which rules out the GAPS.md pattern
  # (a shipped stub plus a differently-named store this repo actually writes to).
  # Seed-once matters more here than anywhere: a project's accumulated memory must never
  # be handed back the template's blank canvas by `copier update`.
  - /.claude/MEMORY.md
  # Update migrations are read from the template clone, never rendered into a
  # project — a generated project has no use for the migrations that produced it.
  - /.copier/migrations
  - /LICENSE
  - /SECURITY.md
  - /CONTRIBUTING.md
  # how-to/src/TEMPLATE-GUIDE/ SHIPS, deliberately. Most of what it answers is asked long
  # after generation — what am I looking at (07), which skill does this (GUIDE-TO-SKILLS),
  # which PM folder (09), how do I pull upstream fixes (14), why did that break (15). The
  # pre-generation half stays because 14-UPDATING needs 06-GENERATION's vocabulary to be
  # readable at all. Consequence: those files are rendered like any other, so the guides
  # that quote token or delimiter syntax wrap it in `raw` blocks. See that folder's
  # CLAUDE.md before editing one.
  #
  # TEMPLATE-GAPS.md is the exception — syntek-base's own open items, meaningless in a
  # generated project. Same test as the root GAPS.md, which ships and therefore stays an
  # empty stub.
  - /how-to/src/TEMPLATE-GUIDE/TEMPLATE-GAPS.md
  # The nested .gitignore files that must NOT travel with the template. Git honours a
  # .gitignore in any directory, which is how syntek-base can ignore the artefacts it writes
  # while TESTING its own scaffolding — handoffs, feature maps, stories, sprints, ADRs, plans,
  # research notes, questionnaires, lessons — while a generated project tracks every one of
  # them, because there they are the work rather than a test of it. Each folder's CONTEXT.md
  # describes the generated project's behaviour and is therefore correct as shipped; these
  # files are the syntek-base-only override, and excluding them here is what keeps the
  # override repo-local. The root .gitignore stays shipped and updatable by `copier update`.
  #
  # project-management/src/.gitignore is an allowlist covering the whole tree, so it also
  # covers 01-FEATURE — which is why that folder no longer carries a .gitignore of its own.
  - /handoffs/.gitignore
  - /project-management/src/.gitignore
  - /research/.gitignore
  - /questionnaires/.gitignore
  - /learning/.gitignore
  # Optional mobile frontend, gated by INCLUDE_MOBILE. A templated _exclude entry is the
  # SINGLE conditionalisation mechanism — no file ever has templated contents. When the
  # answer is false these paths are never rendered at all, so a Jinja error inside a mobile
  # file cannot break a web-only generation. When it is true each entry renders to an empty
  # string, which Copier ignores.
  - "<: if not INCLUDE_MOBILE :>/code/src/mobile<: endif :>"
  - "<: if not INCLUDE_MOBILE :>/code/src/scripts/mobile<: endif :>"
  # The mobile-only sub-documents inside the cross-cutting guides go with the tree too, on
  # the same principle and by the same mechanism the rust surface already uses for
  # encryption/RUST-CRYPTO.md: a React Native technique set in a project with no React
  # Native is guidance an agent can still load and misapply. Each parent guide stays
  # ungated and its CONTEXT.md index still lists the row unconditionally, flagged
  # mobile-only — the index row is allowed to dangle, exactly as the RUST.md and DESKTOP.md
  # rows already do, because the alternative is templated file contents.
  - "<: if not INCLUDE_MOBILE :>/code/docs/accessibility/MOBILE.md<: endif :>"
  - "<: if not INCLUDE_MOBILE :>/code/docs/design-tokens/MOBILE.md<: endif :>"
  - "<: if not INCLUDE_MOBILE :>/code/docs/visual-design/MOBILE.md<: endif :>"
  # discoverability/APP-STORE.md is the same class of file and is gated identically, but it is
  # named for the ARTEFACT rather than for the surface, because that is what its family names by
  # (WEB-METADATA, STRUCTURED-DATA, ROOT-SURFACE, CONTENT-STRUCTURE). The three rows above sit
  # under parents whose distinguishing axis genuinely IS the surface; here the axis is "a store
  # listing", and mobile is incidental — only mobile projects happen to have one today. Naming it
  # MOBILE.md would also leave a future desktop store listing no home but a rename.
  - "<: if not INCLUDE_MOBILE :>/code/docs/discoverability/APP-STORE.md<: endif :>"
  # The same rule reaches a top-level guide, not only a sub-document: MOBILE-CODING-PRINCIPLES.md
  # is wholly about a surface that is absent here, so it goes with the tree exactly as RUST.md
  # and DESKTOP.md do. Its index rows are likewise allowed to dangle, flagged mobile-only.
  - "<: if not INCLUDE_MOBILE :>/code/docs/MOBILE-CODING-PRINCIPLES.md<: endif :>"
  # The surface members of the types-over-dictionaries family go the same way. Each is wholly
  # about one surface's spelling of the standard and routes to that surface's stack skill in its
  # frontmatter, so leaving one behind names a skill the project does not have —
  # `audits/routing-skills.sh` reports exactly that. The standard itself
  # (TYPES-OVER-DICTIONARIES.md), its exceptions and the Python and browser members are ungated:
  # every project has those surfaces.
  - "<: if not INCLUDE_MOBILE :>/code/docs/data-structures/TYPES-TYPESCRIPT.md<: endif :>"
  # First gated path under how-to/ — every entry above this point is code/ or .claude/. The rule
  # is the same one, not a new one: STORE-LISTING.md is a per-project ANSWER SHEET (the pattern of
  # INVARIANTS.md and PLATFORM-PROVIDERS.md) for a surface that may not exist, and an answer sheet
  # to a question the project cannot be asked is worse than absent — a human filling in how-to/
  # reasonably assumes every file there applies to them. Its two index rows dangle, flagged
  # mobile-only, exactly as the code/docs rows above do.
  - "<: if not INCLUDE_MOBILE :>/how-to/src/STORE-LISTING.md<: endif :>"
  # Governance goes with the tree: a mobile skill with no mobile app to work on is worse than
  # no skill at all — and more so than it was for the retired agent tier, because a skill
  # fires on DESCRIPTION MATCH rather than on being named, so an unusable one competes for
  # work it cannot do instead of sitting inert until called. The shipped INDEX still lists it
  # unconditionally, flagged mobile-only — that keeps .claude/skills/CONTEXT.md free of
  # templated contents, which is the rule this entry exists to protect.
  - "<: if not INCLUDE_MOBILE :>/.claude/skills/stack-react-native<: endif :>"
  # Optional Rust surface, gated by INCLUDE_RUST — the same one-mechanism rule as mobile
  # above. Rust is for PyO3 extensions, standalone binaries, CLI tools and services;
  # consuming a published wheel needs none of it, so this gates AUTHORING only.
  - "<: if not INCLUDE_RUST :>/code/src/rust<: endif :>"
  - "<: if not INCLUDE_RUST :>/code/src/scripts/rust<: endif :>"
  - "<: if not INCLUDE_RUST :>/code/docs/RUST.md<: endif :>"
  - "<: if not INCLUDE_RUST :>/code/docs/rust<: endif :>"
  - "<: if not INCLUDE_RUST :>/code/docs/encryption/RUST-CRYPTO.md<: endif :>"
  # The Rust member of the types-over-dictionaries family — same reasoning as the TypeScript one
  # above: it routes to `stack-rust`, which is excluded below.
  - "<: if not INCLUDE_RUST :>/code/docs/data-structures/TYPES-RUST.md<: endif :>"
  - "<: if not INCLUDE_RUST :>/code/workflows/12-rust-extension<: endif :>"
  - "<: if not INCLUDE_RUST :>/.github/workflows/syntax-rust.yml<: endif :>"
  # Governance goes with the tree, exactly as for mobile and for the same description-match
  # reason: a Rust skill with no Rust to work on is worse than no skill at all. The shipped
  # INDEX still lists it unconditionally, flagged rust-only.
  - "<: if not INCLUDE_RUST :>/.claude/skills/stack-rust<: endif :>"
  # Optional native desktop app (Slint), gated by INCLUDE_DESKTOP — which is itself only
  # asked when INCLUDE_RUST is true, because Slint is Rust. The crate is a member of the
  # existing workspace rather than a second one: `members = ["crates/*"]` is a glob, so it
  # adapts automatically and there is still ONE toolchain pin, deny.toml and clippy.toml.
  # Those two shared files carry Slint's licence exceptions and advisory notes
  # UNCONDITIONALLY — on a project without the desktop surface they match nothing, which
  # cargo-deny reports as an informational note rather than an error. That keeps the
  # no-templated-file-contents rule intact.
  - "<: if not INCLUDE_DESKTOP :>/code/src/rust/crates/desktop<: endif :>"
  - "<: if not INCLUDE_DESKTOP :>/code/src/scripts/desktop<: endif :>"
  - "<: if not INCLUDE_DESKTOP :>/code/docs/DESKTOP.md<: endif :>"
  - "<: if not INCLUDE_DESKTOP :>/code/docs/desktop<: endif :>"
  - "<: if not INCLUDE_DESKTOP :>/code/docs/visual-design/DESKTOP.md<: endif :>"
  - "<: if not INCLUDE_DESKTOP :>/code/workflows/13-desktop-app<: endif :>"
  - "<: if not INCLUDE_DESKTOP :>/.claude/skills/stack-slint<: endif :>"
  # The Slint style gate travels with the script it runs — see the audit-style-check.yml
  # header. A workflow shipped without its script is a permanently-red job on every
  # web-only project, which is the one thing a generated baseline must never carry.
  - "<: if not INCLUDE_DESKTOP :>/.github/workflows/audit-style-check.yml<: endif :>"
  # Binaries cannot be rendered when _templates_suffix is "". Both are generated
  # artefacts — a new project rebuilds them from the sources beside them.
  - "*.pdf"
  # Never part of a checkout
  - node_modules
  - .code-review-graph
  - .venv
  - __pycache__
  - "*.py[co]"
  - .DS_Store

# ── Identity ─────────────────────────────────────────────────────────────────

PROJECT_NAME:
  type: str
  help: Project / product display name, as a human would write it
  placeholder: Acme Portal

# The first question that is about the PRODUCT rather than its labels. Every agent reads
# this before it reads anything else, because CONTEXT.md opens with it — so a vague answer
# here is a vague answer echoed through every planning gate downstream.
PROJECT_DESCRIPTION:
  type: str
  help: >-
    In one or two sentences: what does this project do, who is it for, and what does it
    replace? This is the brief every agent reads first — write it as a brief, not a tagline.
  placeholder: >-
    A client portal where Acme's customers track orders, download invoices and raise support
    tickets, replacing an email-and-spreadsheet process.
  validator: >-
    <: if PROJECT_DESCRIPTION | trim | length < 40 :>
    Write at least a full sentence — a tagline is not a brief, and this is what every agent
    reads before it reads anything else.
    <: endif :>
    <: if '"' in PROJECT_DESCRIPTION :>
    Avoid double quotes — this value is written into pyproject.toml and package.json.
    <: endif :>

PROJECT_SLUG:
  type: str
  help: Machine slug — Python package, databases, Compose project, hostnames
  default: "<% PROJECT_NAME | lower | replace(' ', '-') %>"
  validator: >-
    <: if PROJECT_SLUG != PROJECT_SLUG | lower or ' ' in PROJECT_SLUG or '_' in PROJECT_SLUG :>
    Use kebab-case: lowercase letters, digits and hyphens only.
    <: endif :>

ORG_NAME:
  type: str
  help: Organisation / maintainer name, used in doc headers and the licence
  placeholder: Acme Ltd

ORG_SLUG:
  type: str
  help: Organisation machine slug — plugin names, server namespace, cache prefix
  default: "<% ORG_NAME | lower | replace(' ', '-') %>"
  validator: >-
    <: if ORG_SLUG != ORG_SLUG | lower or ' ' in ORG_SLUG or '_' in ORG_SLUG :>
    Use kebab-case: lowercase letters, digits and hyphens only.
    <: endif :>

# ── Infrastructure ───────────────────────────────────────────────────────────

PRIMARY_DOMAIN:
  type: str
  help: The project's apex domain, with no scheme
  default: "<% PROJECT_SLUG %>.com"
  validator: >-
    <: if '.' not in PRIMARY_DOMAIN or '/' in PRIMARY_DOMAIN :>
    Give a bare apex domain, e.g. acme.com — no https:// and no path.
    <: endif :>

DEPLOY_REPO:
  type: str
  help: The forked NixOS deploy repo that provisions this project's host
  default: "<% PROJECT_SLUG %>-nixos-client-deployment"

SERVER_TIER:
  type: str
  help: Provisioned host tier and its spec — set it later if the host is not chosen yet
  default: TBD — set on provisioning

ENV_PREFIX:
  type: str
  help: Uppercase env-var and server-namespace prefix
  default: "<% ORG_SLUG | upper | replace('-', '_') %>"
  validator: >-
    <: if ENV_PREFIX != ENV_PREFIX | upper or '-' in ENV_PREFIX :>
    Use UPPER_SNAKE: capitals, digits and underscores only.
    <: endif :>

# ── Platform providers ───────────────────────────────────────────────────────
#
# Each of these records a CHOICE, not a dependency. The guides name the interface
# and treat the product as one implementation behind it, so a project that answers
# differently is still on-doctrine:
#
#   object store   → the S3 API, consumed via boto3
#   error tracking → the Sentry SDK wire protocol
#   metrics        → the Prometheus exposition format / OpenMetrics
#   logs           → structured JSON on stdout, collected by whatever ships it
#   traces         → OTLP (OpenTelemetry)
#   product events → this project's own ingestion API and event schema
#
# Free text rather than `choices:` on purpose — the list of viable products is longer
# than any list shipped here, and boxing a project into ours would defeat the point.
#
# PROSE-SAFE vs CELL-ONLY. OBJECT_STORE and ERROR_TRACKING are rendered into running
# sentences, so their defaults are BARE PRODUCT NAMES and the qualifying detail lives in
# the help text above each one. OBSERVABILITY_STACK, HOSTING_PROVIDER and TRACING_BACKEND
# resolve to a phrase ("Prometheus + Grafana"), which reads correctly in a table cell and
# breaks mid-sentence — they are cell-only. The rule is exception 2 in
# code/docs/architecture/PROVIDER-NEUTRALITY.md; the classification is recorded in
# how-to/src/TEMPLATE-TOKENS.md. Do not put a parenthetical back into a prose-safe default.
#
# These answers render into how-to/src/PLATFORM-PROVIDERS.md — the generated project's
# register of every infrastructure dependency, its seam kind, and its proven alternates —
# and the two prose-safe ones also render into the code/docs guides for their capability.
# The rule behind those verdicts (protocol seam vs adapter seam vs substrate, and the
# evidence each demands) is code/docs/architecture/PROVIDER-NEUTRALITY.md.
# PostgreSQL is absent from this list on purpose: it is substrate, not a choice.

HOSTING_PROVIDER:
  type: str
  help: >-
    Where this runs. The reference deployment is a self-hosted NixOS host driven by
    the deploy repo above; managed platforms are equally valid answers.
  default: Self-hosted — NixOS on bare metal

OBJECT_STORE:
  type: str
  help: >-
    S3-compatible object store for private documents and attachments. Consumed via
    boto3, so any S3 API works — MinIO, Garage, Ceph RGW, AWS S3, Cloudflare R2, B2.
    Answer with a bare product name: this one is rendered into running prose.
  default: SeaweedFS

ERROR_TRACKING:
  type: str
  help: >-
    Error and exception tracking. Wired through the Sentry SDK, so any
    Sentry-wire-compatible backend works — GlitchTip, Sentry, Bugsink.
    Answer with a bare product name: this one is rendered into running prose.
  default: GlitchTip

LOG_AGGREGATOR:
  type: str
  help: >-
    Where structured logs are shipped and queried. The app writes JSON to stdout, so
    the collector is a deployment choice — Loki, Vector, Fluent Bit, Alloy, CloudWatch.
  default: Loki

OBSERVABILITY_STACK:
  type: str
  help: >-
    Metrics and dashboards. The app exposes the Prometheus exposition format, scrapeable
    by Prometheus, VictoriaMetrics, Alloy or a vendor agent; traces go over OTLP.
  default: Prometheus + Grafana

TRACING_BACKEND:
  type: str
  help: >-
    Where distributed traces are sent. The seam is OTLP (OpenTelemetry), so any collector
    that speaks it works — Grafana Tempo, Jaeger, SigNoz, Honeycomb, Uptrace. Nothing is
    instrumented at baseline, so leaving the default is the expected answer; the seam is
    settled early only because retrofitting it means touching every instrumented call site.
  default: None — deferred; OTLP endpoint unset

ANALYTICS_PROVIDER:
  type: str
  help: >-
    Product analytics. Unlike the others this has no wire standard, so the seam is this
    project's own event ingestion API — the provider is what sits behind it, or 'own store'.
  default: Plausible

# ── Process dependencies ─────────────────────────────────────────────────────
#
# A dependency the PEOPLE operating the project rely on, which no application code
# touches. Kept separate from the six above deliberately: under the substrate test in
# code/docs/architecture/PROVIDER-NEUTRALITY.md this is neither a protocol seam nor an
# adapter seam, because swapping it changes where a human types rather than what the
# code does. Calling it either would cheapen both terms.
#
# It renders into the "Process dependencies" section of how-to/src/PLATFORM-PROVIDERS.md.

INCIDENT_TRACKER:
  type: str
  help: >-
    Where the substance of an incident is held — log excerpts, identifiers, and any
    postmortem touching personal data. The interface is ACCESS CONTROL: the in-repo
    register at project-management/src/22-INCIDENTS/ is PII-free by rule and ships, so
    anything sensitive needs a home with permissions. ClickUp, Linear, Jira, a bespoke
    admin area — or leave the default, and keep that substance outside the repository.
  default: None — record in 22-INCIDENTS/ only

# ── Locale, licence and people ───────────────────────────────────────────────

LOCALE:
  type: str
  help: Default application locale (the docs stay in British English regardless)
  default: en_GB
  validator: >-
    <: if '_' not in LOCALE or LOCALE | length != 5 :>
    Use a POSIX locale, e.g. en_GB.
    <: endif :>

TIMEZONE:
  type: str
  help: Default application timezone, IANA name
  default: Europe/London
  validator: >-
    <: if '/' not in TIMEZONE :>
    Use an IANA timezone, e.g. Europe/London.
    <: endif :>

CURRENCY:
  type: str
  help: Default currency, ISO 4217
  default: GBP
  validator: >-
    <: if CURRENCY | length != 3 or CURRENCY != CURRENCY | upper :>
    Use a three-letter ISO 4217 code, e.g. GBP.
    <: endif :>

LICENCE:
  type: str
  help: >-
    Licence for YOUR project. syntek-base is MIT, which places no obligation on
    what you generate from it — proprietary is a perfectly valid answer.
  default: Proprietary — all rights reserved

DEVELOPER_NAME:
  type: str
  help: Lead developer — named in the Claude Code identity block and as commit co-author
  placeholder: Alex Doe

DEVELOPER_EMAIL:
  type: str
  help: Lead developer email
  validator: >-
    <: if '@' not in DEVELOPER_EMAIL or '.' not in DEVELOPER_EMAIL :>
    That does not look like an email address.
    <: endif :>

# ── Django apps ──────────────────────────────────────────────────────────────
# Only the app NAMES are configurable; the layout code/src/django/apps/<app>/ is
# fixed. apps.marketing, apps.seo and apps.design_tokens are house constants and
# are never tokenised. Keep a default for an app this project will not have —
# the doc rows mentioning it can be deleted after generation.

IDENTITY_APP:
  type: str
  help: App owning users, credentials, sessions and consent
  default: users

AUDIT_APP:
  type: str
  help: App owning the append-only audit / event log
  default: audit

CONTENT_APP:
  type: str
  help: App owning user-authored content
  default: content

NOTIFICATIONS_APP:
  type: str
  help: App owning notifications and their delivery
  default: notifications

LEGAL_APP:
  type: str
  help: App owning cookie consent and legal pages
  default: legal

# CORE_APP was retired on 15/08/2026. Unlike its five siblings above, which name apps a
# story has yet to create, `apps/core/` ALREADY SHIPS — as a literal directory, with
# `name = "apps.core"` in its apps.py, `apps.core` in INSTALLED_APPS, literal imports
# throughout, and a dozen guides naming it. The question could therefore never be
# honoured: answering anything but `core` produced a project whose docs disagreed with
# its own code. A token whose referent is hardcoded everywhere else is not a choice, it
# is a claim that a choice exists. See how-to/src/TEMPLATE-TOKENS.md.

# ── Planning cadence ─────────────────────────────────────────────────────────
# The sprint point ceiling that triggers the sprint-planning pass. Stories are
# planned one at a time through workflows 01–13; when the open sprint's accepted
# story points reach SPRINT_CAPACITY_SP, workflows 14 and 15 run for that sprint
# before the next story is planned. The grace value is the hard ceiling a sprint
# may reach to avoid splitting a story badly — never a routine target.
# Rules: project-management/docs/PLANNING-GUIDE.md (planning/CADENCE.md).

SPRINT_CAPACITY_SP:
  type: int
  help: >-
    Story points that fill a sprint and trigger the sprint-planning pass
    (workflows 14 + 15). Tune to your team's measured velocity after two sprints.
  default: 11

SPRINT_GRACE_SP:
  type: int
  help: >-
    Hard ceiling a sprint may stretch to when the next story would otherwise
    split badly. Must be greater than the capacity.
  default: 13
  validator: >-
    <: if SPRINT_GRACE_SP <= SPRINT_CAPACITY_SP :>
    The grace ceiling must be greater than SPRINT_CAPACITY_SP.
    <: endif :>

# ── Mobile frontend (optional) ───────────────────────────────────────────────
# Opt-in React Native + TypeScript app (Expo, Continuous Native Generation) at
# code/src/mobile/. When INCLUDE_MOBILE is false the tree is excluded above and the two
# tokens below are never asked. Defaults keep a web-only generation identical to a
# project generated before mobile existed.

INCLUDE_MOBILE:
  type: bool
  help: Include the optional React Native mobile frontend
  default: false

MOBILE_APP_NAME:
  type: str
  help: Display name shown under the app icon on the device
  default: "<% PROJECT_NAME %>"
  when: "<% INCLUDE_MOBILE %>"

MOBILE_BUNDLE_ID:
  type: str
  help: >-
    iOS bundle identifier and Android application ID. Reverse-domain form; it is
    permanent once the app is published to either store.
  default: "<% PRIMARY_DOMAIN.split('.') | reverse | join('.') | replace('-', '') %>"
  when: "<% INCLUDE_MOBILE %>"
  validator: >-
    <: if MOBILE_BUNDLE_ID != MOBILE_BUNDLE_ID | lower or '.' not in MOBILE_BUNDLE_ID
       or ' ' in MOBILE_BUNDLE_ID or '_' in MOBILE_BUNDLE_ID or '-' in MOBILE_BUNDLE_ID :>
    Use reverse-domain form: lowercase letters and digits, dot-separated, no hyphens or
    underscores (e.g. com.acme.acmeportal).
    <: endif :>

# ── Rust surface (optional) ──────────────────────────────────────────────────
# Opt-in Rust workspace at code/src/rust/, for PyO3 extension modules, standalone
# binaries, CLI tools and services. When INCLUDE_RUST is false the tree, its scripts,
# its guides, its workflow, its CI job, and its agent+skill pair are all excluded above.
#
# This gates AUTHORING, not consuming: a project that merely depends on a published
# PyO3 wheel installs it like any other dependency and needs no Rust toolchain, so it
# should answer false. Answer true only when this repository compiles Rust itself.
#
# Turning it on makes rustup a prerequisite for `uv sync` and adds a Rust stage to the
# backend image, because the PyO3 crate is a uv workspace member built by maturin.

INCLUDE_RUST:
  type: bool
  help: >-
    Include the optional Rust workspace (PyO3 extensions, binaries, CLI tools).
    Answer false if you only consume prebuilt wheels — this gates authoring.
  default: false

# ── Desktop surface (optional) ───────────────────────────────────────────────
# Opt-in native desktop application built with Slint, living as a member of the Rust
# workspace above. Gated on INCLUDE_RUST because Slint is Rust — the question is not
# asked at all on a project without it, and a skipped question keeps its default.
#
# LICENCE OBLIGATION: the app ships under Slint's Royalty-free licence, which permits
# proprietary and commercially sold desktop applications at no cost BUT REQUIRES that you
# disclose the use of Slint — the baseline app does this with the AboutSlint widget in its
# About dialog. Removing that disclosure without buying a Commercial licence is a breach.
# The Royalty-free licence also does not cover embedded systems, nor redistributing a
# library that exposes Slint's own APIs. See code/docs/DESKTOP.md.

INCLUDE_DESKTOP:
  type: bool
  help: >-
    Include the optional native desktop app (Slint). Ships under Slint's
    Royalty-free licence — commercial sale is fine, attribution is required.
  default: false
  when: "<% INCLUDE_RUST %>"

DESKTOP_APP_NAME:
  type: str
  help: Window title and application name shown to the user
  default: "<% PROJECT_NAME %>"
  when: "<% INCLUDE_DESKTOP %>"

# ── Meta ─────────────────────────────────────────────────────────────────────

DATE:
  type: str
  help: >-
    Baseline date stamped into every doc header (DD/MM/YYYY). It is answered once
    and kept, so `copier update` will not churn 280 headers on you.
  placeholder: 01/08/2026
  validator: >-
    <: if DATE | length != 10 or DATE[2] != '/' or DATE[5] != '/' :>
    Use DD/MM/YYYY.
    <: endif :>

# ── Migrations ───────────────────────────────────────────────────────────────
#
# Run on `copier update` only, never on `copier copy`, when the update crosses the
# declared version. They exist for the one thing Copier's merge cannot do on its
# own: move files the DEVELOPER wrote. Copier only tracks what it generated, so a
# renumbered or renamed directory takes its scaffolding to the new path and leaves
# every hand-written artefact behind — with no conflict and no error.
#
# The rule this implies: any release that moves a directory holding developer
# artefacts ships a migration in the same commit, or it silently eats work. The
# prevention is the frozen-numbering rule in project-management/src/CONTEXT.md;
# this is the cure for the one release that predated it.
#
# Scripts live in .copier/migrations/ and are read from the template clone
# (_copier_conf.src_path), which is why they are excluded from generation above —
# a project has no use for the migrations that produced it.

_migrations:
  - version: v2.0.0
    command: bash "<% _copier_conf.src_path %>/.copier/migrations/v2.0.0-renumber-src.sh"
    when: "<% _stage == 'after' %>"

  # v3.0.0 deletes `.claude/agents/` in full. Copier removes the definitions it
  # generated; one a project wrote ITSELF was never a template file, so it is left
  # behind in a directory nothing routes to — the 14-UPDATING.md silent-orphan failure
  # running in reverse. This reports those files and says how to relocate each as a
  # skill. Advisory: it never moves or deletes a definition and always exits 0, because
  # agent -> skill is a rewrite (frontmatter, and `skill-conformance.sh` to satisfy),
  # and a machine doing it would emit a skill that fails its own gate.
  - version: v3.0.0
    command: bash "<% _copier_conf.src_path %>/.copier/migrations/v3.0.0-self-authored-agents.sh"
    when: "<% _stage == 'after' %>"

  # .copier/ is a staging directory, not project content. _tasks empty it and remove
  # it — but _tasks run on `copy` only, so on an `update` the staged seeds land in the
  # project and simply sit there, looking like version files a developer might edit.
  #
  # Deliberately NOT version-scoped: it must hold for every future release that stages
  # a file this way, not just the one that introduced the problem. `rm -rf` on a
  # directory that is normally absent is a no-op, so running it on every update costs
  # nothing.
  - command: rm -rf .copier
    when: "<% _stage == 'after' %>"

# ── Post-generation ──────────────────────────────────────────────────────────

_tasks:
  # The project's README and its root version state ship from .copier/, because the
  # repo-root originals belong to syntek-base and are excluded above. Moving them
  # here — on `copy` only — is what makes them seed-once: `copier update` never runs
  # _tasks, so it can never overwrite a project's changelog with the template's.
  #
  # MAP-SCALE-PLANNING.md rides the same mechanism for a different reason. Six shipped
  # guides route to it, and a citation that resolves to nothing is the defect class
  # `audits/doc-references.sh` exists to prevent — so the project starts with the map
  # present and every row reading TBD. Seed-once matters here too: once /scale-planning
  # has filled it in, an update must never hand the project its blank stub back.
  #
  # MEMORY.md is the third case and the strictest, because it is the only one an AGENT
  # writes to unprompted: it must arrive with its headings and its writing rules and no
  # entries at all. `.github/scripts/shipped-memory.sh` holds it to that.
  - command: >-
      mv .copier/README.md README.md &&
      mv .copier/VERSION VERSION &&
      mv .copier/VERSION-HISTORY.md VERSION-HISTORY.md &&
      mv .copier/CHANGELOG.md CHANGELOG.md &&
      mv .copier/RELEASES.md RELEASES.md &&
      mv .copier/MAP-SCALE-PLANNING.md project-management/src/01-FEATURE/MAP-SCALE-PLANNING.md &&
      mv .copier/MEMORY.md .claude/MEMORY.md &&
      rmdir .copier
    when: "<% _copier_operation == 'copy' %>"

  # The template gitignores uv.lock so a wrongly-named lock can never be committed
  # during template development. A generated project is the opposite case: it MUST
  # commit the lock, because every Dockerfile builds with `uv sync --frozen`.
  - command: >-
      perl -0777 -i -pe
      's/^# Python lockfile — BASE TEMPLATE ONLY\.\n(?:#.*\n)*uv\.lock\n\n//m'
      .gitignore
    when: "<% _copier_operation == 'copy' %>"

  # Brand the manifest. `pyproject.toml` carries the house constant `syntek-base` rather
  # than a token, because uv validates [project] name as a package name and rejects the
  # delimiters outright — a token there made the whole repository unlockable, and took
  # basedpyright, pip-audit and every test suite down with it. The name is therefore
  # restored HERE, and this task MUST stay ahead of `uv lock` below so the lock is written
  # under the project's own slug rather than the template's.
  #
  # Anchored to the exact literal rather than `^name = `: [project] is not the only table
  # in this file that could ever carry a name key, and a loose pattern would rewrite the
  # first one it met.
  - command: >-
      perl -0777 -i -pe
      's/^name = "syntek-base"$/name = "<%PROJECT_SLUG%>"/m'
      pyproject.toml
    when: "<% _copier_operation == 'copy' %>"

  # Generate the lock the Dockerfiles need. Non-fatal: the guide tells you to run
  # `uv lock` by hand if uv is not installed yet.
  - command: >-
      command -v uv >/dev/null 2>&1 && uv lock
      || echo 'uv not found — run `uv lock` before your first container build.'

  - command: git init --initial-branch=main
    when: "<% _copier_operation == 'copy' %>"
